          properties:
            type:
              const: message.received
            data: {$ref: '#/components/schemas/MessageReceivedData'}

    MessageQuarantinedEvent:
      description: '`message.quarantined`: An inbound message is stored but quarantined.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: message.quarantined
            data: {$ref: '#/components/schemas/MessageQuarantinedData'}

    MessageReleasedEvent:
      description: '`message.released`: A quarantined message was released.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: message.released
            data: {$ref: '#/components/schemas/MessageReleasedData'}

    MessageTriagedEvent:
      description: '`message.triaged`: Triage finished (or failed).'
      allOf:
        - $ref: '#/components/schemas/EventBase'
