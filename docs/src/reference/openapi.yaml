openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Pylota Mail API
  version: '1.0.0'
  summary: Email and identity for AI agents, running on your own Cloudflare account.
  description: |
    The machine-readable contract for the Pylota Mail REST API. `docs/src/reference/api.md` is the
    readable version; if the two disagree, this document is the contract. A running deployment serves
    the same document, generated from the Rust types (`crates/api-types`, utoipa), at `/openapi.json`.

    ## Conventions

    - **Base URL.** Versioned endpoints live under `https://{host}/v1`. `/health`, `/openapi.json`,
      `/hooks/ses`, `/hooks/ses/inbound` and the `/.well-known/*` documents live at the host root; their
      path items override `servers`.
    - **Authentication.** `Authorization: Bearer pmk_live_…` (or `pmk_test_…`). Only `/health`,
      `/openapi.json`, `/v1/plans`, `/.well-known/*`, `/v1/links/{token}`, `/hooks/ses` and
      `/hooks/ses/inbound` are unauthenticated. `/v1/links/{token}` is checked by its signature, and the
      two `/hooks/ses*` endpoints by the SNS signature (version 2 only).
    - **Not described here.** The server-rendered console (`/console/*`, including `/console/sign-in…`,
      `/console/sign-up`, `/console/waitlist`, `/console/workspaces/new`,
      `/console/oauth/{provider}/start`, `/console/oauth/{provider}/callback`,
      `/console/settings/security`, `/console/settings/notifications`, `/console/plan/return`,
      `/console/connect` and the notification unsubscribe pair `/console/notifications/unsubscribe`) and
      `/billing/stripe/webhook` (Stripe events) are served by the same Worker but are not part of the
      developer API: they use session cookies, OAuth state, unsubscribe tokens and Stripe signatures, not
      API keys.
    - **Hosts.** The console answers on `PM_CONSOLE_HOST`, which defaults to `PM_API_HOST`. When the two
      differ, console paths answer only on `PM_CONSOLE_HOST`, and the API host `PM_API_HOST` serves only
      the REST API (`/v1/*`), MCP (`/mcp`), `/openapi.json`, `/health`, `/.well-known/*`, signed links
      (`/v1/links/*`), `/hooks/*` and `/billing/stripe/webhook`; anything else returns `404`, and no
      cookie is set or read on the API host.
    - **Format.** JSON (`application/json; charset=utf-8`). Times are RFC 3339 UTC strings. Sizes are bytes.
    - **IDs** are a type prefix, an underscore and a 26-character upper-case Crockford base32 ULID
      (`ten_ idn_ adr_ dom_ thr_ msg_ att_ whk_ dlv_ evt_ key_ era_ exp_ job_ aud_ req_ usr_ inv_ dlq_ hld_ prb_`).
    - **Pagination.** List endpoints take `limit` (default 25, max 100) and `cursor`, and return
      `{ "data": [...], "next_cursor": "…" | null }`. Cursors are opaque and expire after 24 hours
      (`410 cursor_expired`).
    - **Idempotency.** `Idempotency-Key` is required on send, reply, reply-all and forward (except on a
      dry run, `dry_run=true`, where it is optional and never recorded), and optional on every other
      `POST` except four (`x-idempotency: none`), which ignore it and never record it: the two signing
      endpoints (`…/assertions` and `…/http-signatures`) and the two SNS endpoints (`/hooks/ses` and
      `/hooks/ses/inbound`). Keys are kept for 30 days, scoped per
      identity for mail and per tenant for everything else. A replay returns the original response with the header `Idempotent-Replayed: true`
      (and `"deduplicated": true` in mail responses).
    - **Rate limits.** Every authenticated response carries `RateLimit-Limit`: the limit of the bucket that
      applied, per period. A `429` also carries `Retry-After` and `RateLimit-Reset`, the seconds to the end
      of the bucket's current period; for `rate_limited` the two are equal, and the other `429` codes set
      `Retry-After` to their own wait. `RateLimit-Remaining` is not sent: the Workers rate-limiting binding
      answers only allow or deny, so the Worker cannot know how many requests are left.
    - **Errors.** Every non-2xx response uses the `Error` envelope. Handle unknown error codes by HTTP status.
    - **Evolution.** Additive changes (new fields, new event types, new enum values) can happen within
      `/v1`. Clients must ignore unknown fields and handle unknown enum values, even where this document
      lists an `enum`.
    - **Untrusted content.** Every text field that comes from email (subjects, display names, filenames,
      bodies, attachment text, snippets) is untrusted. Show it to a model inside a clearly delimited block,
      never as instructions.

    ## Vendor extensions

    | Extension | On | Meaning |
    |---|---|---|
    | `x-required-permission` | operation | Array of permissions the key must hold, all of them. `[]` means any valid key |
    | `x-key-levels` | operation | Key levels (`platform`, `tenant`, `identity`) that can call the operation at all |
    | `x-permission-notes` | operation | Conditional permission or scope rules that the two fields above cannot express |
    | `x-rate-limit-buckets` | operation | Rate-limit buckets the request counts against (`api`, `search`, `agentic`, `send`, `sign`) |
    | `x-idempotency` | operation | `required`, `optional` or `none` for the `Idempotency-Key` header. `required` means a request without it fails with `400 idempotency_key_required`, except a dry run (`dry_run=true`). `none` means the header is ignored and never recorded |
    | `x-error-codes` | response | The `error.code` values this operation can return with that status |

    ## Licence

    Pylota Mail is licensed under FSL-1.1-ALv2 (Functional Source License, Version 1.1, ALv2 Future
    License): each release becomes available under Apache-2.0 two years after it is published. The text
    is in [`LICENSE.md`](https://github.com/PILOTAAI/pylota-mail/blob/main/LICENSE.md).
  license:
    name: FSL-1.1-ALv2
    identifier: FSL-1.1-ALv2
servers:
  - url: https://{host}/v1
    description: Versioned REST API of a deployment.
    variables:
      host:
        default: mail.example.com
        description: The deployment's API host (`PM_API_HOST`).
security:
  - apiKey: []
tags:
  - name: Meta
    description: Health, the OpenAPI document and the calling key.
  - name: Tenants
    description: Tenants and their policy. Platform keys with `tenants:manage`.
  - name: Identities
    description: Agent identities (one mailbox each).
  - name: Addresses
    description: The addresses of an identity, with promotion to primary and retirement.
  - name: Identity keys
    description: >-
      An identity's Ed25519 signing keys, agent assertions (signed JWTs) and signed HTTP requests (Web Bot
      Auth). Private keys never leave the Worker and no endpoint returns them.
  - name: Domains
    description: The platform domain and tenant domains, DNS records and health.
  - name: Threads
    description: Threads in an identity's mailbox.
  - name: Messages
    description: Messages, raw MIME, attachments, triage and quarantine release.
  - name: Sending
    description: Send, reply, reply-all, forward, cancel and resolve. `Idempotency-Key` is required on the first four, except on a dry run (`dry_run=true`).
  - name: Search
    description: Keyword, semantic, hybrid and agentic search, related messages, contacts and `wait`.
  - name: Quarantine
    description: Quarantined mail.
  - name: Webhooks
    description: Webhook endpoints, deliveries and replay. Reads need `webhooks:read`; everything else needs `webhooks:manage`, which includes `webhooks:read`.
  - name: Suppressions
    description: Suppressed recipients.
  - name: Lists
    description: Receive and send allow and block lists.
  - name: Keys
    description: API keys.
  - name: Privacy
    description: Erasure requests and subject-access exports.
  - name: Usage
    description: Plan, allowances, usage figures, the plan catalog and workspace billing accounts.
  - name: Audit
    description: Audit log.
  - name: Members
    description: Console members and invitations of a workspace. `members:manage`, tenant and platform keys.
  - name: Platform
    description: >-
      Platform operations: signing-key rotation, the dead-letter queue, maintenance jobs and waitlist
      invitations. Platform keys with `platform:ops`; every call is audit-logged.
  - name: Links and hooks
    description: Signed links and the two Amazon SES notification endpoints (delivery events and inbound mail). No API key.
  - name: Well-known
    description: >-
      Documents served at `/.well-known/` on the API host: the security contact, each identity's JWK Set
      and the Web Bot Auth key directory. No API key.
  - name: Events
    description: Webhook events delivered to your endpoints (Standard Webhooks).

paths:

  # ───────────────────────────────────────────── Meta ─────────────────────────────────────────────

  /health:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    get:
      operationId: getHealth
      tags: [Meta]
      summary: Health check
      description: >-
        No authentication. Reports that the Worker is serving, with its version, commit and `env`
        (`PM_ENV`). With an invalid configuration it returns `503 unavailable`.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: The Worker is serving requests.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example:
                status: ok
                version: '1.0.0'
                commit: abc1234
                env: production
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /openapi.json:
    servers:
      - url: https://{host}
        description: Deployment root (unversioned).
        variables:
          host:
            default: mail.example.com
            description: The deployment's API host (`PM_API_HOST`).
    get:
      operationId: getOpenApiDocument
      tags: [Meta]
      summary: OpenAPI document
      description: No authentication. The OpenAPI 3.1 document for this deployment, generated from the Rust types.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
          description: An OpenAPI 3.1.0 document equivalent to this one.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.1.0 document.
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    const: '3.1.0'
                  info:
                    type: object
                  paths:
                    type: object
        '500': {$ref: '#/components/responses/InternalError'}

  /me:
    get:
      operationId: getMe
      tags: [Meta]
      summary: Describe the calling key
      description: Any valid key. Describes the key that made the request.
      x-required-permission: []
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The calling key.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
              example:
                key_id: key_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                name: pylota-api
                level: tenant
                mode: live
                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                identity_id: null
                permissions: ['identities:read', 'messages:send', 'search:read']
                expires_at: null
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────────── Tenants ───────────────────────────────────────────

  /tenants:
    post:
      operationId: createTenant
      tags: [Tenants]
      summary: Create a tenant
      description: >-
        Platform keys only. `address_suffix` defaults to `"." + slug`; only one tenant (the default tenant
        made by `pmail setup`) can have an empty suffix. `policy` is merged over the defaults (built-in
        defaults, then `PM_DEFAULT_POLICY`). `owner` (optional) creates the workspace's console owner and
        emails them a sign-in link; without it, a platform key can add an owner later with an invitation
        and an ownership transfer in the console. `billing.mode` defaults to `metered` (plan `free`) on a
        deployment with billing on, and to `disabled` otherwise.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantCreateRequest'}
            example:
              slug: acme
              name: Acme Car Hire
              mode: live
              timezone: Europe/London
              address_suffix: .acme
              policy:
                identity_daily_send_cap: 500
              owner:
                email: sam@acmecarhire.example
                name: Sam Patel
              billing:
                mode: exempt
      responses:
        '201':
          description: The tenant was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: The slug or address suffix is taken, or the idempotency key is in use.
          x-error-codes: [slug_taken, suffix_taken, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listTenants
      tags: [Tenants]
      summary: List tenants
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only tenants with this status.
          schema: {$ref: '#/components/schemas/TenantStatus'}
        - name: mode
          in: query
          description: Only tenants with this mode.
          schema: {$ref: '#/components/schemas/Mode'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of tenants.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      operationId: getTenant
      tags: [Tenants]
      summary: Get a tenant
      description: Platform keys with `tenants:manage` can read any tenant. A tenant key can read its own tenant.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform, tenant]
      x-permission-notes: A tenant key can read its own tenant without `tenants:manage`.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The tenant, with its full effective policy.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTenant
      tags: [Tenants]
      summary: Update a tenant
      description: >-
        Updatable: `name`, `timezone`, `policy` (deep merge; `null` resets a field to its default) and
        `status` (`active` or `suspended`). While a tenant is suspended, inbound mail gets a temporary
        failure for up to five days and then a permanent one, and every send is refused (FR-TEN-3).
        Tenants are deleted through an erasure request with `scope: "tenant"`.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantUpdateRequest'}
            example:
              policy:
                max_recipients: 20
                retention:
                  raw_days: null
      responses:
        '200':
          description: The updated tenant.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ─────────────────────────────────────────── Identities ─────────────────────────────────────────

  /tenants/{tenant_id}/identities:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      operationId: createIdentity
      tags: [Identities]
      summary: Create an identity
      description: >-
        Creates an identity and its primary address: `{username}{tenant.address_suffix}@{platform domain}`,
        or `{username}@{domain}` when `domain_id` names a healthy tenant domain. The combined username and
        suffix can be at most 40 characters, leaving room for a thread token in the 64-character local
        part. `client_id` makes the create idempotent: the same `client_id` with the same body returns
        `200` and the existing identity; with a different body it returns `409 client_id_conflict`.
        `owner` is required before the identity can send (`identity_owner_required`).
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityCreateRequest'}
            example:
              username: bookings
              display_name: Acme Car Hire
              purpose: bookings
              owner:
                name: Sam Patel
                email: sam@acmecarhire.example
              signature:
                text: Acme Car Hire · 0113 496 0000
              domain_id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
              client_id: acme:bookings
              metadata:
                operator_id: op_123
      responses:
        '201':
          description: The identity was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '200':
          description: An identity with this `client_id` and the same body already exists. It is returned unchanged.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400':
          description: The request is invalid.
          x-error-codes: [invalid_request, invalid_idempotency_key, address_invalid, address_reserved, address_unsupported, local_part_too_long]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'The plan''s `inboxes` allowance is spent (`details.feature: "inboxes"`). Nothing was stored.'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The identity conflicts with an existing one, the idempotency key is in use, or the primary
            address on a `zone` subdomain would be the domain's 201st literal routing rule
            (`domain_in_use`, `details.reason = "routing_rule_limit"`).
          x-error-codes: [client_id_conflict, username_taken, address_taken, domain_not_ready, domain_in_use, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: The primary address on a `zone` subdomain needs a literal routing rule, and `PM_CF_API_TOKEN` is not set.
          x-error-codes: [cf_token_required]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listTenantIdentities
      tags: [Identities]
      summary: List a tenant's identities
      x-required-permission: ['identities:read']
      x-key-levels: [platform, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only identities with this status.
          schema: {$ref: '#/components/schemas/IdentityStatus'}
        - name: purpose
          in: query
          description: Only identities with this purpose tag.
          schema:
            type: string
        - name: client_id
          in: query
          description: Only the identity with this integrator `client_id`.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of identities.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities:
    get:
      operationId: listIdentities
      tags: [Identities]
      summary: List the identities the key can reach
      description: >-
        A platform key sees every identity and can filter by `tenant_id`. A tenant key sees its tenant's
        identities. An identity key sees only its own identity. The system identity (the sender of
        `PM_SYSTEM_FROM`) is never listed.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: status
          in: query
          description: Only identities with this status.
          schema: {$ref: '#/components/schemas/IdentityStatus'}
        - name: purpose
          in: query
          description: Only identities with this purpose tag.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of identities.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/lookup:
    get:
      operationId: lookupIdentity
      tags: [Identities]
      summary: Find the identity that owns an address
      description: >-
        Resolves any `active` or `retiring` address to its identity. Unknown, retired and out-of-scope
        addresses all return `404 identity_not_found`.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: address
          in: query
          required: true
          description: The address to resolve, for example `bookings@acme.example.com`.
          schema: {$ref: '#/components/schemas/EmailAddress'}
          example: bookings@acme.example.com
      responses:
        '200':
          description: The identity that owns the address.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: getIdentity
      tags: [Identities]
      summary: Get an identity
      x-required-permission: ['identities:read']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The identity.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateIdentity
      tags: [Identities]
      summary: Update, pause or resume an identity
      description: >-
        Updatable: `display_name`, `purpose`, `owner`, `signature`, `metadata`, `send_policy` and `status`
        (`active` or `paused`). A paused identity still receives and stores mail and refuses every send with
        `identity_paused` (FR-IDN-3). Setting `status: "active"` on an identity paused for
        `abuse_threshold` needs a platform or tenant key and is audit-logged.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-permission-notes: Resuming an identity paused for `abuse_threshold` needs a platform or tenant key, and is audit-logged.
      x-rate-limit-buckets: [api]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityUpdateRequest'}
            example:
              status: paused
      responses:
        '200':
          description: The updated identity.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteIdentity
      tags: [Identities]
      summary: Delete an identity
      description: >-
        Starts an identity-scope erasure (FR-IDN-4). The identity's addresses are tombstoned and can never
        be assigned to another identity; later mail to them gets `550 5.1.1`. Its signing keys are deleted
        and their key IDs tombstoned, so they are never published again ([O7]). While the identity is
        `deleting` or `deleted`, signing and its JWK Set return `404 identity_not_found`.
      x-required-permission: ['identities:write', 'erasure:manage']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '202':
          description: The erasure request of scope `identity`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ─────────────────────────────────────────── Addresses ──────────────────────────────────────────

  /identities/{identity_id}/addresses:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: listAddresses
      tags: [Addresses]
      summary: List an identity's addresses
      description: Every address of the identity, in every status.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of addresses.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AddressPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createAddress
      tags: [Addresses]
      summary: Add an alias address
      description: >-
        Creates an `alias`. Its status is `pending` until the domain is healthy, then `active`. Only one
        pending address per identity and domain is allowed: a newer request replaces an older pending one
        ([A11]). Emits `identity.address_added`, and `identity.address_activated` once active.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressCreateRequest'}
            example:
              local_part: bookings
              domain_id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
      responses:
        '201':
          description: The alias was created.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '400':
          description: The request is invalid.
          x-error-codes: [invalid_request, invalid_idempotency_key, address_invalid, address_unsupported, address_reserved, local_part_too_long]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The address is taken, the idempotency key is in use, or the address is on a `zone` subdomain that
            already has 200 literal routing rules (`domain_in_use`, `details.reason = "routing_rule_limit"`).
          x-error-codes: [address_taken, domain_in_use, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The identity already has 20 addresses in any state, or the address needs a literal routing rule
            and `PM_CF_API_TOKEN` is not set.
          x-error-codes: [address_limit_reached, cf_token_required]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}/promote:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    post:
      operationId: promoteAddress
      tags: [Addresses]
      summary: Make an address the primary
      description: >-
        Makes the address `primary`, so new threads send from it. The previous primary becomes an `alias`
        with status `retiring`, and its `retire_at` is set (default 90 days, range 0–365), with one
        exception: when the previous primary is the identity's **platform address**, it becomes an `active`
        alias instead. The platform address is the fallback address for domain failures (FR-DOM-6), so it is
        never retired. Existing threads keep replying from the address the counterparty wrote to
        (FR-ADR-2). Promoting a `retiring` address (or the platform address) back cancels the change: this
        is how you roll back (FR-ADR-4). Fails with `409 domain_not_ready` unless the domain is `healthy` or
        `degraded`. Emits `identity.address_promoted`.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoteAddressRequest'}
            example:
              retire_previous_after_days: 90
      responses:
        '200':
          description: The identity, with the new primary and the previous primary now `retiring` (or an `active` alias when it is the platform address).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The address's domain is not `healthy` or `degraded`, or the idempotency key is in use.
          x-error-codes: [domain_not_ready, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}/retire:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    post:
      operationId: retireAddress
      tags: [Addresses]
      summary: Retire an alias
      description: >-
        Moves an alias to `retiring`, or straight to `retired` when `after_days` is 0. A retiring address
        keeps receiving mail into the same identity; a retired one refuses mail with `550 5.1.6`
        (FR-ADR-3). The primary cannot be retired (`409 address_is_primary`), and neither can the
        identity's platform address (`409 address_in_use`), which stays active as the fallback address for
        the identity's whole life. Emits `identity.address_retired` when the address becomes `retired`.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetireAddressRequest'}
            example:
              after_days: 0
      responses:
        '200':
          description: The address, now `retiring` or `retired`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The address is the primary or the identity's platform address, or the idempotency key is in use.
          x-error-codes: [address_is_primary, address_in_use, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    delete:
      operationId: deleteAddress
      tags: [Addresses]
      summary: Delete a pending address
      description: >-
        Only for `pending` addresses that never received mail. Any other address returns
        `409 address_in_use`: retire it instead. The platform address can never be deleted.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '204':
          description: The pending address was deleted.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: The address is the primary, or is not a `pending` address that never received mail.
          x-error-codes: [address_is_primary, address_in_use]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/addresses/{address_id}/test-forwarding:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/AddressIdPath'
    post:
      operationId: testAddressForwarding
      tags: [Addresses]
      summary: Test that the customer's mailbox forwards to the identity
      description: >-
        For an address on a domain with `inbound: forward` (method `send_only`, or `smtp_relay` with
        `inbound: forward`); any other address returns `422 transport_unavailable` with
        `details.reason: "method_not_supported"`. Sends a short message to the address, from
        `mailer-daemon@{platform domain}` with the subject "Pylota Mail forwarding check" and a one-time
        token. If the token reaches the identity's platform address within 10 minutes, the address's
        `forwarding` becomes `ok`; otherwise `failed` ([N12]). The check is never stored as a message and
        does not count as a plan send. No webhook event is sent: read the address again for the result.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '202':
          description: The test message was sent. The address is returned as it stands; `forwarding` changes when the result arrives.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Address'}
              example:
                id: adr_01JA2B3C4D5E6F7G8H9J0K1M2N
                identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                address: bookings@brightwell.example
                local_part: bookings
                domain_id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
                role: primary
                status: active
                retire_at: null
                retired_at: null
                forwarding: unverified
                forwarding_checked_at: null
                created_at: '2026-10-09T10:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422':
          description: 'The address''s domain does not use `inbound: forward`.'
          x-error-codes: [transport_unavailable]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ───────────────────────────────────────── Identity keys ────────────────────────────────────────

  /identities/{identity_id}/keys:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    get:
      operationId: listIdentityKeys
      tags: [Identity keys]
      summary: List an identity's signing keys
      description: >-
        Every key the identity has, `retired` ones included, newest first, with its state, `created_at`,
        `verify_until` and public JWK. Private keys are never returned. Key management stays available
        while the identity is paused (including every identity of a suspended tenant), so a suspected leak
        can be handled before it resumes. A `deleting` or `deleted` identity returns `404 identity_not_found`.
      x-required-permission: ['identities:read']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: status
          in: query
          description: Only keys in this state.
          schema: {$ref: '#/components/schemas/IdentityKeyStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of keys, newest first.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityKeyPage'}
              example:
                data:
                  - kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                    identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                    status: active
                    alg: EdDSA
                    public_jwk:
                      kty: OKP
                      crv: Ed25519
                      x: NjwMjIq2mTA1VpuDzRvkMIfQ0sCSHWavo0KT_4FcKO0
                      kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                      alg: EdDSA
                      use: sig
                    created_at: '2026-10-09T09:00:00Z'
                    verify_until: null
                    retired_at: null
                  - kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                    identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                    status: retiring
                    alg: EdDSA
                    public_jwk:
                      kty: OKP
                      crv: Ed25519
                      x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                      kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                      alg: EdDSA
                      use: sig
                    created_at: '2026-10-02T09:00:00Z'
                    verify_until: '2026-10-16T09:00:00Z'
                    retired_at: null
                next_cursor: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: createIdentityKey
      tags: [Identity keys]
      summary: Create the identity's first signing key
      description: >-
        Creates the identity's first Ed25519 key when none is `active` and returns it with `201`; when an
        active key exists, returns it unchanged with `200`. No body is needed (an empty JSON object is
        accepted). Keys are also created lazily, on the identity's first signing request. The 32-byte seed
        comes from the platform CSPRNG, is sealed under `PM_MASTER_KEY` at once and never leaves the
        Worker. A thumbprint found in the key tombstones is refused and a new seed drawn. When a key is
        created, `identity.key_created` is emitted and the audit action is `identity_key.create`. Available
        while the identity is paused; a `deleting` or `deleted` identity returns `404 identity_not_found`.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '201':
          description: The identity had no active key; this one was created and is `active`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityKey'}
              example:
                kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                status: active
                alg: EdDSA
                public_jwk:
                  kty: OKP
                  crv: Ed25519
                  x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                  kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                  alg: EdDSA
                  use: sig
                created_at: '2026-10-02T09:00:00Z'
                verify_until: null
                retired_at: null
        '200':
          description: The identity already has an active key. It is returned unchanged and no event is emitted.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityKey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/keys/rotate:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: rotateIdentityKey
      tags: [Identity keys]
      summary: Rotate an identity's signing key
      description: >-
        Creates a new `active` key at once and moves the previous active key to `retiring`, with
        `verify_until` = now + `PM_IDENTITY_KEY_OVERLAP_DAYS` (default 7 days). The retiring key stays in
        the JWK Set and does not sign, so an assertion signed just before the rotation still verifies until
        then ([O2]); new assertions use the new key. With no active key, it creates the first one and
        `previous` is `null`. No body. Emits `identity.key_rotated`; the audit action is
        `identity_key.rotate`. Available while the identity is paused; a `deleting` or `deleted` identity
        returns `404 identity_not_found`.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: The new active key, and the previous key, now `retiring` (or `null`).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityKeyRotation'}
              example:
                key:
                  kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                  identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                  status: active
                  alg: EdDSA
                  public_jwk:
                    kty: OKP
                    crv: Ed25519
                    x: NjwMjIq2mTA1VpuDzRvkMIfQ0sCSHWavo0KT_4FcKO0
                    kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                    alg: EdDSA
                    use: sig
                  created_at: '2026-10-09T09:00:00Z'
                  verify_until: null
                  retired_at: null
                previous:
                  kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                  identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                  status: retiring
                  alg: EdDSA
                  public_jwk:
                    kty: OKP
                    crv: Ed25519
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                    kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                    alg: EdDSA
                    use: sig
                  created_at: '2026-10-02T09:00:00Z'
                  verify_until: '2026-10-16T09:00:00Z'
                  retired_at: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/keys/{kid}/revoke:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
      - $ref: '#/components/parameters/IdentityKeyKidPath'
    post:
      operationId: revokeIdentityKey
      tags: [Identity keys]
      summary: Revoke an identity's signing key
      description: >-
        Moves the key straight to `retired`, whatever its state, for a suspected compromise. It is absent
        from the next JWK Set response; verifiers cache the set for at most 5 minutes, so they stop
        accepting it within that time ([O3]). The row is kept until the identity is deleted, so its
        thumbprint is never reused. An unknown `kid` returns `404 key_not_found`. A key that is already
        `retired` is returned unchanged with `200`, and no event is emitted. Otherwise emits
        `identity.key_revoked`; the audit action is `identity_key.revoke`. No body. Available while the
        identity is paused.
      x-required-permission: ['identities:write']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: The key, now `retired` with `retired_at` set.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityKey'}
              example:
                kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                status: retired
                alg: EdDSA
                public_jwk:
                  kty: OKP
                  crv: Ed25519
                  x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                  kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
                  alg: EdDSA
                  use: sig
                created_at: '2026-10-02T09:00:00Z'
                verify_until: '2026-10-16T09:00:00Z'
                retired_at: '2026-10-09T10:30:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: >-
            The identity is unknown, out of scope, `deleting` or `deleted` (`identity_not_found`), or it has
            no key with this `kid` (`key_not_found`).
          x-error-codes: [identity_not_found, key_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/assertions:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: createAssertion
      tags: [Identity keys]
      summary: Mint an agent assertion
      description: |
        Mints a short-lived JWT, signed with the identity's active Ed25519 key, that any service can verify
        against the identity's JWK Set (`/.well-known/jwks/{identity_id}.json`). The identity's first
        signing request creates its key when it has none.

        - **Header**: `{"alg":"EdDSA","typ":"agent-assertion+jwt","kid":"<thumbprint>"}`.
        - **Claims**: `iss` (`https://{PM_API_HOST}`), `sub` (the identity ID), `aud` (the requested
          audience), `iat` and `nbf` (now), `exp` (now + `expires_in`), `jti` (a new ULID), `email` (the
          identity's primary address), `email_verified` (`true`), `name` (the display name), `org` (the
          workspace name), `accountable_human` (`true` when the identity has an accountable owner; the
          owner's name and address are never included), `ai_agent` (`true`), and `nonce` and `ext` when given.
        - **Not stored.** Each call mints a new token, so `Idempotency-Key` is ignored and never recorded.
          The token is never stored or logged; only a count is kept (`usage_daily` metric `assertions`).
          Signing is not metered against any plan allowance.
        - **Refusals**: `400 invalid_request` for a missing or invalid `audience`, an `expires_in` outside
          60–600 or an invalid `ext` ([O4], [O5], [O6]); `403 tenant_suspended` when the tenant is suspended (checked first, as on sends);
          `409 identity_paused` for a paused identity; `404 identity_not_found` for a `deleting` or
          `deleted` identity ([O1]).

        A verifier checks `alg` and `typ`, trusts only the issuers it knows, fetches
        `{iss}/.well-known/jwks/{sub}.json` (caching it for at most 5 minutes), verifies the signature, and
        checks `aud`, `nbf` and `exp` with 60 seconds of clock skew and `jti` against replays
        (`project/design/agent-keys.md`, section 4.3). The Rust SDK does this in `verify_assertion`.
      x-required-permission: ['identities:sign']
      x-key-levels: [tenant, identity]
      x-permission-notes: Platform keys cannot hold `identities:sign`. An identity key signs only as its own identity.
      x-rate-limit-buckets: [api, sign]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssertionRequest'}
            example:
              audience: https://portal.supplier.example
              expires_in: 300
              nonce: b3f1c2d47a9e
              ext:
                booking_ref: BK-2291
      responses:
        '201':
          description: The assertion. It is not stored, so keep it until it expires.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssertionResponse'}
              example:
                assertion: eyJhbGciOiJFZERTQSIsInR5cCI6ImFnZW50LWFzc2VydGlvbitqd3QiLCJraWQiOiJ6TWtVbUFRT2xxOUp0RlB6VEsxWElOWmRXZDdnbWhYeGdBOFBoN2NOS0hvIn0..zXMLhbxydQao1zuFx3DOdVpo9gXgDCn9iYUcCDtJdGak3-oQkHl58mKW0YIT3AUbMyKK-7KYZXjWiYVKsa_pDQ
                kid: zMkUmAQOlq9JtFPzTK1XINZdWd7gmhXxgA8Ph7cNKHo
                expires_at: '2026-10-09T12:05:00Z'
                jwks_uri: https://mail.example.com/.well-known/jwks/idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y.json
        '400':
          description: >-
            The request is invalid: `audience` missing, longer than 256 characters or not printable ASCII;
            `expires_in` outside 60–600; `nonce` invalid; or `ext` larger than 2 KB as JSON or using a claim
            name the service sets ([O4], [O5], [O6]). `details.errors[]` names the field. Nothing is signed.
          x-error-codes: [invalid_request]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The key lacks `identities:sign` (platform keys can never hold it), or the identity is outside the key's scope, or the tenant is suspended (checked before the identity's pause, as on sends).
          x-error-codes: [permission_denied, scope_denied, tenant_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: The identity is unknown, out of scope, `deleting` or `deleted`.
          x-error-codes: [identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            The identity is paused. Nothing is signed ([O1]). An identity of a suspended tenant gets
            `403 tenant_suspended` first.
          x-error-codes: [identity_paused]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: >-
            Over a rate limit: the key's request limit, or `RL_SIGN`, 600 signing calls a minute per identity
            for assertions and HTTP signatures together.
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /identities/{identity_id}/http-signatures:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: createHttpSignature
      tags: [Identity keys]
      summary: Sign an HTTP request (Web Bot Auth)
      description: |
        Returns the headers that turn an HTTP request into a Web Bot Auth signed request (RFC 9421), signed
        with the deployment's active `web_bot_auth` key, with the identity's primary address in a signed
        `From` header. The Worker never makes the request itself, and nothing is created or stored.

        - **`Signature-Agent`** is a structured-field string, in double quotes, naming the deployment's
          origin; its key directory is at `/.well-known/http-message-signatures-directory` there.
        - **`From`** carries the identity's primary address (RFC 9110: whoever is responsible for the request).
        - **`Signature-Input`** and **`Signature`**: the signature base is built as in RFC 9421 section 2.5,
          with `alg="ed25519"`, `keyid` (the deployment key's JWK thumbprint), a `nonce` of 64 random bytes
          (base64), `tag="web-bot-auth"`, `created` and `expires`.
        - An internationalised host becomes its A-label in `@authority`; a component whose value is not
          ASCII is refused with `400 invalid_request` ([O10]). An `expires_in` outside 30–300 seconds is
          refused ([O11]).
        - `Idempotency-Key` is ignored and never recorded. Only a count is kept (`usage_daily` metric
          `http_signatures`); signatures are not logged. Signing is not metered against any plan allowance.
        - **Refusals**: `422 web_bot_auth_disabled` while `PM_WEB_BOT_AUTH=off` ([O9]); `403 policy_denied`
          while tenant policy `web_bot_auth.allowed` is `false`, the default ([O13]); `403 tenant_suspended`
          when the tenant is suspended (checked first, as on sends); `409 identity_paused` for a paused identity; `404 identity_not_found` for
          a `deleting` or `deleted` identity ([O1]).

        `PM_WEB_BOT_AUTH` can be turned on only after spike S13 has passed; until then signed HTTP requests
        are off and assertions are unaffected.
      x-required-permission: ['identities:sign']
      x-key-levels: [tenant, identity]
      x-permission-notes: Platform keys cannot hold `identities:sign`. An identity key signs only as its own identity. The tenant must also have opted in (`policy.web_bot_auth.allowed`).
      x-rate-limit-buckets: [api, sign]
      x-idempotency: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HttpSignatureRequest'}
            example:
              url: https://www.brightwell.example/fleet/availability?from=2026-10-12
              method: GET
              expires_in: 60
              components: ['@authority', signature-agent, from]
      responses:
        '200':
          description: The four headers to attach to the request, and when the signature expires.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HttpSignatureResponse'}
              example:
                headers:
                  Signature-Agent: '"https://mail.example.com"'
                  From: bookings.acme@agents.example
                  Signature-Input: 'sig1=("@authority" "signature-agent" "from");created=1791547200;expires=1791547260;keyid="poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U";alg="ed25519";nonce="e8N7S2MFd/qrd6T2R3tdfAuuANngKI7LFtKYI/vowzk4lAZYadIX6wW25MwG7DCT9RUKAJ0qVkU0mEeLElW1qg==";tag="web-bot-auth"'
                  Signature: 'sig1=:jdq0SqOwHdyHr9+r5jw3iYZH6aNGKijYp/EstF4RQTQdi5N5YYKrD+mCT1HA1nZDsi6nJKuHxUi/5Syp3rLWBA==:'
                expires_at: '2026-10-09T12:01:00Z'
        '400':
          description: >-
            The request is invalid: `url` missing, not `https` or longer than 2,048 characters; `method` not an
            upper-case token, or missing while `components` has `@method`; `expires_in` outside 30–300 ([O11]); a component that is not allowed, or whose
            value is not ASCII ([O10]). `details.errors[]` names the field. Nothing is signed.
          x-error-codes: [invalid_request]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: >-
            The key lacks `identities:sign` (platform keys can never hold it) or the identity is outside its
            scope; or the tenant has not opted in to signed HTTP requests (`policy_denied`: tenant policy
            `web_bot_auth.allowed` is `false`, [O13]); or the tenant is suspended (`tenant_suspended`, checked
            before the identity's pause, as on sends).
          x-error-codes: [permission_denied, scope_denied, policy_denied, tenant_suspended]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: policy_denied
                  message: This workspace has not turned on signed HTTP requests.
                  retryable: false
                  fix: Ask a platform operator to set web_bot_auth.allowed to true in the tenant's policy.
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
        '404':
          description: The identity is unknown, out of scope, `deleting` or `deleted`.
          x-error-codes: [identity_not_found]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: >-
            The identity is paused. Nothing is signed ([O1]). An identity of a suspended tenant gets
            `403 tenant_suspended` first.
          x-error-codes: [identity_paused]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: Signed HTTP requests are turned off on this deployment (`PM_WEB_BOT_AUTH=off`, the default) ([O9]).
          x-error-codes: [web_bot_auth_disabled]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: >-
            Over a rate limit: the key's request limit, or `RL_SIGN`, 600 signing calls a minute per identity
            for assertions and HTTP signatures together.
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  # ──────────────────────────────────────────── Domains ───────────────────────────────────────────

  /tenants/{tenant_id}/domains:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    post:
      operationId: createDomain
      tags: [Domains]
      summary: Add a tenant domain
      description: |
        Adds a domain with one of six connection methods (FR-DOM-7) and returns it in `pending` state. Its
        `records` are read from the provider APIs at that moment, never from templates (FR-DOM-3). The
        method fixes the domain's `kind`, `inbound` and `transport` (see `DomainMethod`).

        `method` is required for new clients. When it is absent, the old `kind` is mapped: `zone` →
        `cloudflare_zone`, `external` → `send_only`; `kind: zone` with `create_zone: true` is the old
        spelling of `nameservers`.

        - **`cloudflare_zone`, `nameservers`, `delegated_subdomain`** need `PM_CF_API_TOKEN`
          (`422 cf_token_required`). For an apex `cloudflare_zone`, `pmail domains add --local-token` with the
          operator's own Cloudflare token works instead (catch-all, no literal rules).
        - **`nameservers`** creates the zone. Tenant keys need the policy `domains.allow_create_zone: true`
          (`422 transport_unavailable`, `zone_creation_not_allowed`). A name with A, AAAA or MX records, or a
          `www` CNAME, A or AAAA record, needs `confirm_dedicated: true` (`409 domain_not_dedicated`, with
          `details.records`) ([N21]). The response's `records` are the zone's `NS` records for the
          registrar. A zone not activated within 28 days is deleted by Cloudflare and the domain becomes
          `removed` (`zone_expired`) ([N23]).
        - **`delegated_subdomain`** needs `PM_CF_SUBDOMAIN_SETUP=on` (`422 transport_unavailable`,
          `subdomain_setup_disabled`) and a Cloudflare Enterprise account.
        - Both zone-creating methods: a zone hold returns `409 zone_hold` ([N24]); Cloudflare error 1105
          returns `429 upstream_rate_limited` with `Retry-After` and `details.retry_after` of `10800`
          ([N22]).
        - **`dns_records`, `send_only`** need the SES transport (`ses_not_configured`); `dns_records`, and
          `smtp_relay` with `inbound: ses`, also need SES receiving (`ses_receiving_not_configured`). A
          method that needs an SES identity fails with `ses_identity_limit` once the region holds 10,000.
          All are `422 transport_unavailable`.
        - **`smtp_relay`**: `smtp.port` must be `465` or `587` (`400 smtp_port_not_allowed`). The Worker
          connects once (EHLO, STARTTLS, AUTH, QUIT) before it stores anything: no STARTTLS on 587 (or TLS
          on 465) returns `422 smtp_tls_required` without sending the credentials, a `535` to AUTH returns
          `422 smtp_auth_failed`, and a connection that cannot be made returns `502 upstream_error`. The
          domain sends only after an alignment probe passes.
        - `replace_mx` (default `false`): a `cloudflare_zone` apex or a `dns_records` domain that already
          has MX records is refused with `409 existing_mx` unless this is `true` ([H5]).
        - An apex whose merged SPF record would need more than 10 DNS lookups (or more than 2 void lookups)
          is refused with `400 spf_lookup_limit`; `details.lookups` gives the count and `fix` names the
          includes to flatten ([H2]).
      x-required-permission: ['domains:write']
      x-key-levels: [platform, tenant]
      x-permission-notes: '`nameservers` (or the old `create_zone: true`) needs a platform key, or a tenant key whose policy has `domains.allow_create_zone: true`.'
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DomainCreateRequest'}
            examples:
              dns_records:
                summary: A subdomain whose DNS stays at the customer's DNS host
                value:
                  name: agents.brightwell.example
                  method: dns_records
                  receiving: true
                  sending: true
                  replace_mx: false
              nameservers:
                summary: A new domain used only for mail
                value:
                  name: brightwell-agents.example
                  method: nameservers
                  confirm_dedicated: false
              smtp_relay:
                summary: Sending through the customer's own provider
                value:
                  name: brightwell.example
                  method: smtp_relay
                  inbound: forward
                  smtp:
                    host: smtp.provider.example
                    port: 587
                    username: agents@brightwell.example
                    password: example-app-password
                    probe_from: agents@brightwell.example
              legacy_kind:
                summary: Old spelling (kind zone, mapped to cloudflare_zone)
                value:
                  name: mail.brightwell.example
                  kind: zone
                  receiving: true
                  sending: true
                  replace_mx: false
      responses:
        '201':
          description: The domain was added, in `pending` state.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Domain'}
        '400':
          description: >-
            The request is invalid, the apex's merged SPF record would need too many DNS lookups
            (`spf_lookup_limit`, with `details.lookups`), or `smtp.port` is not `465` or `587`
            (`smtp_port_not_allowed`).
          x-error-codes: [invalid_request, invalid_idempotency_key, spf_lookup_limit, smtp_port_not_allowed]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '402':
          $ref: '#/components/responses/BillingLimit'
          description: 'The plan''s `custom_domains` allowance is spent (`details.feature: "custom_domains"`). Nothing was stored.'
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            The domain is already registered in this deployment; the name already has MX records and
            `replace_mx` is not `true`; a `nameservers` name is not dedicated to mail and
            `confirm_dedicated` is not `true` (`details.records`); Cloudflare refused the zone because of a
            zone hold; or the idempotency key is in use.
          x-error-codes: [domain_exists, existing_mx, domain_not_dedicated, zone_hold, idempotency_conflict, request_in_progress]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: domain_not_dedicated
                  message: brightwell-agents.example already has a website and mail.
                  retryable: false
                  fix: Moving the nameservers would stop the website and mail on this domain. Use a domain only for mail, or send confirm_dedicated true.
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    records:
                      - type: A
                        name: brightwell-agents.example
                        value: 203.0.113.10
                      - type: MX
                        name: brightwell-agents.example
                        value: 10 mx.mailhost.example
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          description: >-
            The deployment or the method cannot add this domain (`transport_unavailable`, with
            `details.reason`); the SMTP relay does not offer TLS (`smtp_tls_required`) or refused the
            credentials (`smtp_auth_failed`); or the method needs `PM_CF_API_TOKEN`, which is not set
            (`cf_token_required`).
          x-error-codes: [transport_unavailable, smtp_tls_required, smtp_auth_failed, cf_token_required]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: transport_unavailable
                  message: This deployment does not receive mail through Amazon SES.
                  retryable: false
                  fix: Run pmail setup ses to configure SES receiving, or use another connection method.
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: ses_receiving_not_configured
        '429':
          description: >-
            A rate limit was hit (`rate_limited`), or a provider's limit stopped the create
            (`upstream_rate_limited`): Cloudflare refused to create a zone with error 1105 (`Retry-After` and
            `details.retry_after` are `10800`), or the deployment's SES control-plane budget of one call per
            second had no slot within 5 seconds (`Retry-After` is the wait).
          x-error-codes: [rate_limited, upstream_rate_limited]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            Retry-After: {$ref: '#/components/headers/Retry-After'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500': {$ref: '#/components/responses/InternalError'}
        '502':
          $ref: '#/components/responses/UpstreamError'
          description: A Cloudflare or SES API returned an unexpected error, or the SMTP relay could not be reached (`smtp_relay`). Retry with backoff.
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
    get:
      operationId: listTenantDomains
      tags: [Domains]
      summary: List a tenant's domains
      description: >-
        The tenant's domains. The platform domain is visible to every key, with `tenant_id: null`, and is
        included in this list. An identity key with `domains:read` can read its tenant's domains.
      x-required-permission: ['domains:read']
