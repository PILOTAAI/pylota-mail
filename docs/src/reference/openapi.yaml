          properties:
            type:
              const: message.complained
            data: {$ref: '#/components/schemas/MessageComplainedData'}

    MessageRejectedEvent:
      description: '`message.rejected`: The transport refused the message before sending.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: message.rejected
            data: {$ref: '#/components/schemas/MessageRejectedData'}

    MessageFailedEvent:
      description: '`message.failed`: The message could not be sent.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: message.failed
            data: {$ref: '#/components/schemas/MessageFailedData'}

    MessageUncertainEvent:
      description: '`message.uncertain`: The outcome is unknown; the message is never resent automatically.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
