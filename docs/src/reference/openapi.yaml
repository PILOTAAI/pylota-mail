  # ───────────────────────────────────────────── Keys ─────────────────────────────────────────────

  /keys:
    post:
      operationId: createKey
      tags: [Keys]
      summary: Create an API key
      description: >-
        The new key's level, tenant, identity and permissions must all lie within the caller's own,
        otherwise `403 key_scope_exceeded` (FR-KEY-1). A tenant or identity key's `mode` follows its tenant.
        The response carries `secret` (`pmk_live_…` or `pmk_test_…`), **shown only once**; only a keyed
        hash is stored (FR-KEY-2).

        - **Explicit permissions.** `permissions` is required at every level, `platform` included: there is
          no implicit full set. A missing or empty list is `400 invalid_request`.
        - **Permissions tied to levels.** A permission the new key's level cannot hold is refused, whoever
          the caller is, with `400 invalid_request` and `details.reason = "permission_not_allowed_for_level"`: `tenants:manage`
          and `platform:ops` on a tenant or identity key; `members:read`, `members:manage`,
          `suppressions:manage`, `audit:read` and `usage:read` on an identity key (an identity key holds
          `usage:read` implicitly for its own workspace's `GET /v1/usage`); `identities:sign` on a platform
          key. The table is under `Permission`.
        - **Order.** These two checks run first; the scope check (`403 key_scope_exceeded`) comes after them.
      x-required-permission: ['keys:manage']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiKeyCreateRequest'}
            example:
              name: bookings-agent
              level: identity
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              permissions: ['messages:read', 'messages:send', 'search:read', 'attachments:read', 'identities:sign']
              expires_at: '2027-10-09T00:00:00Z'
      responses:
        '201':
          description: The key, with its secret (shown only once).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyCreated'}
        '400':
          description: >-
            The request is invalid (`details.errors[]` holds `{path, message}`): for example `permissions`
            missing or empty, or `tenant_id` or `identity_id` missing for the level. A permission the new
            key's level cannot hold is `invalid_request` with `details.reason =
            "permission_not_allowed_for_level"`.
          x-error-codes: [invalid_request, invalid_idempotency_key]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: invalid_request
                  message: A platform key cannot hold identities:sign.
                  retryable: false
                  fix: Remove identities:sign, or create a tenant or identity key to sign as an identity.
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    reason: permission_not_allowed_for_level
                    errors:
                      - path: permissions[2]
                        message: identities:sign cannot be held by a platform key
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: The key lacks `keys:manage`, the target is out of scope, or the new key would be wider than the caller.
          x-error-codes: [permission_denied, scope_denied, key_scope_exceeded, tenant_suspended]
