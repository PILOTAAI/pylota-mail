          properties:
            type:
              const: message.bounced
            data: {$ref: '#/components/schemas/MessageBouncedData'}

    MessageComplainedEvent:
      description: '`message.complained`: A recipient reported spam.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
