  # ────────────────────────────────────── Platform operations ─────────────────────────────────────

  /platform/keys/{purpose}/rotate:
    parameters:
      - $ref: '#/components/parameters/SigningKeyPurposePath'
    post:
      operationId: rotateSigningKey
      tags: [Platform]
      summary: Rotate a thread, link, cursor or Web Bot Auth signing key
      description: |
        Generates a new key inside the Worker and makes it current. No body. Key material is never
        returned, by this or any other endpoint.

        | `purpose` | Signs | Previous key verifies for |
        |---|---|---|
        | `thread` | Thread tokens | 90 days |
        | `link` | Download links, console sign-in, invitation and session tokens, and OAuth state hashes | 7 days |
        | `cursor` | Search cursors (the cursor lifetime) | 24 hours |
        | `web_bot_auth` | Web Bot Auth HTTP signatures and the key directory. Its `kid` is the key's 43-character JWK thumbprint, where the other purposes use one character | 7 days (it stays in the key directory) |

        With `revoke_previous=true`, the previous key is deleted in the same D1 batch, so what it signed
        stops verifying at once: thread tokens fall back to header threading; open links, console sign-in
        tokens, invitations, sessions and OAuth flows under it fail; open search cursors fail with
        `400 invalid_request`; a previous `web_bot_auth` key leaves the key directory. The response then has
        `previous.verify_until` equal to the rotation time and `previous.revoked: true`. After a suspected
        leak, rotate with `revoke_previous=true`, then rotate `PM_MASTER_KEY`. Rotating `web_bot_auth` while
        `PM_WEB_BOT_AUTH=off` returns `422 web_bot_auth_disabled` ([O9]). Audit action `signing_key.rotate`
        (for every purpose, `web_bot_auth` included), with `details.revoke_previous`.
      x-required-permission: ['platform:ops']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - name: revoke_previous
          in: query
          description: Delete the previous key now instead of letting it verify for its window.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The new current key's ID and the previous key's verification window.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningKeyRotation'}
              examples:
                rotate:
                  summary: A normal rotation
                  value:
                    purpose: thread
                    kid: '4'
                    created_at: '2026-10-09T10:00:00Z'
                    previous:
                      kid: '3'
                      verify_until: '2027-01-07T10:00:00Z'
                      revoked: false
                revoke_previous:
                  summary: With revoke_previous=true, after a suspected leak
                  value:
                    purpose: cursor
                    kid: 'B'
                    created_at: '2026-10-09T10:00:00Z'
                    previous:
                      kid: 'A'
                      verify_until: '2026-10-09T10:00:00Z'
                      revoked: true
                web_bot_auth:
                  summary: The Web Bot Auth deployment key
                  value:
                    purpose: web_bot_auth
                    kid: poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U
                    created_at: '2026-10-09T10:00:00Z'
                    previous:
                      kid: 521omx3NZ4BMQZPNvThhZbY7uITn_wjh09-53ZFC0wk
                      verify_until: '2026-10-16T10:00:00Z'
                      revoked: false
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422':
          description: '`purpose` is `web_bot_auth` and signed HTTP requests are turned off (`PM_WEB_BOT_AUTH=off`) ([O9]).'
          x-error-codes: [web_bot_auth_disabled]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

