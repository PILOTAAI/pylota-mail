  # ──────────────────────────────────────────── Search ────────────────────────────────────────────

  /identities/{identity_id}/search:
    parameters:
      - $ref: '#/components/parameters/IdentityIdPath'
    post:
      operationId: searchIdentity
      tags: [Search]
      summary: Search an identity's mailbox
      description: |
        One request shape and one result shape for four modes (FR-SRCH-1): `keyword` (FTS5 BM25 plus exact
        references), `semantic` (Vectorize), `hybrid` (the default: reciprocal-rank fusion, then reranking)
        and `agentic` (a bounded plan, search, judge and refine loop with a cited answer whose citations are
        checked by code).

        `q` uses the query language: `from:` `to:` `participant:` `subject:` `ref:` `label:`
        `has:attachment` `filename:` `type:` `after:` `before:` `newer_than:` `older_than:`
        `in:inbound|outbound` `thread:` `is:unread|needs_reply|quarantined` `category:`, quoted phrases,
        `OR` and `-` negation. A query that cannot be parsed returns `400 invalid_query`.

        - When a mode's dependency is unavailable, search degrades and sets `degraded: true`, unless the
          request set `require_mode: true`, in which case it returns `503 search_degraded`.
        - Quarantined mail is excluded unless `include_quarantined: true` and the key holds
          `quarantine:review` ([F7]).
        - Results respect `limit`, `snippet_chars` and a 256 KB response cap that sets `truncated` ([F8]).
          Cursors pin `as_of`, so pages stay stable while mail arrives (FR-SRCH-6).

        **Agentic mode** (`mode: "agentic"`, an `AgenticRequest`) returns an `AgenticResponse`. With
        `stream: true` and `Accept: text/event-stream`, the response is a server-sent event stream instead.
      x-required-permission: ['search:read']
      x-key-levels: [platform, tenant, identity]
      x-permission-notes: '`mode: "agentic"` needs `search:agentic`. `include_quarantined: true` returns quarantined mail only if the key also holds `quarantine:review`.'
      x-rate-limit-buckets: [api, search, agentic]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SearchRequest'
                - $ref: '#/components/schemas/AgenticRequest'
            examples:
              hybrid:
                summary: Hybrid search with operators
                value:
                  q: from:@brightwell.example ref:AB12CDE has:attachment newer_than:45d
                  mode: hybrid
                  filters:
                    direction: inbound
                    labels: []
                    after: null
                    before: null
                  group_by: message
                  limit: 10
                  snippet_chars: 240
                  facets: true
                  include_quarantined: false
                  cursor: null
              agentic:
                summary: Agentic search
                value:
                  q: Did the insurer accept the Golf claim after we sent the photos?
                  mode: agentic
                  budget:
                    max_steps: 6
                    max_seconds: 8
                  stream: false
      responses:
        '200':
          description: >-
            A `SearchResponse` for `keyword`, `semantic` and `hybrid`; an `AgenticResponse` for `agentic`;
            or, for `agentic` with `stream: true` and `Accept: text/event-stream`, an event stream.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SearchResponse'
                  - $ref: '#/components/schemas/AgenticResponse'
              examples:
                hybrid:
                  summary: Hybrid search response
                  value:
                    query:
                      parsed: from:@brightwell.example ref:AB12CDE has:attachment newer_than:45d
                      mode: hybrid
                    hits:
                      - message_id: msg_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                        thread_id: thr_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                        identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                        date: '2026-09-14T08:12:00Z'
                        direction: inbound
                        from:
                          name: Brightwell Leeds
                          address: accounts@brightwell.example
                        subject: Invoice 88213 – AB12 CDE
