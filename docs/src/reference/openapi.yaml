            example:
              id: evt_01J9Z7K8V4QW7X2M5N6P8R0T1Y
              type: webhook.test
              api_version: '2026-10-01'
              occurred_at: '2026-10-09T10:30:00.000Z'
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              identity_id: null
              sequence: null
