          required: [type, data]
          properties:
            type:
              const: message.triaged
            data: {$ref: '#/components/schemas/MessageTriagedData'}

    MessageSentEvent:
      description: '`message.sent`: The transport accepted an outbound message.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: message.sent
            data: {$ref: '#/components/schemas/MessageSentData'}

    MessageDeliveredEvent:
      description: '`message.delivered`: A recipient''s server accepted the message.'
      allOf:
