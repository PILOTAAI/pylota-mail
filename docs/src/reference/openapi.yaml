      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TenantSearchRequest'
                - $ref: '#/components/schemas/TenantAgenticRequest'
            example:
              q: 'ref:AB12CDE'
              mode: hybrid
              identity_ids: [idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y, idn_01JA2B3C4D5E6F7G8H9J0K1M2N]
              group_by: thread
      responses:
        '200':
          description: >-
