components:

  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: pmk_live_<lookup12>_<secret> | pmk_test_<lookup12>_<secret>
      description: >-
        An API key sent as a bearer token: `Authorization: Bearer pmk_live_…`. Keys have a level
        (`platform`, `tenant` or `identity`) and a list of permissions; scope always comes from the key,
        never from the request body (FR-KEY-3). Only a keyed hash of the secret is stored.

  parameters:

    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page. Opaque; expires after 24 hours (`410 cursor_expired`).
      schema:
        type: string
        minLength: 1
    After:
      name: after
      in: query
      description: Only items at or after this time (RFC 3339).
      schema:
        type: string
        format: date-time
    Before:
      name: before
      in: query
      description: Only items before this time (RFC 3339).
      schema:
        type: string
        format: date-time
    Include:
      name: include
      in: query
      description: >-
        Comma-separated extras for each message: `quoted` adds the full plain `text`, `html` adds the
        sanitised `html`, `headers` adds the original `headers`.
      style: form
      explode: false
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum: [quoted, html, headers]
      example: [html, headers]
    TenantIdQuery:
      name: tenant_id
      in: query
      description: Platform keys only. Restrict to one tenant. Other keys are always restricted to their own tenant.
      schema: {$ref: '#/components/schemas/TenantId'}
    IdempotencyKeySend:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Required on every real send, reply, reply-all and forward; optional on a dry run (`dry_run=true`),
        where it is never recorded. 1–255 printable ASCII characters, unique per message. Kept for 30 days,
        scoped to the identity. Reuse the same key on every retry of the same request. Missing:
        `400 idempotency_key_required`; malformed: `400 invalid_idempotency_key`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x20-\x7E]{1,255}$'
      example: bk-2291-confirm
    DryRun:
      name: dry_run
      in: query
      required: false
      description: >-
        `true` runs every check (permissions, policy, recipients, suppressions and lists, size) without
        sending or storing anything, taking quota or locking the thread, and returns `200` with a
        `DryRunResult`. `Idempotency-Key` is optional and never recorded.
      schema:
        type: boolean
        default: false
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional. 1–255 printable ASCII characters. Kept for 30 days, scoped to the tenant (or the platform
        for platform-level requests). The same key with the same request returns the original response with
        `Idempotent-Replayed: true`; with a different request, `409 idempotency_conflict`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[\x20-\x7E]{1,255}$'

    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/TenantId'}
    IdentityIdPath:
      name: identity_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IdentityId'}
    AddressIdPath:
      name: address_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AddressId'}
    DomainIdPath:
      name: domain_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DomainId'}
    ThreadIdPath:
      name: thread_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ThreadId'}
    MessageIdPath:
      name: message_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/MessageId'}
    AttachmentIdPath:
      name: attachment_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AttachmentId'}
    WebhookIdPath:
      name: webhook_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/WebhookId'}
    KeyIdPath:
      name: key_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/KeyId'}
    ErasureIdPath:
      name: erasure_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ErasureRequestId'}
    ExportIdPath:
      name: export_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ExportId'}
    InvitationIdPath:
      name: invitation_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/InvitationId'}
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UserId'}
    DlqIdPath:
      name: dlq_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/DlqItemId'}
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/JobId'}
    IdentityKeyKidPath:
      name: kid
      in: path
      required: true
      description: The identity key's ID, its RFC 7638 JWK thumbprint (base64url, 43 characters).
      schema: {$ref: '#/components/schemas/IdentityKeyKid'}
    SigningKeyPurposePath:
      name: purpose
      in: path
      required: true
      description: '`thread` (thread tokens), `link` (download links, console sign-in, invitation and session tokens, OAuth state hashes), `cursor` (search cursors) or `web_bot_auth` (Web Bot Auth HTTP signatures and the key directory).'
      schema: {$ref: '#/components/schemas/SigningKeyPurpose'}
    LinkTokenPath:
      name: token
      in: path
      required: true
      description: The signed-link token. It carries the signing key's kid and an expiry.
      schema:
        type: string
        minLength: 1
    ListDirectionPath:
      name: direction
      in: path
      required: true
      description: '`receive` or `send`.'
      schema: {$ref: '#/components/schemas/ListDirection'}
    ListKindPath:
      name: kind
      in: path
      required: true
      description: '`allow` or `block`.'
      schema: {$ref: '#/components/schemas/ListKind'}
    ListEntryPath:
      name: entry
      in: path
      required: true
      description: An address (`user@example.com`) or a whole domain (`@example.com`), percent-encoded where needed.
      schema: {$ref: '#/components/schemas/ListEntryValue'}

    WebhookIdHeader:
      name: webhook-id
      in: header
      required: true
      description: The event ID. Delivery is at least once, so deduplicate on it.
      schema: {$ref: '#/components/schemas/EventId'}
    WebhookTimestampHeader:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix time in seconds when the delivery was signed. Reject requests more than 5 minutes from your clock.
      schema:
        type: integer
        minimum: 0
      example: 1791540000
    WebhookSignatureHeader:
      name: webhook-signature
      in: header
      required: true
      description: >-
        Space-separated `v1,<base64>` signatures: `base64(HMAC-SHA256(secret_bytes, "{webhook-id}.{webhook-timestamp}.{raw body}"))`,
        where `secret_bytes` is the base64-decoded part of `whsec_…` after the prefix. Two signatures are sent
        during a secret rotation overlap. Compare in constant time and accept on any match.
      schema:
        type: string
        pattern: '^v1,[A-Za-z0-9+/]+={0,2}( v1,[A-Za-z0-9+/]+={0,2})*$'
      example: v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4=
    WebhookUserAgentHeader:
      name: User-Agent
      in: header
      required: true
      description: Identifies the sender.
      schema:
        type: string
      example: PylotaMail/1.0 (+https://github.com/PILOTAAI/pylota-mail)

  headers:

    Request-Id:
      description: The request ID (`req_…`). Every response carries it, and errors echo it as `error.request_id`.
      schema: {$ref: '#/components/schemas/RequestId'}
    RateLimit-Limit:
      description: >-
        The limit of the rate-limit bucket that applied to this request, per period (for example `600` for
        the per-key bucket of 600 requests a minute). Every authenticated response carries it.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: >-
        Sent only with a `429`: seconds until the end of the bucket's current period. There is no
        `RateLimit-Remaining` header, because the rate-limiting binding answers only allow or deny.
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying. On a `429 rate_limited` it equals `RateLimit-Reset`.
      schema:
        type: integer
        minimum: 0
    Idempotent-Replayed:
      description: Present, with the value `true`, when the response is a replay of an earlier request with the same `Idempotency-Key`.
      schema:
        type: string
        enum: ['true']
    Content-Disposition-Attachment:
      description: Always `attachment`, with the sanitised filename, for example `attachment; filename="INV-88213.pdf"`.
      schema:
        type: string
        pattern: '^attachment(;.*)?$'
    X-Content-Type-Options:
      description: Always `nosniff`.
      schema:
        type: string
        enum: [nosniff]
    Content-Security-Policy:
      description: Always `sandbox`.
      schema:
        type: string
        enum: [sandbox]
    Cache-Control-No-Store:
      description: Always `private, no-store`.
      schema:
        type: string
        enum: ['private, no-store']
    Cache-Control-Jwks:
      description: Always `public, max-age=300`. Verifiers cache an identity's JWK Set for at most 5 minutes.
      schema:
        type: string
        enum: ['public, max-age=300']
    Cache-Control-Directory:
      description: Always `max-age=86400`.
      schema:
        type: string
        enum: ['max-age=86400']
    Directory-Signature-Input:
      description: >-
        One RFC 9421 signature per listed key, each over `("@authority";req)` with `alg="ed25519"`, `keyid`
        (the key's JWK thumbprint), a 64-byte random `nonce`, `tag="http-message-signatures-directory"`,
        `created` and `expires` (`created` + 300).
      schema:
        type: string
      example: 'sig1=("@authority";req);alg="ed25519";keyid="poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U";nonce="ZO3/XMEZjrvSnLtAP9M7jK0WGQf3J+pbmQRUpKDhF9/jsNCWqUh2sq+TH4WTX3/GpNoSZUa8eNWMKqxWp2/c2g==";tag="http-message-signatures-directory";created=1791547200;expires=1791547500, sig2=("@authority";req);alg="ed25519";keyid="521omx3NZ4BMQZPNvThhZbY7uITn_wjh09-53ZFC0wk";nonce="enN8xXfGRxQLlICS8VZg3pIsSGnRkOvRFSiH10a4TS4v/hyiFG3AWhUObSlUdRZ6jaf4I7fUvl1zbaMYOA0v6g==";tag="http-message-signatures-directory";created=1791547200;expires=1791547500'
    Directory-Signature:
      description: The signatures named in `Signature-Input`, one per listed key.
      schema:
        type: string
      example: 'sig1=:TD5arhV1ved6xtx63cUIFCMONT248cpDeVUAljLgkdozbjMNpJGr/WAx4PzHj+WeG0xMHQF1BOdFLDsfjdjvBA==:, sig2=:pWhbkxEjP/MBnlByqa5/AWesMuWGG7SUVe1jlM0KFpeYt14tMetCabzPnowCg1wLJGVwK0EfqafEsJLCrASjVQ==:'

  responses:

    BadRequest:
      description: The request is malformed or violates the schema. `details.errors[]` holds `{path, message}`.
      x-error-codes: [invalid_request, invalid_idempotency_key]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: invalid_request
              message: 'limit: must be between 1 and 100.'
              retryable: false
              fix: Send a limit between 1 and 100.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                errors:
                  - path: limit
                    message: must be between 1 and 100
    SendBadRequest:
      description: >-
        The send request is invalid. `too_many_recipients`: more than `policy.max_recipients` (hard maximum
        49: Cloudflare allows 50 and one is kept for the hidden journal copy). A `from_address` that is not
        allowed is `invalid_request` with `details.errors[0].path = "from_address"`.
      x-error-codes: [invalid_request, idempotency_key_required, invalid_idempotency_key, address_invalid, address_unsupported, header_not_allowed, marketing_requirements_missing, too_many_recipients]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: idempotency_key_required
              message: This endpoint needs an Idempotency-Key header.
              retryable: false
              fix: Send a unique Idempotency-Key per message and reuse it on every retry of that message.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    SearchBadRequest:
      description: The search request is invalid, or `q` could not be parsed (`details.position`, `details.expected`).
      x-error-codes: [invalid_request, invalid_query, invalid_idempotency_key]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: invalid_query
              message: Unterminated quoted phrase.
              retryable: false
              fix: Close the quoted phrase that starts at position 5.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                position: 5
                expected: closing quote
    Unauthorized:
      description: No key, a malformed or unknown key, or an expired or revoked key.
      x-error-codes: [unauthenticated, key_expired, key_revoked]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: unauthenticated
              message: No valid API key was provided.
              retryable: false
              fix: 'Send Authorization: Bearer pmk_live_… with a key created by pmail keys create.'
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    Forbidden:
      description: >-
        The key lacks the permission (`details.required` names it), the resource is outside the key's
        tenant or identity, or the tenant is suspended.
      x-error-codes: [permission_denied, scope_denied, tenant_suspended]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: permission_denied
              message: This key does not have the messages:send permission.
              retryable: false
              fix: Use a key that holds messages:send.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                required: 'messages:send'
    SendForbidden:
      description: >-
        As `Forbidden`, plus `test_mode_recipient` when a test tenant sends outside `*@simulator.invalid`
        and this deployment ([L1]).
      x-error-codes: [permission_denied, scope_denied, tenant_suspended, test_mode_recipient]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: >-
        The resource does not exist **or** is outside the key's scope (deliberately indistinguishable). A
        `404` always carries one of this service's own codes; a `404` without this envelope came from
        something else and must not be read as "already deleted".
      x-error-codes: [tenant_not_found, identity_not_found, address_not_found, domain_not_found, thread_not_found, message_not_found, attachment_not_found, webhook_not_found, key_not_found, erasure_not_found, export_not_found, suppression_not_found, list_entry_not_found, member_not_found, invitation_not_found, job_not_found, dlq_item_not_found]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: message_not_found
              message: No such message for this identity.
              retryable: false
              fix: Check the message ID and that the key can reach this identity.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
    IdempotencyConflict:
      description: >-
        The `Idempotency-Key` was used with a different request (`idempotency_conflict`), or the first
        request with it is still running (`request_in_progress`, retryable).
      x-error-codes: [idempotency_conflict, request_in_progress]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendConflict:
      description: >-
        The send conflicts with the idempotency record or with the identity, thread or domain state.
        `idempotency_conflict` carries `details.original_message_id` when known; `identity_paused` carries
        `details.reason`; `thread_busy` carries `details.retry_after`. A recipient refused by
        `send_policy.require_known_recipient` is not an error: its delivery is `suppressed` with
        `policy: unknown_recipient` ([E2]).
      x-error-codes: [idempotency_conflict, request_in_progress, identity_paused, identity_owner_required, thread_busy, domain_not_ready, auto_reply_not_allowed]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: idempotency_conflict
              message: This Idempotency-Key was used with a different request body.
              retryable: false
              fix: Use a new Idempotency-Key for a different message, or resend the original body.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                original_message_id: msg_01J9Z3K8V4QW7X2M5N6P8R0T1Y
    RawExpired:
      description: The raw MIME is past `policy.retention.raw_days`.
      x-error-codes: [raw_expired]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    CursorExpired:
      description: The pagination cursor is older than 24 hours. Start again from the first page.
      x-error-codes: [cursor_expired]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: The request body exceeds 7 MiB.
      x-error-codes: [payload_too_large]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendPayloadTooLarge:
      description: >-
        The composed message exceeds the transport limit (5 MiB with Cloudflare) and the tenant does not use
        `large_attachments: link`, or the request body exceeds 7 MiB.
      x-error-codes: [message_too_large, payload_too_large]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SendUnprocessable:
      description: >-
        The sending domain's transport is not configured (for example SES for an `external` domain). Only a
        dry run (`dry_run=true`) returns `all_recipients_suppressed` (a real send whose every recipient is
        suppressed is accepted and ends `suppressed`) and `recipient_blocked` (a recipient is on the
        send-block list).
      x-error-codes: [transport_unavailable, all_recipients_suppressed, recipient_blocked]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    BillingLimit:
      description: >-
        A plan allowance is spent (`details`: `feature`, `granted`, `used`, `resets_at`, `upgrade_url`).
        Nothing was stored: upgrade or add a top-up, then retry with the **same** `Idempotency-Key`. Never
        returned for inbound mail or for the replay of a request that already completed.
      x-error-codes: [billing_limit]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: billing_limit
              message: This workspace has used all 12000 sends in its plan for this period.
              retryable: false
              fix: Upgrade the plan or add a sends top-up, then retry with the same Idempotency-Key.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                feature: sends
                granted: 12000
                used: 12000
                resets_at: '2026-11-01T00:00:00Z'
                upgrade_url: https://mail.example.com/console/plan
    DryRunOk:
      description: >-
        Dry run only (`dry_run=true`): every check passed. Nothing was sent or stored, no quota was taken
        and the thread was not locked.
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DryRunResult'}
          example:
            would_send: true
            recipients:
              - address: jo@example.net
                field: to
                status: queued
              - address: old@example.org
                field: cc
                status: suppressed
                reason: hard_bounce
    LegalHold:
      description: The operation would delete data under a legal hold.
      x-error-codes: [legal_hold]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: A rate limit was hit. Wait `Retry-After` seconds, then retry.
      x-error-codes: [rate_limited]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error:
              code: rate_limited
              message: Too many requests for this API key.
              retryable: true
              fix: Wait for the number of seconds in the Retry-After header, then retry with the same Idempotency-Key.
              request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
              details:
                retry_after: 12
    SendTooManyRequests:
      description: >-
        A per-key or per-identity rate limit (`rate_limited`, with `Retry-After`), or a tenant or identity
        daily cap (`daily_cap_reached`, with `details.resets_at`). Retry with the same `Idempotency-Key`.
      x-error-codes: [rate_limited, daily_cap_reached]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SearchTooManyRequests:
      description: >-
        A search rate limit (`rate_limited`, with `Retry-After`), or the tenant's daily agentic-search budget
        is spent (`agentic_budget_exhausted`).
      x-error-codes: [rate_limited, agentic_budget_exhausted]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: A bug. It is logged with the `request_id`. Retry with backoff.
      x-error-codes: [internal_error]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpstreamError:
      description: A Cloudflare or SES API returned an unexpected error during a synchronous call. Retry with backoff.
      x-error-codes: [upstream_error]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: A dependency is temporarily unavailable (D1, an overloaded Durable Object). Retry with backoff.
      x-error-codes: [unavailable]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SearchUnavailable:
      description: >-
        A dependency is unavailable (`unavailable`), or the request set `require_mode: true` and the
        requested mode is unavailable (`search_degraded`). Without `require_mode`, search degrades and sets
        `degraded: true` instead.
      x-error-codes: [unavailable, search_degraded]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    GatewayTimeout:
      description: >-
        An internal deadline was exceeded. For sends this happens before the message is queued, so a retry
        with the same `Idempotency-Key` is safe.
      x-error-codes: [timeout]
      headers:
        Request-Id: {$ref: '#/components/headers/Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

    WebhookAccepted:
      description: Any `2xx` within 15 seconds counts as delivered. The response body is ignored (read up to 4 KB).
    WebhookGone:
      description: '`410 Gone` disables the endpoint immediately.'
    WebhookFailed:
      description: >-
        Anything else (including a timeout, TLS or DNS error, redirect or `3xx`) is a failure. Failures retry
        at about 30 s, 2 min, 10 min, 30 min, 1 h, 2 h, 4 h, 8 h, 12 h, 12 h, 12 h and 19 h (±10% jitter,
        about 72 hours in all), then the delivery is `dead`. The event can be replayed for 30 days from its
        `occurred_at` (or `retention.events_days`, if shorter), not from when the delivery went dead. After 100
        consecutive failures over at least 24 hours the endpoint is disabled (`disabled_reason: failing`).

  schemas:

    # ── Identifiers ──────────────────────────────────────────────────────────────────────────────

    TenantId:
      type: string
      description: Tenant ID (`ten_` + ULID).
      pattern: '^ten_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    IdentityId:
      type: string
      description: Identity ID (`idn_` + ULID).
      pattern: '^idn_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    AddressId:
      type: string
      description: Address ID (`adr_` + ULID).
      pattern: '^adr_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [adr_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    DomainId:
      type: string
      description: Domain ID (`dom_` + ULID).
      pattern: '^dom_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [dom_01JA2B3C4D5E6F7G8H9J0K1M2N]
    ThreadId:
      type: string
      description: Thread ID (`thr_` + ULID).
      pattern: '^thr_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [thr_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    MessageId:
      type: string
      description: Message ID (`msg_` + ULID).
      pattern: '^msg_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [msg_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    AttachmentId:
      type: string
      description: Attachment ID (`att_` + ULID).
      pattern: '^att_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [att_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    WebhookId:
      type: string
      description: Webhook endpoint ID (`whk_` + ULID).
      pattern: '^whk_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [whk_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    DeliveryId:
      type: string
      description: Webhook delivery attempt ID (`dlv_` + ULID).
      pattern: '^dlv_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [dlv_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    EventId:
      type: string
      description: Event ID (`evt_` + ULID). Also sent as the `webhook-id` header.
      pattern: '^evt_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [evt_01J9Z5K8V4QW7X2M5N6P8R0T1Y]
    KeyId:
      type: string
      description: API key ID (`key_` + ULID). Not secret.
      pattern: '^key_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [key_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    ErasureRequestId:
      type: string
      description: Erasure request ID (`era_` + ULID).
      pattern: '^era_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [era_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    ExportId:
      type: string
      description: Export ID (`exp_` + ULID).
      pattern: '^exp_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [exp_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    AuditEventId:
      type: string
      description: Audit entry ID (`aud_` + ULID).
      pattern: '^aud_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [aud_01J9Z3K8V4QW7X2M5N6P8R0T1Y]
    UserId:
      type: string
      description: Console user ID (`usr_` + ULID).
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [usr_01JA2B3C4D5E6F7G8H9J0K1M2N]
    InvitationId:
      type: string
      description: Invitation ID (`inv_` + ULID).
      pattern: '^inv_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [inv_01JA2B3C4D5E6F7G8H9J0K1M2N]
    DlqItemId:
      type: string
      description: Dead-letter item ID (`dlq_` + ULID).
      pattern: '^dlq_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [dlq_01JA2B3C4D5E6F7G8H9J0K1M2N]
    JobId:
      type: string
      description: Job ID (`job_` + ULID).
      pattern: '^job_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [job_01JA2B3C4D5E6F7G8H9J0K1M2N]
    RequestId:
      type: string
      description: Request ID (`req_` + ULID).
      pattern: '^req_[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [req_01J9Z4K8V4QW7X2M5N6P8R0T1Y]

    # ── Primitives ───────────────────────────────────────────────────────────────────────────────

    EmailAddress:
      type: string
      format: email
      maxLength: 254
      description: >-
        An RFC 5321 address. Stored lower-cased with the domain as an IDNA A-label; dots in the local part
        are significant ([A1]). SMTPUTF8 (non-ASCII) local parts are refused with `address_unsupported`.
      examples: [jo@example.net]
    MailboxAddress:
      type: object
      description: An address with its display name. Display names are untrusted content.
      required: [address, name]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        name:
          type: string
          description: The display name, or an empty string when there is none.
    Label:
      type: string
      description: A label. At most 64 per message.
      pattern: '^[a-z0-9][a-z0-9_:-]{0,63}$'
      examples: [invoice]
    Metadata:
      type: object
      description: Integrator metadata. At most 16 keys; each value is a string of at most 512 bytes.
      maxProperties: 16
      additionalProperties:
        type: string
        maxLength: 512
    Direction:
      type: string
      enum: [inbound, outbound]

    # ── Errors ───────────────────────────────────────────────────────────────────────────────────

    Error:
      type: object
      description: The envelope of every non-2xx response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, fix, request_id]
          properties:
            code: {$ref: '#/components/schemas/ErrorCode'}
            message:
              type: string
              description: Human-readable. It can change. Never parse it.
            retryable:
              type: boolean
              description: >-
                `true`: the same request can succeed later unchanged (retry with backoff, and with the same
                `Idempotency-Key` for sends). `false`: the request has to change.
            fix:
              type: string
              description: One sentence telling a developer, or an agent, what to do.
            request_id: {$ref: '#/components/schemas/RequestId'}
            details:
              $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      description: Optional, code-specific details. Known keys are listed; other keys can appear.
      properties:
        required:
          description: '`permission_denied`: the permission the key lacks.'
          $ref: '#/components/schemas/Permission'
        errors:
          type: array
          description: '`invalid_request`: one entry per schema violation.'
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: string
                description: Where in the request the problem is.
              message:
                type: string
        position:
          type: integer
          minimum: 0
          description: '`invalid_query`: the character offset in `q` where parsing failed.'
        expected:
          description: '`invalid_query`: what the parser expected at `position`.'
        original_message_id:
          description: '`idempotency_conflict`: the message created by the original request, when known.'
          $ref: '#/components/schemas/MessageId'
        reason:
          description: >-
            `identity_paused`: why the identity is paused. `transport_unavailable`: why the deployment or
            the domain's method cannot do what was asked. `invalid_request` on `POST /v1/keys`:
            `permission_not_allowed_for_level` when `permissions` lists one the new key's level cannot hold.
          anyOf:
            - $ref: '#/components/schemas/PauseReason'
            - $ref: '#/components/schemas/TransportUnavailableReason'
            - type: string
              const: permission_not_allowed_for_level
        records:
          type: array
          description: >-
            `domain_not_dedicated`: the records found at the name (A, AAAA, MX) and at `www` (CNAME, A)
            that moving the nameservers would take over.
          items:
            type: object
            required: [type, name, value]
            properties:
              type:
                type: string
                enum: [A, AAAA, MX, CNAME]
              name:
                type: string
                examples: [brightwell-agents.example]
              value:
                type: string
                examples: [203.0.113.10]
        retry_after:
          type: integer
          minimum: 0
          description: >-
            `rate_limited` and `thread_busy`: seconds to wait before retrying. `upstream_rate_limited`:
            as in `Retry-After`: `10800` (3 hours) after a Cloudflare 1105, or the wait for the next SES
            control-plane slot.
        resets_at:
          type: [string, 'null']
          format: date-time
          description: '`daily_cap_reached` and `billing_limit`: when the cap or allowance resets (`null` for counts such as `inboxes`).'
        feature:
          description: '`billing_limit`: the spent allowance.'
          $ref: '#/components/schemas/UsageFeatureName'
        granted:
          type: [integer, 'null']
          minimum: 0
          description: '`billing_limit`: the allowance, top-ups included.'
        used:
          type: integer
          minimum: 0
          description: '`billing_limit`: how much of it is used.'
        upgrade_url:
          type: [string, 'null']
          format: uri
          description: '`billing_limit`: the console plan page, or `null` when the console is off.'
        lookups:
          type: integer
          minimum: 0
          description: '`spf_lookup_limit`: the DNS lookups the merged SPF record would need.'
      additionalProperties: true
    ErrorCode:
      type: string
      description: >-
        Stable, machine-readable error code. New codes can be added, so handle unknown codes by HTTP status.
        The catalogue, with HTTP status and retryability, is in `docs/src/reference/errors.md`.
      enum:
        # Authentication and access
        - unauthenticated
        - key_expired
        - key_revoked
        - permission_denied
        - scope_denied
        - key_scope_exceeded
        - tenant_suspended
        - test_mode_recipient
        - invalid_signature
        - policy_denied
        # Validation
        - invalid_request
        - idempotency_key_required
        - invalid_idempotency_key
        - invalid_query
        - address_invalid
        - address_unsupported
        - address_reserved
        - local_part_too_long
        - header_not_allowed
        - marketing_requirements_missing
        - too_many_recipients
        - smtp_port_not_allowed
        - spf_lookup_limit
        - message_too_large
        - payload_too_large
        - scope_too_large
        # Resources and state
        - tenant_not_found
        - identity_not_found
        - address_not_found
        - domain_not_found
        - thread_not_found
        - message_not_found
        - attachment_not_found
        - webhook_not_found
        - key_not_found
        - erasure_not_found
        - export_not_found
        - suppression_not_found
        - list_entry_not_found
        - member_not_found
        - invitation_not_found
        - job_not_found
        - dlq_item_not_found
        - idempotency_conflict
        - request_in_progress
        - client_id_conflict
        - username_taken
        - slug_taken
        - suffix_taken
        - not_quarantined
        - domain_not_suspended
        - existing_mx
        - domain_not_dedicated
        - zone_hold
        - owner_required
        - plan_managed_by_stripe
        - address_taken
        - address_is_primary
        - address_in_use
        - domain_not_ready
        - domain_in_use
        - domain_exists
        - identity_paused
        - identity_owner_required
        - thread_busy
        - not_cancelable
        - not_uncertain
        - auto_reply_not_allowed
        - raw_expired
        - cursor_expired
        - legal_hold
        # Policy and limits
        - all_recipients_suppressed
        - recipient_blocked
        - transport_unavailable
        - smtp_tls_required
        - smtp_auth_failed
        - cf_token_required
        - agentic_disabled
        - address_limit_reached
        - webhook_limit_reached
        - web_bot_auth_disabled
        - billing_limit
        - rate_limited
        - daily_cap_reached
        - agentic_budget_exhausted
        - upstream_rate_limited
        # Server and dependencies
        - internal_error
        - upstream_error
        - unavailable
        - search_degraded
        - timeout
    TransportUnavailableReason:
      type: string
      description: |
        `details.reason` of `422 transport_unavailable`.

        | Reason | When |
        |---|---|
        | `ses_not_configured` | The SES transport (`PM_SES_*`) is not configured: `dns_records`, `send_only`, or `PATCH` with `transport: ses` |
        | `ses_receiving_not_configured` | `dns_records`, or `smtp_relay` with `inbound: ses`, without `PM_SES_INBOUND_TOPIC_ARN` (and the bucket and queue) |
        | `ses_identity_limit` | The SES region already has 10,000 identities, and the method needs one (`dns_records`, `send_only`, `smtp_relay` with `inbound: ses`) |
        | `subdomain_setup_disabled` | `delegated_subdomain` while `PM_CF_SUBDOMAIN_SETUP` is not `on` |
        | `zone_creation_not_allowed` | `nameservers` by a tenant key whose policy lacks `domains.allow_create_zone: true` |
        | `method_not_supported` | The domain's method does not support the operation: `PATCH` with a transport it cannot use, `probe` on a domain whose transport is not `smtp`, `test-forwarding` on an address whose domain does not use `inbound: forward` |
      enum: [ses_not_configured, ses_receiving_not_configured, ses_identity_limit, subdomain_setup_disabled, zone_creation_not_allowed, method_not_supported]

    # ── Keys and access ──────────────────────────────────────────────────────────────────────────

    Permission:
      type: string
      description: |
        A permission a key can hold.

        | Permission | Allows |
        |---|---|
        | `tenants:manage` | Create, update and suspend tenants, and their billing accounts (platform keys only) |
        | `identities:read`, `identities:write` | Read, and create, update, pause or delete identities and addresses, and test forwarding; read, and create, rotate or revoke identity signing keys. Deleting an identity also needs `erasure:manage`, because it starts an identity-scope erasure |
        | `identities:sign` | Mint agent assertions and Web Bot Auth HTTP signatures as an identity. Tenant and identity keys (an identity key only for its own identity); platform keys cannot hold it |
        | `domains:read`, `domains:write` | Read, and add, update, verify, probe or remove domains |
        | `messages:read` | Threads, messages, raw MIME, deliveries |
        | `messages:send` | Send, reply, reply-all, forward, cancel |
        | `messages:write` | Labels, read state, re-run triage, resolve uncertain sends |
        | `attachments:read` | Attachment bytes and extracted text |
        | `search:read` | Keyword, semantic, hybrid search, contacts, related, wait |
        | `search:agentic` | Agentic search |
        | `quarantine:review` | See and release quarantined mail |
        | `webhooks:read` | Read webhook endpoints and their deliveries |
        | `webhooks:manage` | Create, change, test, rotate and delete webhook endpoints, and replay. Includes `webhooks:read` |
        | `keys:manage` | API keys within the caller's scope |
        | `erasure:manage` | Erasure requests, legal holds, exports |
        | `suppressions:manage` | Suppressions and allow or block lists |
        | `usage:read` | Plan, allowances and usage figures. Every tenant and identity key holds it implicitly for its own workspace; platform keys must hold it explicitly and pass `tenant_id` |
        | `audit:read` | Audit log |
        | `members:read` | List console members and pending invitations (tenant and platform keys; every console role holds it) |
        | `members:manage` | Invite, revoke, change roles and remove console members (tenant and platform keys). Includes `members:read` |
        | `platform:ops` | Platform operations: signing-key rotation, the dead-letter queue, maintenance jobs, waitlist invitations (platform keys only) |

        Which key levels can hold a permission. `POST /v1/keys` refuses any other combination with
        `400 invalid_request` and `details.reason = "permission_not_allowed_for_level"`:

        | Permissions | Key levels |
        |---|---|
        | `tenants:manage`, `platform:ops` | platform |
        | `members:read`, `members:manage`, `suppressions:manage`, `audit:read`, `usage:read` | platform, tenant |
        | `identities:sign` | tenant, identity |
        | Every other permission | platform, tenant, identity |
      enum:
        - 'tenants:manage'
        - 'identities:read'
        - 'identities:write'
        - 'identities:sign'
        - 'domains:read'
        - 'domains:write'
        - 'messages:read'
        - 'messages:send'
        - 'messages:write'
        - 'attachments:read'
        - 'search:read'
        - 'search:agentic'
        - 'quarantine:review'
        - 'webhooks:read'
        - 'webhooks:manage'
        - 'keys:manage'
        - 'erasure:manage'
        - 'suppressions:manage'
        - 'usage:read'
        - 'audit:read'
        - 'members:read'
        - 'members:manage'
        - 'platform:ops'
    KeyLevel:
      type: string
      description: >-
        `platform` reaches every tenant; `tenant` reaches its own tenant; `identity` reaches its own identity,
        plus its tenant's domains read-only with `domains:read` and its tenant's webhook endpoints and
        deliveries read-only with `webhooks:read`. A route or field that needs a higher level returns
        `403 scope_denied`.
      enum: [platform, tenant, identity]
    Mode:
      type: string
      description: '`live` or `test`. Mail a `test` tenant sends never leaves the deployment (FR-TEN-2).'
      enum: [live, test]
    Me:
      type: object
      description: The key that made the request.
      required: [key_id, name, level, mode, tenant_id, identity_id, permissions, expires_at]
      properties:
        key_id: {$ref: '#/components/schemas/KeyId'}
        name:
          type: string
        level: {$ref: '#/components/schemas/KeyLevel'}
        mode: {$ref: '#/components/schemas/Mode'}
        tenant_id:
          description: '`null` for platform keys.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        identity_id:
          description: '`null` unless the key is identity-level.'
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Permission'}
        expires_at:
          type: [string, 'null']
          format: date-time

    Health:
      type: object
      required: [status, version, commit, env]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The deployed release, for example `1.0.0`.
        commit:
          type: string
          description: The short commit hash of the build.
        env:
          type: string
          description: '`PM_ENV` of the deployment.'
          enum: [production, staging, local]

    # ── Tenants ──────────────────────────────────────────────────────────────────────────────────

    TenantStatus:
      type: string
      description: '`erasing` and `erased` are set by a tenant-scope erasure.'
      enum: [active, suspended, erasing, erased]
    TenantSlug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{1,31}$'
      examples: [acme]
    AddressSuffix:
      type: string
      description: >-
        Appended to usernames on the platform domain (`bookings` + `.acme` → `bookings.acme@agents.example`).
        Defaults to `"." + slug`. Only the default tenant made by `pmail setup` can have an empty suffix.
      pattern: '^(\.[a-z0-9][a-z0-9-]{1,31})?$'
      examples: [.acme]
    Tenant:
      type: object
      required: [id, slug, name, mode, status, address_suffix, timezone, policy, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/TenantId'}
        slug: {$ref: '#/components/schemas/TenantSlug'}
        name:
          type: string
          examples: [Acme Car Hire]
        mode: {$ref: '#/components/schemas/Mode'}
        status: {$ref: '#/components/schemas/TenantStatus'}
        address_suffix: {$ref: '#/components/schemas/AddressSuffix'}
        timezone:
          type: string
          description: IANA time zone. Daily caps and date filters resolve in it.
          examples: [Europe/London]
        policy:
          $ref: '#/components/schemas/TenantPolicy'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TenantCreateRequest:
      type: object
      required: [slug, name, mode]
      properties:
        slug: {$ref: '#/components/schemas/TenantSlug'}
        name:
          type: string
          minLength: 1
        mode: {$ref: '#/components/schemas/Mode'}
        timezone:
          type: string
          description: IANA time zone name (for example `Europe/London`). An unknown name is refused with `400 invalid_request` (path `timezone`).
          default: UTC
        address_suffix: {$ref: '#/components/schemas/AddressSuffix'}
        policy:
          $ref: '#/components/schemas/TenantPolicyPatch'
        owner:
          type: object
          description: >-
            Creates the workspace's console owner and emails them a sign-in link. Without it, a platform key
            can add an owner later with an invitation and an ownership transfer in the console.
          required: [email]
          properties:
            email: {$ref: '#/components/schemas/EmailAddress'}
            name:
              type: string
              minLength: 1
              examples: [Sam Patel]
        billing:
          type: object
          description: The workspace's billing account.
          properties:
            mode:
              description: Defaults to `metered` (plan `free`) on a deployment with billing on, and to `disabled` otherwise.
              $ref: '#/components/schemas/BillingMode'
    TenantUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        timezone:
          type: string
          description: IANA time zone name (for example `Europe/London`). An unknown name is refused with `400 invalid_request` (path `timezone`).
        policy:
          $ref: '#/components/schemas/TenantPolicyPatch'
        status:
          type: string
          description: '`suspended` suspends the tenant (FR-TEN-3); `active` resumes it.'
          enum: [active, suspended]

    TenantPolicy:
      type: object
      description: >-
        The full effective policy of a tenant: the built-in defaults shown here, then `PM_DEFAULT_POLICY`,
        then the tenant's own values, deep-merged.
      required: [identity_daily_send_cap, tenant_daily_send_cap, max_recipients, send_allowlist_only, large_attachments, link_ttl_hours, ai_disclosure, auto_reply, quarantine, inbound, retention, triage, search, webhook_text_bytes, abuse, domains, domain_fallback, web_bot_auth]
      properties:
        identity_daily_send_cap:
          type: integer
          minimum: 0
          default: 500
          description: Sends per identity per day (tenant time zone). Then `429 daily_cap_reached`.
        tenant_daily_send_cap:
          type: integer
          minimum: 0
          default: 5000
          description: >-
            Sends per tenant per day (tenant time zone). Then `429 daily_cap_reached`. With billing on, a new
            workspace on the Free plan has an effective cap of the lower of this value and 50 until its
            new-workspace send ramp is lifted (at the earliest on day 7, or at once on a paid plan).
        max_recipients:
          type: integer
          minimum: 1
          maximum: 49
          default: 10
          description: >-
            Recipients per message across `to`, `cc` and `bcc`, 1–49. Cloudflare allows 50 recipients per
            message, and one is kept for the hidden journal copy. Then `400 too_many_recipients`.
        send_allowlist_only:
          type: boolean
          default: false
          description: Only recipients on the send-allow list are allowed.
        large_attachments:
          type: string
          enum: [refuse, link]
          default: refuse
          description: '`refuse` returns `413 message_too_large`; `link` turns oversized attachments into expiring signed links.'
        link_ttl_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 72
          description: Lifetime of signed attachment links.
        ai_disclosure:
          type: object
          required: [mode, text]
          properties:
            mode:
              type: string
              enum: [none, footer, header]
              default: none
              description: '`footer` appends `text` to text and HTML bodies; `header` adds `X-AI-Generated: true`.'
            text:
              type: string
              default: This message was written with the help of an AI assistant.
          default:
            mode: none
            text: This message was written with the help of an AI assistant.
        auto_reply:
          type: object
          required: [allowed, max_automatic_exchanges]
          properties:
            allowed:
              type: boolean
              default: true
            max_automatic_exchanges:
              type: integer
              minimum: 0
              default: 2
              description: Automatic replies allowed per thread before a human must act ([D6]).
          default:
            allowed: true
            max_automatic_exchanges: 2
        quarantine:
          type: object
          required: [on_auth_fail, spam_threshold, unsolicited_otp]
          properties:
            on_auth_fail:
              type: boolean
              default: true
              description: Quarantine mail that fails authentication.
            spam_threshold:
              type: number
              minimum: 0
              maximum: 1
              default: 0.8
              description: Quarantine mail whose spam score is at or above this value.
            unsolicited_otp:
              type: boolean
              default: true
              description: Quarantine password-reset and OTP mail that no `wait` asked for ([E5]).
          default:
            on_auth_fail: true
            spam_threshold: 0.8
            unsolicited_otp: true
        inbound:
          type: object
          required: [per_sender_per_hour, extract_attachment_text, extract_image_text, ses_bounce_retired]
          properties:
            per_sender_per_hour:
              type: integer
              minimum: 1
              default: 60
              description: Inbound messages per sender per identity per hour; the excess is stored `throttled` ([D5]).
            extract_attachment_text:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [pdf, office, text, html]
              default: [pdf, office, text, html]
              description: Attachment families whose text is extracted.
            extract_image_text:
              type: boolean
              default: false
              description: Extract text from images.
            ses_bounce_retired:
              type: boolean
              default: true
              description: >-
                On SES-receiving domains, `true` bounces mail to retired addresses with `550 5.1.6` through SES
                receipt rules; `false` drops it without a bounce.
          default:
            per_sender_per_hour: 60
            extract_attachment_text: [pdf, office, text, html]
            extract_image_text: false
            ses_bounce_retired: true
        retention:
          type: object
          required: [raw_days, message_days, events_days]
          properties:
            raw_days:
              type: integer
              minimum: 1
              default: 90
              description: Days raw MIME is kept. Then `410 raw_expired`.
            message_days:
              type: [integer, 'null']
              minimum: 1
              default: null
              description: >-
                `null` keeps parsed messages indefinitely. A number deletes messages, attachments, index rows
                and vectors after that age, except held threads.
            events_days:
              type: integer
              minimum: 1
              maximum: 365
              default: 30
              description: >-
                Days events, delivery logs and replayable event payloads are kept. Webhook replay reaches back
                30 days from an event's `occurred_at`, or this many days if fewer.
          default:
            raw_days: 90
            message_days: null
            events_days: 30
        triage:
          type: object
          required: [enabled, categories, rules]
          properties:
            enabled:
              type: boolean
              default: true
            categories:
              type: [array, 'null']
              maxItems: 20
              items: {$ref: '#/components/schemas/TriageCategoryDefinition'}
              default: null
              description: '`null` uses the built-in categories. Otherwise up to 20 custom categories that replace them.'
            rules:
              type: array
              maxItems: 50
              items: {$ref: '#/components/schemas/TriageRule'}
              default: []
              description: Deterministic rules that run before the model (FR-TRI-2), at most 50.
          default:
            enabled: true
            categories: null
            rules: []
        search:
          type: object
          required: [agentic_enabled, agentic_daily_cap, agentic_max_steps, agentic_max_seconds, refs_packs, custom_refs]
          properties:
            agentic_enabled:
              type: boolean
              default: true
            agentic_daily_cap:
              type: integer
              minimum: 0
              default: 500
              description: Agentic searches per tenant per day. Then `429 agentic_budget_exhausted`.
            agentic_max_steps:
              type: integer
              minimum: 2
              maximum: 10
              default: 6
              description: The default, and the maximum, `budget.max_steps`.
            agentic_max_seconds:
              type: integer
              minimum: 3
              maximum: 30
              default: 8
              description: The default, and the maximum, `budget.max_seconds`.
            refs_packs:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [core, uk_vehicle]
              default: [core]
              description: >-
                `core`: amounts, phones, emails, domains, dates, invoice and order numbers. `uk_vehicle`:
                plates and PCNs.
            custom_refs:
              type: array
              maxItems: 20
              items: {$ref: '#/components/schemas/CustomRefPattern'}
              default: []
          default:
            agentic_enabled: true
            agentic_daily_cap: 500
            agentic_max_steps: 6
            agentic_max_seconds: 8
            refs_packs: [core]
            custom_refs: []
        webhook_text_bytes:
          type: integer
          minimum: 0
          maximum: 65536
          default: 16384
          description: Bytes of `extracted_text` included in `message.received` payloads.
        abuse:
          type: object
          required: [complaint_rate_pause, bounce_rate_pause]
          properties:
            complaint_rate_pause:
              type: number
              minimum: 0
              maximum: 1
              default: 0.003
              description: Pause an identity whose complaint rate over its last 1,000 sends exceeds this (FR-DLV-3).
            bounce_rate_pause:
              type: number
              minimum: 0
              maximum: 1
              default: 0.05
              description: Pause an identity whose bounce rate over its last 200 sends exceeds this (FR-DLV-3).
          default:
            complaint_rate_pause: 0.003
            bounce_rate_pause: 0.05
        domains:
          type: object
          required: [allow_create_zone]
          properties:
            allow_create_zone:
              type: boolean
              default: false
              description: >-
                Lets the tenant's own keys use the `nameservers` method, which creates a Cloudflare zone.
                Without it, they get `422 transport_unavailable` (`zone_creation_not_allowed`). Platform keys
                may always use it. Pylota Mail Cloud sets it to `true`.
          default:
            allow_create_zone: false
        domain_fallback:
          type: boolean
          default: true
          description: '`false` fails sends on a failing domain (`domain_failing_no_fallback`) instead of using the platform address.'
        web_bot_auth:
          type: object
          required: [allowed]
          properties:
            allowed:
              type: boolean
              default: false
              description: >-
                Lets the tenant's identities sign HTTP requests (Web Bot Auth). While it is `false`,
                `POST …/http-signatures` returns `403 policy_denied` ([O13]). It has no effect while the
                deployment has `PM_WEB_BOT_AUTH=off`. Agent assertions do not depend on it.
          default:
            allowed: false

    TenantPolicyPatch:
      type: object
      description: >-
        A partial `TenantPolicy`, deep-merged over the current policy. Any field set to `null` resets to its
        default (for `retention.message_days` and `triage.categories`, whose default is `null`, this is the
        same as setting `null`). Arrays replace, they do not merge.
      properties:
        identity_daily_send_cap:
          type: [integer, 'null']
          minimum: 0
        tenant_daily_send_cap:
          type: [integer, 'null']
          minimum: 0
        max_recipients:
          type: [integer, 'null']
          minimum: 1
          maximum: 49
        send_allowlist_only:
          type: [boolean, 'null']
        large_attachments:
          type: [string, 'null']
          enum: [refuse, link, null]
        link_ttl_hours:
          type: [integer, 'null']
          minimum: 1
          maximum: 168
        ai_disclosure:
          type: [object, 'null']
          properties:
            mode:
              type: [string, 'null']
              enum: [none, footer, header, null]
            text:
              type: [string, 'null']
        auto_reply:
          type: [object, 'null']
          properties:
            allowed:
              type: [boolean, 'null']
            max_automatic_exchanges:
              type: [integer, 'null']
              minimum: 0
        quarantine:
          type: [object, 'null']
          properties:
            on_auth_fail:
              type: [boolean, 'null']
            spam_threshold:
              type: [number, 'null']
              minimum: 0
              maximum: 1
            unsolicited_otp:
              type: [boolean, 'null']
        inbound:
          type: [object, 'null']
          properties:
            per_sender_per_hour:
              type: [integer, 'null']
              minimum: 1
            extract_attachment_text:
              type: [array, 'null']
              uniqueItems: true
              items:
                type: string
                enum: [pdf, office, text, html]
            extract_image_text:
              type: [boolean, 'null']
            ses_bounce_retired:
              type: [boolean, 'null']
        retention:
          type: [object, 'null']
          properties:
            raw_days:
              type: [integer, 'null']
              minimum: 1
            message_days:
              type: [integer, 'null']
              minimum: 1
            events_days:
              type: [integer, 'null']
              minimum: 1
              maximum: 365
        triage:
          type: [object, 'null']
          properties:
            enabled:
              type: [boolean, 'null']
            categories:
              type: [array, 'null']
              maxItems: 20
              items: {$ref: '#/components/schemas/TriageCategoryDefinition'}
            rules:
              type: [array, 'null']
              maxItems: 50
              items: {$ref: '#/components/schemas/TriageRule'}
        search:
          type: [object, 'null']
          properties:
            agentic_enabled:
              type: [boolean, 'null']
            agentic_daily_cap:
              type: [integer, 'null']
              minimum: 0
            agentic_max_steps:
              type: [integer, 'null']
              minimum: 2
              maximum: 10
            agentic_max_seconds:
              type: [integer, 'null']
              minimum: 3
              maximum: 30
            refs_packs:
              type: [array, 'null']
              uniqueItems: true
              items:
                type: string
                enum: [core, uk_vehicle]
            custom_refs:
              type: [array, 'null']
              maxItems: 20
              items: {$ref: '#/components/schemas/CustomRefPattern'}
        webhook_text_bytes:
          type: [integer, 'null']
          minimum: 0
          maximum: 65536
        abuse:
          type: [object, 'null']
          properties:
            complaint_rate_pause:
              type: [number, 'null']
              minimum: 0
              maximum: 1
            bounce_rate_pause:
              type: [number, 'null']
              minimum: 0
              maximum: 1
        domains:
          type: [object, 'null']
          properties:
            allow_create_zone:
              type: [boolean, 'null']
        domain_fallback:
          type: [boolean, 'null']
        web_bot_auth:
          type: [object, 'null']
          properties:
            allowed:
              type: [boolean, 'null']
    TriageCategoryDefinition:
      type: object
      description: A custom triage category. The description is given to the triage model.
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          examples: [pcn]
        description:
          type: string
          minLength: 1
          examples: [Penalty charge notices from councils]
    TriageRule:
      type: object
      description: >-
        A deterministic tenant triage rule (`policy.triage.rules`, at most 50), as in the Triage design
        (`project/design/triage.md`, sections 4 and 5) and the Triage guide. Tenant rules run first, in array
        order, before the built-in rules and the model (FR-TRI-2). For every rule whose `match` holds:
        `category` and `needs_reply` are set by the first rule that sets them (first match wins),
        `urgency_min` takes the highest value, `labels_add` accumulates (at most 10 in all), and
        `skip_model` is on if any matching rule turns it on. A matching rule with `stop: true` ends tenant
        rules. Tenant rules cannot add or remove risk flags. With `skip_model`, triage ends with a rules-only
        record (`model: "rules"`); otherwise the values set here are fixed and the model fills the rest.
        Strings are NFKC-folded and lower-cased when the policy is written. Rules apply to mail that arrives
        afterwards; re-run triage to apply them to a message already triaged.
      required: [id, match, set]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,47}$'
          description: Unique in the list. Recorded (stored only) in the IDs of the rules that matched.
          examples: [pcn-council]
        match: {$ref: '#/components/schemas/TriageRuleMatch'}
        set: {$ref: '#/components/schemas/TriageRuleSet'}
        stop:
          type: boolean
          default: false
          description: '`true` ends tenant rules when this rule matches. Built-in rules still run.'
      examples:
        - id: pcn-council
          match:
            from_domain: [westminster.example, leeds.example]
            subject_contains: [penalty charge, pcn]
          set:
            category: legal_compliance
            labels_add: [pcn]
            urgency_min: 2
            needs_reply: 0.9
          stop: true
        - id: garage-invoices
          match:
            from: [accounts@brightwell.example]
            has_attachment: true
            subject_contains: [invoice]
          set:
            category: billing
            labels_add: [invoice]
            urgency_min: 1
            needs_reply: 0.1
            skip_model: true
    TriageRuleMatch:
      type: object
      description: >-
        The conditions of a tenant triage rule. At least one field. **All** listed fields must hold; within a
        field's list, **any** value may match. Each list has at most 20 entries and each string at most 200
        characters.
      minProperties: 1
      additionalProperties: false
      properties:
        from:
          type: array
          maxItems: 20
          description: The From address is one of these exact addresses (case-insensitive).
          items: {$ref: '#/components/schemas/EmailAddress'}
        from_domain:
          type: array
          maxItems: 20
          description: The From address is at one of these domains or any of their subdomains.
          items:
            type: string
            minLength: 1
            maxLength: 200
            examples: [leeds.example]
        to_identity:
          type: array
          maxItems: 20
          description: The message was delivered to one of these identities of the tenant (identity IDs or usernames).
          items:
            type: string
            minLength: 1
            maxLength: 200
        subject_contains:
          type: array
          maxItems: 20
          description: The folded subject contains one of these strings.
          items:
            type: string
            minLength: 1
            maxLength: 200
        body_contains:
          type: array
          maxItems: 20
          description: The first 64 KB of `extracted_text` contains one of these strings (case-insensitive).
          items:
            type: string
            minLength: 1
            maxLength: 200
        has_attachment:
          type: boolean
          description: A non-inline attachment exists (`true`) or none does (`false`).
        label:
          type: array
          maxItems: 20
          description: The message carries one of these labels at triage time, including labels added by earlier tenant rules in the same run.
          items: {$ref: '#/components/schemas/Label'}
    TriageRuleSet:
      type: object
      description: The triage fields a matching tenant rule sets. At least one field.
      minProperties: 1
      additionalProperties: false
      properties:
        category:
          type: string
          minLength: 1
          description: Must be in the effective category list (the built-in categories, or the tenant's custom ones).
          examples: [billing]
        labels_add:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Label'}
        urgency_min:
          type: integer
          minimum: 0
          maximum: 3
          description: The lowest urgency the message can get; the model may raise it.
        needs_reply:
          type: number
          minimum: 0
          maximum: 1
          description: Fixes `needs_reply`; the model's value is not used.
        skip_model:
          type: boolean
          description: '`true` finishes triage with a rules-only record, without the model.'
    CustomRefPattern:
      type: object
      description: >-
        A tenant-defined reference pattern, matched exactly at ingest and searchable with
        `ref:` (stored with kind `custom:<name>`). Patterns use the Rust `regex` crate syntax: linear time, no
        back-references, compiled size capped at 64 KB.
      required: [name, pattern]
      properties:
        name:
          type: string
          minLength: 1
          examples: [booking]
        pattern:
          type: string
          minLength: 1
          examples: ['BK-\d{4,6}']
        normalise:
          type: string
          description: How matched values are normalised before storage and comparison.
          examples: [upper]

    # ── Identities ───────────────────────────────────────────────────────────────────────────────

    IdentityStatus:
      type: string
      description: '`deleting` and `deleted` are set by identity deletion.'
      enum: [active, paused, deleting, deleted]
    PauseReason:
      type: string
      enum: [manual, abuse_threshold, tenant_suspended]
    Username:
      type: string
      description: >-
        The stored form of a username: the lower-case local-part stem. Requests send a `UsernameInput`,
        which the service validates and lower-cases into this form.
      pattern: '^[a-z0-9][a-z0-9._-]{0,23}$'
      examples: [bookings]
    UsernameInput:
      type: string
      description: >-
        A username as sent in a request. The schema does not constrain it: the service validates it with
        the username rules ([A1], [A3], [A4], [A12]) and returns their own codes, never a generic
        `invalid_request`. A reserved name, a confusable one (homoglyphs, mixed scripts, right-to-left
        characters) or a name that folds to a reserved one gets `400 address_reserved`; any other non-ASCII
        character `400 address_unsupported`; a name whose lower-cased form does not match the stored form
        `^[a-z0-9][a-z0-9._-]{0,23}$` (at most 24 characters, no `..`, not ending in `.`) gets
        `400 address_invalid`; username plus tenant suffix over 40 characters gets `400 local_part_too_long`.
      examples: [bookings]
    DisplayName:
      type: string
      description: At most 78 characters, no CR or LF. Unicode is allowed.
      minLength: 1
      maxLength: 78
      pattern: '^[^\r\n]*$'
      examples: [Acme Car Hire]
    IdentityOwner:
      type: object
      description: The accountable human for the identity (FR-IDN-2). Required before the identity can send.
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          examples: [Sam Patel]
        email: {$ref: '#/components/schemas/EmailAddress'}
    IdentitySignature:
      type: object
      description: Appended to outbound messages according to policy. `html` is sanitised on write.
      properties:
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
    IdentitySendPolicy:
      type: object
      description: Per-identity sending rules, applied on top of the tenant policy.
      properties:
        daily_cap:
          type: integer
          minimum: 0
          description: Sends per day for this identity. Defaults to the tenant's `identity_daily_send_cap`.
        auto_reply:
          type: string
          enum: [allowed, denied]
          default: allowed
          description: >-
            Whether the identity may send `kind: "auto_reply"` messages. `denied` refuses them
            (`409 auto_reply_not_allowed`); `allowed`, the default, leaves the decision to the tenant's
            `policy.auto_reply.allowed` and the exchange cap.
        require_known_recipient:
          type: boolean
          default: false
          description: Refuse recipients the identity has never exchanged mail with ([E2]).
    Identity:
      type: object
      required: [id, tenant_id, username, display_name, purpose, status, pause_reason, primary_address, addresses, owner, signature, send_policy, metadata, client_id, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/IdentityId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        username: {$ref: '#/components/schemas/Username'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        purpose:
          type: [string, 'null']
          description: A free tag, for example `bookings`.
        status: {$ref: '#/components/schemas/IdentityStatus'}
        pause_reason:
          description: Set when `status` is `paused`.
          oneOf:
            - $ref: '#/components/schemas/PauseReason'
            - type: 'null'
        primary_address: {$ref: '#/components/schemas/EmailAddress'}
        addresses:
          type: array
          description: Every address of the identity, in every status.
          items: {$ref: '#/components/schemas/Address'}
        owner:
          oneOf:
            - $ref: '#/components/schemas/IdentityOwner'
            - type: 'null'
        signature: {$ref: '#/components/schemas/IdentitySignature'}
        send_policy: {$ref: '#/components/schemas/IdentitySendPolicy'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        client_id:
          type: [string, 'null']
          description: The integrator's idempotent-create key.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IdentityCreateRequest:
      type: object
      required: [username, display_name]
      properties:
        username: {$ref: '#/components/schemas/UsernameInput'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        purpose:
          type: string
          description: A free tag, for example `bookings`.
        owner: {$ref: '#/components/schemas/IdentityOwner'}
        signature: {$ref: '#/components/schemas/IdentitySignature'}
        domain_id:
          description: >-
            A healthy tenant domain for the primary address (`{username}@{domain}`). Omitted: the platform
            domain (`{username}{suffix}@{platform}`).
          $ref: '#/components/schemas/DomainId'
        client_id:
          type: string
          minLength: 1
          description: Makes the create idempotent within the tenant.
          examples: ['acme:bookings']
        metadata: {$ref: '#/components/schemas/Metadata'}
    IdentityUpdateRequest:
      type: object
      minProperties: 1
      properties:
        display_name: {$ref: '#/components/schemas/DisplayName'}
        purpose:
          type: [string, 'null']
        owner: {$ref: '#/components/schemas/IdentityOwner'}
        signature: {$ref: '#/components/schemas/IdentitySignature'}
        metadata: {$ref: '#/components/schemas/Metadata'}
        send_policy: {$ref: '#/components/schemas/IdentitySendPolicy'}
        status:
          type: string
          description: '`paused` pauses with reason `manual`; `active` resumes.'
          enum: [active, paused]

    # ── Addresses ────────────────────────────────────────────────────────────────────────────────

    AddressRole:
      type: string
      enum: [primary, alias]
    AddressStatus:
      type: string
      description: >-
        `pending` until the domain is healthy; `active`; `retiring` (still receives, until `retire_at`);
        `retired` (inbound refused with `550 5.1.6`).
      enum: [pending, active, retiring, retired]
    AddressForwarding:
      type: [string, 'null']
      description: >-
        `null` when the address's domain does not use `inbound: forward`. Otherwise `unverified` (no
        forwarding test and no forwarded message has arrived yet), `ok` (the last test passed, or mail
        arrived through forwarding) or `failed` (the last test timed out after 10 minutes).
      enum: [unverified, ok, failed, null]
    Address:
      type: object
      required: [id, identity_id, address, local_part, domain_id, role, status, retire_at, retired_at, forwarding, forwarding_checked_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/AddressId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        address: {$ref: '#/components/schemas/EmailAddress'}
        local_part:
          type: string
        domain_id: {$ref: '#/components/schemas/DomainId'}
        role: {$ref: '#/components/schemas/AddressRole'}
        status: {$ref: '#/components/schemas/AddressStatus'}
        retire_at:
          type: [string, 'null']
          format: date-time
          description: When a `retiring` address becomes `retired`.
        retired_at:
          type: [string, 'null']
          format: date-time
        forwarding: {$ref: '#/components/schemas/AddressForwarding'}
        forwarding_checked_at:
          type: [string, 'null']
          format: date-time
          description: When `forwarding` last changed.
        created_at:
          type: string
          format: date-time
    AddressCreateRequest:
      type: object
      required: [local_part, domain_id]
      properties:
        local_part:
          type: string
          description: >-
            The local part on the tenant domain. The schema does not constrain it: the service validates it
            with the username rules for a tenant domain, with a maximum of 40 characters (room for a thread
            token), and returns their own codes, never a generic `invalid_request`: `400 address_reserved`
            for a reserved or confusable name, `400 address_unsupported` for any other non-ASCII character,
            and `400 address_invalid` when the lower-cased form does not match the stored form
            `^[a-z0-9][a-z0-9._-]{0,39}$` (no `..`, not ending in `.`).
          examples: [bookings]
        domain_id: {$ref: '#/components/schemas/DomainId'}
    PromoteAddressRequest:
      type: object
      properties:
        retire_previous_after_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 90
          description: Days the previous primary stays `retiring` before it becomes `retired`.
    RetireAddressRequest:
      type: object
      properties:
        after_days:
          type: integer
          minimum: 0
          maximum: 365
          default: 90
          description: Days the alias stays `retiring`. `0` retires it immediately.

    # ── Domains ──────────────────────────────────────────────────────────────────────────────────

    DomainMethod:
      type: string
      description: |
        How the domain is connected (FR-DOM-7). The method fixes `kind`, `inbound` and `transport`; `platform`
        is the deployment's shared domain only.

        | `method` | The customer changes | `kind` | `inbound` | `transport` |
        |---|---|---|---|---|
        | `cloudflare_zone` | Nothing: the zone is in this Cloudflare account and the Worker writes the records | `zone` | `routing` | `cloudflare` |
        | `nameservers` | Two NS records at the registrar, for a domain used only for mail | `zone` | `routing` | `cloudflare` |
        | `dns_records` | One MX, three DKIM CNAMEs, a MAIL FROM MX and TXT, and the ownership TXT, at any DNS host | `external` | `ses` | `ses` |
        | `send_only` | Three DKIM CNAMEs, a MAIL FROM MX and TXT, and the ownership TXT; their own mailbox forwards to the agent | `external` | `forward` | `ses` |
        | `smtp_relay` | The ownership TXT, plus what their own mail provider already needs | `external` | `forward` or `ses` | `smtp` |
        | `delegated_subdomain` | NS records for one subdomain | `delegated` | `routing` | `cloudflare` |
      enum: [platform, cloudflare_zone, nameservers, dns_records, send_only, smtp_relay, delegated_subdomain]
    DomainKind:
      type: string
      description: >-
        Where the domain's DNS lives relative to this deployment. `platform` is the deployment's shared
        domain; `zone` a zone in this Cloudflare account; `delegated` a child zone for a subdomain whose
        parent stays at another DNS host; `external` DNS at any other host.
      enum: [platform, zone, delegated, external]
    DomainInbound:
      type: string
      description: >-
        How mail to the domain's addresses reaches identities: `routing` (Cloudflare Email Routing), `ses`
        (Amazon SES receiving, through `/hooks/ses/inbound`), `forward` (the customer's own mailbox
        forwards to each identity's platform address) or `none`.
      enum: [routing, ses, forward, none]
    DomainState:
      type: string
      description: >-
        `pending` → `verifying` → `healthy` ⇄ `degraded` → `failing` → `suspended`; `removing` → `removed`
        after deletion. A return to `healthy` emits `domain.recovered`.
      enum: [pending, verifying, healthy, degraded, failing, suspended, removing, removed]
    RoutingMode:
      type: string
      description: '`catch_all` (zone apex, or SES receiving), `literal` (one routing rule per address, zone subdomains) or `forward` (forwarding domains).'
      enum: [catch_all, literal, forward]
    Transport:
      type: string
      description: How mail from the domain's addresses is sent.
      enum: [cloudflare, ses, smtp]
    ReplyTokenMode:
      type: string
      description: '`subaddress` puts the thread token in the `Reply-To` sub-address (FR-OUT-6).'
      enum: [subaddress, none]
    SmtpSettings:
      type: object
      description: >-
        SMTP relay settings (`smtp_relay` only). The Worker connects once (EHLO, STARTTLS, AUTH, QUIT)
        before it stores them. The credentials are sealed under `PM_MASTER_KEY` and never returned, logged
        or exported.
      required: [host, port, username, password]
      properties:
        host:
          type: string
          format: hostname
          description: A DNS name, not an IP literal. It must resolve to public addresses.
          examples: [smtp.provider.example]
        port:
          type: integer
          description: '`465` (implicit TLS) or `587` (STARTTLS). Any other port, `25` included, returns `400 smtp_port_not_allowed`.'
          examples: [587]
        username:
          type: string
          examples: [agents@brightwell.example]
        password:
          type: string
          format: password
          writeOnly: true
        probe_from:
          type: string
          format: email
          description: An address the relay accepts as sender, used by the alignment probe. Defaults to `postmaster@{name}`.
          examples: [agents@brightwell.example]
    DomainSmtp:
      type: object
      description: The relay settings as stored, never the password.
      required: [host, port, username, probe_from]
      properties:
        host:
          type: string
          examples: [smtp.provider.example]
        port:
          type: integer
          enum: [465, 587]
        username:
          type: string
          examples: [agents@brightwell.example]
        probe_from:
          type: string
          format: email
          examples: [agents@brightwell.example]
    DomainProbe:
      type: object
      description: The last alignment probe of an `smtp` domain.
      required: [last_at, result]
      properties:
        last_at:
          type: [string, 'null']
          format: date-time
          description: '`null` before the first probe.'
        result:
          type: [string, 'null']
          description: >-
            `pass`, or the issue code of the failure. `null` before the first probe.
          enum: [pass, smtp_unaligned, smtp_from_rewritten, smtp_probe_timeout, smtp_auth_failed, smtp_tls_required, null]
    Domain:
      type: object
      required: [id, tenant_id, name, method, kind, inbound, transport, is_apex, routing_mode, reply_token, receiving, sending, ses_region, mail_from_domain, smtp, probe, state, state_reason, state_changed_at, delivery_events, details, records, created_at]
      properties:
        id: {$ref: '#/components/schemas/DomainId'}
        tenant_id:
          description: '`null` for the platform domain.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        name:
          type: string
          format: hostname
          description: The domain as an IDNA A-label, lower case.
          examples: [agents.brightwell.example]
        method: {$ref: '#/components/schemas/DomainMethod'}
        kind: {$ref: '#/components/schemas/DomainKind'}
        inbound: {$ref: '#/components/schemas/DomainInbound'}
        transport: {$ref: '#/components/schemas/Transport'}
        is_apex:
          type: boolean
        routing_mode: {$ref: '#/components/schemas/RoutingMode'}
        reply_token: {$ref: '#/components/schemas/ReplyTokenMode'}
        receiving:
          type: boolean
        sending:
          type: boolean
        ses_region:
          type: [string, 'null']
          description: >-
            The region of the domain's SES identity: set when `inbound` or `transport` is `ses`, and on a
            Cloudflare-method domain that has an SES identity for the [J5] failover; otherwise `null`.
          examples: [eu-west-2]
        mail_from_domain:
          type: [string, 'null']
          description: The custom MAIL FROM domain, `pm-bounce.{name}`, when SES sends for the domain. The local part `pm-bounce` is reserved on such domains.
          examples: [pm-bounce.agents.brightwell.example]
        smtp:
          description: '`smtp_relay` only, otherwise `null`. Never the password.'
          oneOf:
            - $ref: '#/components/schemas/DomainSmtp'
            - type: 'null'
        probe:
          description: '`smtp` transport only, otherwise `null`.'
          oneOf:
            - $ref: '#/components/schemas/DomainProbe'
            - type: 'null'
        state: {$ref: '#/components/schemas/DomainState'}
        state_reason:
          type: [string, 'null']
          description: Machine code for the state, for example `dkim_missing`, or `zone_expired` on a `nameservers` domain whose zone Cloudflare deleted.
        state_changed_at:
          type: string
          format: date-time
        delivery_events:
          type: string
          enum: [active, manual, none]
          description: >-
            `active`: provider delivery events reach the service. `manual`: a Cloudflare-transport domain was
            created without an Email Sending event subscription (spike S9 fallback); delivery statuses stop at
            `submitted` until `pmail domains subscribe <domain>` has run. `none`: `sending` is false.
        details:
          description: '`null`, or the operator step that remains while `delivery_events` is `manual`.'
          oneOf:
            - type: object
              required: [action]
              properties:
                action:
                  type: string
                  examples: ['run pmail domains subscribe agents.brightwell.example']
            - type: 'null'
        records:
          type: array
          description: The records last read from the provider APIs, with their last check result.
          items: {$ref: '#/components/schemas/DnsRecord'}
        created_at:
          type: string
          format: date-time
      examples:
        - id: dom_01JA2B3C4D5E6F7G8H9J0K1M2N
          tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
          name: agents.brightwell.example
          method: dns_records
          kind: external
          inbound: ses
          transport: ses
          is_apex: false
          routing_mode: catch_all
          reply_token: subaddress
          receiving: true
          sending: true
          ses_region: eu-west-2
          mail_from_domain: pm-bounce.agents.brightwell.example
          smtp: null
          probe: null
          state: pending
          state_reason: null
          state_changed_at: '2026-10-09T10:00:00Z'
          delivery_events: active
          details: null
          records:
            - type: TXT
              name: _pylota-mail.agents.brightwell.example
              host: _pylota-mail.agents
              value: pm-verify=8f2k3m9q
              purpose: ownership
              required: true
            - type: MX
              name: agents.brightwell.example
              host: agents
              value: 10 inbound-smtp.eu-west-2.amazonaws.com
              purpose: mx
              required: true
          created_at: '2026-10-09T10:00:00Z'
    DomainCreateRequest:
      type: object
      description: >-
        `method` is required for new clients. When it is absent, the old `kind` is mapped: `zone` →
        `cloudflare_zone`, `external` → `send_only`; `kind: zone` with `create_zone: true` is the old
        spelling of `nameservers`.
      required: [name]
      anyOf:
        - required: [method]
        - required: [kind]
      properties:
        name:
          type: string
          format: hostname
          examples: [agents.brightwell.example]
        method:
          type: string
          enum: [cloudflare_zone, nameservers, dns_records, send_only, smtp_relay, delegated_subdomain]
        kind:
          type: string
          deprecated: true
          description: 'Old spelling, used only when `method` is absent: `zone` → `cloudflare_zone`, `external` → `send_only`.'
          enum: [zone, external]
        create_zone:
          type: boolean
          default: false
          deprecated: true
          description: 'Old spelling: `kind: zone` with `create_zone: true` means `method: nameservers`.'
        receiving:
          type: boolean
          default: true
        sending:
          type: boolean
          default: true
        replace_mx:
          type: boolean
          default: false
          description: >-
            `cloudflare_zone` apex and `dns_records`. A name that already has MX records, none of them the
            expected host, is refused with `409 existing_mx` unless this is `true` ([H5]). On a zone apex,
            enabling routing replaces the existing mail provider; on `dns_records` it means "I will replace
            these", and health reports `mx_unexpected` until the old records are gone.
        confirm_dedicated:
          type: boolean
          default: false
          description: >-
            `nameservers` only. Confirms that a website or mail on the name may stop. Without it, a name with
            A, AAAA or MX records, or a `www` CNAME, A or AAAA record, returns `409 domain_not_dedicated` ([N21]).
        inbound:
          type: string
          description: '`smtp_relay` only, and required there: `forward` (the customer''s mailbox forwards) or `ses` (they also publish the SES MX and DKIM records).'
          enum: [forward, ses]
        smtp:
          description: '`smtp_relay` only, and required there.'
          $ref: '#/components/schemas/SmtpSettings'
      if:
        properties:
          method: {const: smtp_relay}
        required: [method]
      then:
        required: [inbound, smtp]
    DomainUpdateRequest:
      type: object
      description: '`transport` (platform keys only), `smtp` (`smtp_relay` domains), or both.'
      minProperties: 1
      properties:
        transport:
          type: string
          description: >-
            Platform keys only. The transport that sends as a domain on Cloudflare (the failover of [J5]).
            `ses` needs the SES transport configured and a verified SES identity for the domain.
            `dns_records` and `send_only` domains send only through `ses`, `smtp_relay` domains only through
            `smtp`, and the platform domain only through `cloudflare`; another value returns
            `422 transport_unavailable` with `details.reason: "method_not_supported"`.
          enum: [cloudflare, ses]
        smtp:
          description: >-
            `smtp_relay` domains, tenant or platform keys. New relay settings, tested with one connection
            before they are stored and kept pending until an alignment probe with them passes; until then
            sends keep using the current values.
          $ref: '#/components/schemas/SmtpSettings'
    ProbeAccepted:
      type: object
      required: [probe_id]
      properties:
        probe_id:
          type: string
          pattern: '^prb_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The probe's ID. The result arrives as a domain health change.
          examples: [prb_01JA2B3C4D5E6F7G8H9J0K1M2N]
    DnsRecordStatus:
      type: string
      description: '`unexpected` means an extra record that conflicts, for example a second SPF record.'
      enum: [ok, missing, mismatch, unexpected]
    DnsRecord:
      type: object
      required: [type, name, host, value, purpose, required]
      properties:
        type:
          type: string
          enum: [TXT, MX, CNAME, NS]
        name:
          type: string
          description: The fully qualified name.
          examples: [_pylota-mail.mail.acmecarhire.example]
        host:
          type: string
          description: >-
            The same name relative to the registrable domain (from the Public Suffix List), for DNS hosts
            that ask for only that part ([N17]).
          examples: [_pylota-mail.mail]
        value:
          type: string
          examples: [pm-verify=8f2k3m9q]
        purpose:
          type: string
          description: What the record is for, for example `ownership`, `mx`, `dkim`, `return_path`, `spf`, `dmarc` or `ns`.
          examples: [ownership]
        required:
          type: boolean
        status:
          $ref: '#/components/schemas/DnsRecordStatus'
        observed:
          type: array
          description: The values DNS returned at the last check.
          items:
            type: string
    DomainRecords:
      type: object
      required: [data, checked_at]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DnsRecord'}
        checked_at:
          type: string
          format: date-time
    DomainIssue:
      type: object
      required: [code, record, fix]
      properties:
        code:
          type: string
          description: Machine code, for example `dkim_missing`.
        record:
          type: string
          description: The record name the issue is about.
        fix:
          type: string
          description: The exact change to make.
    DomainCheck:
      type: object
      required: [at, resolver, outcome]
      properties:
        at:
          type: string
          format: date-time
        resolver:
          type: string
          enum: [cloudflare-doh, google-doh]
        outcome:
          type: string
          enum: [pass, degraded, fail, ownership_changed, error]
    DomainHealth:
      type: object
      required: [state, reason, since, issues, checks, fallback_active]
      properties:
        state: {$ref: '#/components/schemas/DomainState'}
        reason:
          type: [string, 'null']
          description: Machine code for the state, for example `dkim_missing`.
        since:
          type: string
          format: date-time
        issues:
          type: array
          items: {$ref: '#/components/schemas/DomainIssue'}
        checks:
          type: array
          description: Recent checks, newest first.
          items: {$ref: '#/components/schemas/DomainCheck'}
        fallback_active:
          type: boolean
          description: Sends from this domain currently go out from platform addresses (`sent_via_fallback`).

    # ── Threads ──────────────────────────────────────────────────────────────────────────────────

    ThreadHold:
      type: object
      description: A legal hold. Retention and erasure skip the thread while it is set (FR-PRV-4).
      required: [reason, until, set_by, set_at]
      properties:
        reason:
          type: string
          examples: [PCN dispute WM12345678]
        until:
          type: [string, 'null']
          format: date-time
          description: When the hold lapses. `null` holds until removed.
        set_by:
          description: The key that set the hold.
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        set_at:
          type: string
          format: date-time
    ThreadHoldRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
        until:
          type: [string, 'null']
          format: date-time
          description: When the hold lapses. Omitted or `null` holds until removed.
    ThreadSummary:
      type: object
      required: [id, subject, participants, message_count, unread_count, first_at, last_at, last_inbound_at, last_direction, snippet, labels, category, needs_reply, urgency, hold]
      properties:
        id: {$ref: '#/components/schemas/ThreadId'}
        subject:
          type: string
          description: The normalised subject of the first message (untrusted content).
        participants:
          type: array
          description: Everyone on the thread, capped at 50.
          maxItems: 50
          items: {$ref: '#/components/schemas/MailboxAddress'}
        message_count:
          type: integer
          minimum: 0
        unread_count:
          type: integer
          minimum: 0
        first_at:
          type: string
          format: date-time
        last_at:
          type: string
          format: date-time
        last_inbound_at:
          type: [string, 'null']
          format: date-time
          description: When the latest inbound message arrived. Use it to detect new mail before approving a draft ([C5]).
        last_direction: {$ref: '#/components/schemas/Direction'}
        snippet:
          type: string
          description: Up to 240 characters of the latest message's `extracted_text` (untrusted content).
        labels:
          type: array
          description: Labels on any message in the thread.
          items: {$ref: '#/components/schemas/Label'}
        category:
          type: [string, 'null']
          description: The triage category of the latest triaged inbound message.
        needs_reply:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        urgency:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        archived:
          type: boolean
        hold:
          oneOf:
            - $ref: '#/components/schemas/ThreadHold'
            - type: 'null'
    Thread:
      description: A thread summary with a page of its messages, oldest first within the page.
      allOf:
        - $ref: '#/components/schemas/ThreadSummary'
        - type: object
          required: [messages, next_cursor]
          properties:
            messages:
              type: array
              items: {$ref: '#/components/schemas/Message'}
            next_cursor:
              type: [string, 'null']
              description: Cursor for the next page of messages, or `null` on the last page.
    ThreadUpdateRequest:
      type: object
      minProperties: 1
      properties:
        labels_add:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        read:
          type: boolean
        archived:
          type: boolean

    # ── Messages ─────────────────────────────────────────────────────────────────────────────────

    MessageStatus:
      type: string
      description: >-
        Inbound: `received`, `quarantined`, `throttled` (over the per-sender limit, hidden from agents) and
        `hidden` (receive-blocked or suppressed sender, kept for audit). Outbound: see `OutboundStatus`.
      enum: [received, quarantined, throttled, hidden, queued, submitted, delivered, deferred, bounced, complained, rejected, failed, uncertain, suppressed, canceled]
    OutboundStatus:
      type: string
      description: |
        The roll-up status of an outbound message. Per-recipient status is in `deliveries`.

        | Status | Meaning | Terminal |
        |---|---|---|
        | `queued` | Accepted, waiting for the transport | no |
        | `submitted` | The transport accepted it; `provider_message_id` is set | no |
        | `delivered` | Every recipient is delivered | yes |
        | `deferred` | At least one recipient has a temporary failure and the provider is still retrying | no |
        | `bounced` | At least one recipient bounced and none remains in flight | yes |
        | `complained` | A recipient reported spam (can follow `delivered`) | yes |
        | `rejected` | The transport refused it before sending (validation, policy) | yes |
        | `failed` | It could not be sent (quota exhausted after retries, or resolved as not sent) | yes |
        | `uncertain` | The outcome is unknown. It is never resent automatically | until resolved |
        | `suppressed` | Every recipient is suppressed. Nothing was sent | yes |
        | `canceled` | Cancelled while queued | yes |
      enum: [queued, submitted, delivered, deferred, bounced, complained, rejected, failed, uncertain, suppressed, canceled]
    MessageKind:
      type: string
      description: >-
        Inbound: `normal`, `automated`, `dsn`, `list`, `calendar` or `mdn`. Outbound: `transactional`,
        `marketing` or `auto_reply`.
      enum: [normal, automated, dsn, list, calendar, mdn, transactional, marketing, auto_reply]
    MessageFlag:
      type: string
      description: >-
        `sent_via_fallback` (sent from the platform address because the domain was failing), `parse_degraded`,
        `encrypted`, `message_id_conflict`, `reprocessed`, `reconciled`, `bcc` (the identity was BCC'd),
        `loopback` (delivered inside the deployment for a test tenant, [L3]) and `body_truncated` (a stored
        body was cut at its storage cap; the full message is in the raw MIME).
      enum: [sent_via_fallback, parse_degraded, encrypted, message_id_conflict, reprocessed, reconciled, bcc, loopback, body_truncated]
    QuarantineReason:
      type: string
      enum: [auth_failed, auth_unverified, spam, risky_attachment, blocked_sender, otp_unsolicited]
    MessageHeader:
      type: object
      description: One header field as received, in order (untrusted content).
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    Message:
      type: object
      description: >-
        A message. Every text field (subject, display names, filenames, bodies) is untrusted content: show
        it to a model inside a clearly delimited block, never as instructions.
      required: [id, thread_id, identity_id, direction, status, from, to, cc, bcc, reply_to, delivered_to, is_primary_recipient, subject, sent_at, received_at, extracted_text, text, html, attachments, labels, kind, trust, triage, refs, rfc_message_id, in_reply_to, deliveries, flags, metadata]
      properties:
        id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        direction: {$ref: '#/components/schemas/Direction'}
        status: {$ref: '#/components/schemas/MessageStatus'}
        from:
          description: The first parseable `From` mailbox, or `null` when there is none ([B13]).
          oneOf:
            - $ref: '#/components/schemas/MailboxAddress'
            - type: 'null'
        to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        bcc:
          type: array
          description: Outbound only. Always empty for inbound messages.
          items: {$ref: '#/components/schemas/MailboxAddress'}
        reply_to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        delivered_to:
          description: Inbound only. The envelope recipient this copy was delivered to.
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        is_primary_recipient:
          type: [boolean, 'null']
          description: >-
            Inbound only. `true` on exactly one copy when one message reached several identities of the
            tenant; act only on that copy ([A9]).
        subject:
          type: [string, 'null']
          maxLength: 998
        sent_at:
          type: [string, 'null']
          format: date-time
          description: The `Date` header, or the submit time for outbound messages.
        received_at:
          type: string
          format: date-time
          description: When the service stored the message (its own clock).
        extracted_text:
          type: [string, 'null']
          description: The new content, with quoted history, signatures and hidden text removed.
        text:
          type: [string, 'null']
          description: The full plain text (derived from HTML when the message has none). Included with `include=quoted`, otherwise `null`.
        html:
          type: [string, 'null']
          description: Sanitised HTML, never rendered by the service. Included with `include=html`, otherwise `null`.
        headers:
          type: array
          description: The original header fields. Present only with `include=headers`.
          items: {$ref: '#/components/schemas/MessageHeader'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/Attachment'}
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        kind: {$ref: '#/components/schemas/MessageKind'}
        trust:
          description: Authentication and trust metadata of an inbound message. `null` for outbound messages.
          oneOf:
            - $ref: '#/components/schemas/Trust'
            - type: 'null'
        triage:
          description: Triage of an inbound message. `null` for outbound messages, and for a quarantined message until it is released (triage then runs).
          oneOf:
            - $ref: '#/components/schemas/Triage'
            - type: 'null'
        quarantine_reason:
          description: Set when `status` is `quarantined`.
          oneOf:
            - $ref: '#/components/schemas/QuarantineReason'
            - type: 'null'
        refs:
          type: array
          description: Exact references extracted at ingest (FR-SRCH-4).
          items: {$ref: '#/components/schemas/Ref'}
        rfc_message_id:
          type: [string, 'null']
          description: The `Message-ID` header, normalised, without angle brackets.
        in_reply_to:
          type: [string, 'null']
          description: The `In-Reply-To` header, normalised, without angle brackets.
        provider_message_id:
          type: [string, 'null']
          description: Outbound only. The transport's message ID, set once the message is `submitted`.
        deliveries:
          description: Outbound only. Per-recipient delivery status; `null` for inbound messages.
          oneOf:
            - type: array
              items: {$ref: '#/components/schemas/Delivery'}
            - type: 'null'
        flags:
          type: array
          items: {$ref: '#/components/schemas/MessageFlag'}
        metadata: {$ref: '#/components/schemas/Metadata'}
    MessageSummary:
      type: object
      description: The thin message summary carried in webhook events.
      required: [id, thread_id, direction, status, from, to, cc, delivered_to, is_primary_recipient, subject, sent_at, received_at, kind, labels, in_reply_to, flags]
      properties:
        id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        direction: {$ref: '#/components/schemas/Direction'}
        status: {$ref: '#/components/schemas/MessageStatus'}
        from:
          oneOf:
            - $ref: '#/components/schemas/MailboxAddress'
            - type: 'null'
        to:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        cc:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        delivered_to:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        is_primary_recipient:
          type: [boolean, 'null']
          description: >-
            Inbound only. `true` on exactly one copy when one message reached several identities of the
            tenant; act only on that copy ([A9]).
        subject:
          type: [string, 'null']
        sent_at:
          type: [string, 'null']
          format: date-time
        received_at:
          type: string
          format: date-time
        kind: {$ref: '#/components/schemas/MessageKind'}
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        in_reply_to:
          type: [string, 'null']
        flags:
          type: array
          items: {$ref: '#/components/schemas/MessageFlag'}
    MessageUpdateRequest:
      type: object
      minProperties: 1
      properties:
        labels_add:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        labels_remove:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        read:
          type: boolean

    AttachmentRisk:
      type: string
      description: Why an attachment is unsafe ([B10]). A message with a risky attachment is quarantined.
      enum: [executable, macro, encrypted_archive, archive_bomb, type_mismatch, encrypted_document]
    AttachmentTextStatus:
      type: string
      description: '`unavailable`: extraction failed or the type is unsupported. `skipped`: by policy or risk.'
      enum: [pending, ready, unavailable, skipped]
    Attachment:
      type: object
      required: [id, filename, content_type, size, disposition, text_status, pages, risk]
      properties:
        id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: [string, 'null']
          description: Sanitised (no path, at most 255 bytes). Untrusted content.
        content_type:
          type: string
          examples: [application/pdf]
        size:
          type: integer
          minimum: 0
          description: Bytes.
        disposition:
          type: [string, 'null']
          enum: [attachment, inline, null]
        text_status: {$ref: '#/components/schemas/AttachmentTextStatus'}
        pages:
          type: [integer, 'null']
          minimum: 0
          description: Pages of extracted text, when known.
        risk:
          oneOf:
            - $ref: '#/components/schemas/AttachmentRisk'
            - type: 'null'
    AttachmentText:
      type: object
      required: [status, pages, total_pages, truncated]
      properties:
        status: {$ref: '#/components/schemas/AttachmentTextStatus'}
        pages:
          type: array
          description: The requested pages (untrusted content). Empty unless `status` is `ready`.
          items:
            type: object
            required: [page, text]
            properties:
              page:
                type: integer
                minimum: 1
              text:
                type: string
        total_pages:
          type: [integer, 'null']
          minimum: 0
        truncated:
          type: boolean
          description: '`true` when the text was cut at 200 KB.'

    AuthVerdict:
      type: string
      description: >-
        `unverified`: the sender's DMARC policy is `quarantine` or `reject`, no aligned DKIM signature
        passed, and SPF alignment could not be read because no trusted `Authentication-Results` header was
        available (`PM_TRUSTED_AUTHSERV_ID` not yet set). It quarantines with `auth_unverified`.
      enum: [pass, fail, softfail, none, unaligned, unverified]
    AuthResult:
      type: string
      description: An RFC 8601 authentication result for one method.
      enum: [pass, fail, softfail, neutral, none, temperror, permerror, policy]
    TrustFlag:
      type: string
      enum: [hidden_text, display_name_spoof, lookalike_domain, reply_to_mismatch, thread_join_unverified]
    Trust:
      type: object
      description: Authentication and trust metadata (FR-IN-4).
      required: [verdict, spf, dkim, dmarc, arc, known_sender, quarantined, spam_score, automated, flags]
      properties:
        verdict: {$ref: '#/components/schemas/AuthVerdict'}
        spf: {$ref: '#/components/schemas/AuthResult'}
        dkim: {$ref: '#/components/schemas/AuthResult'}
        dmarc: {$ref: '#/components/schemas/AuthResult'}
        arc: {$ref: '#/components/schemas/AuthResult'}
        known_sender:
          type: boolean
          description: The sender is a known contact of this identity.
        quarantined:
          type: boolean
        spam_score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        automated:
          type: boolean
          description: Auto-reply, mailing list, bounce or read receipt (FR-IN-6). Never auto-reply to it.
        flags:
          type: array
          items: {$ref: '#/components/schemas/TrustFlag'}
    TrustSummary:
      type: object
      required: [verdict, known_sender, quarantined]
      properties:
        verdict: {$ref: '#/components/schemas/AuthVerdict'}
        known_sender:
          type: boolean
        quarantined:
          type: boolean

    TriageStatus:
      type: string
      enum: [pending, done, skipped, failed]
    BuiltinTriageCategory:
      type: string
      description: The built-in triage categories, used when the tenant has no custom list.
      enum: [customer_request, vendor, billing, legal_compliance, verification, notification, newsletter, marketing, auto_reply, personal, spam, other]
    RiskFlag:
      type: string
      enum: [payment_change_request, credential_request, prompt_injection_suspected, phishing_suspected, impersonation_suspected, urgent_pressure, unknown_sender, auth_failed, attachment_risky, hidden_text]
    Triage:
      type: object
      description: Advisory triage (FR-TRI-1). It never sends, deletes or releases anything.
      required: [status, category, needs_reply, urgency, summary, language, risk_flags, model, version]
      properties:
        status: {$ref: '#/components/schemas/TriageStatus'}
        category:
          description: A built-in category, or one of the tenant's custom categories.
          anyOf:
            - $ref: '#/components/schemas/BuiltinTriageCategory'
            - type: string
            - type: 'null'
        needs_reply:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        urgency:
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        summary:
          type: [string, 'null']
          maxLength: 280
        language:
          type: [string, 'null']
          description: BCP 47 language tag.
          examples: [en]
        risk_flags:
          type: array
          items: {$ref: '#/components/schemas/RiskFlag'}
        model:
          type: [string, 'null']
          description: 'The model that produced the triage, `"rules"` when rules alone decided (`skip_model`), or `null` while it is pending or when it was skipped or failed.'
          examples: ['@cf/openai/gpt-oss-20b']
        version:
          type: integer
          minimum: 0
          description: Increases each time triage is re-run.
        reason:
          type: string
          description: >-
            Present only when `status` is `skipped` (`allowance`: the workspace's triage allowance is spent,
            edge case W7; `policy_disabled`; `not_eligible`: hidden, throttled, DSN or MDN) or `failed`
            (`invalid_output`, `model_unavailable`, `input_unavailable`).
          enum: [allowance, policy_disabled, not_eligible, invalid_output, model_unavailable, input_unavailable]

    DeliveryStatus:
      type: string
      enum: [queued, suppressed, submitted, delivered, deferred, bounced, complained, rejected, failed, uncertain]
    Delivery:
      type: object
      description: The delivery status of one recipient of an outbound message.
      required: [address, field, status, smtp_code, enhanced_code, bounce_type, updated_at]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        field:
          type: string
          enum: [to, cc, bcc]
        status: {$ref: '#/components/schemas/DeliveryStatus'}
        smtp_code:
          type: [string, 'null']
          examples: ['250']
        enhanced_code:
          type: [string, 'null']
          description: The RFC 3463 enhanced status code from the provider or relay, when it gave one.
          examples: ['5.1.1']
        bounce_type:
          type: [string, 'null']
          enum: [hard, soft, null]
        updated_at:
          type: string
          format: date-time
    Ref:
      type: object
      description: An exact reference extracted from the subject, body or attachment text.
      required: [kind, value]
      properties:
        kind:
          description: >-
            A built-in kind, or `custom:<name>` for a tenant pattern (a booking reference, for example, is
            `custom:booking`).
          anyOf:
            - type: string
              enum: [uk_plate, pcn, invoice, order, amount, phone, email, domain, date]
            - type: string
              pattern: '^custom:.+$'
        value:
          type: string
          description: The normalised value, for example `AB12CDE`, `+447700900123` or `GBP:412.80`.

    # ── Sending ──────────────────────────────────────────────────────────────────────────────────

    Recipient:
      description: A recipient, as a bare address or as an object with a display name.
      oneOf:
        - $ref: '#/components/schemas/EmailAddress'
        - type: object
          required: [address]
          properties:
            address: {$ref: '#/components/schemas/EmailAddress'}
            name:
              type: string
              description: Display name. No CR or LF.
              pattern: '^[^\r\n]*$'
    AttachmentInput:
      type: object
      required: [filename, content_type, content_base64]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          examples: [application/pdf]
        content_base64:
          type: string
          contentEncoding: base64
          description: The file bytes, base64-encoded.
        disposition:
          type: string
          enum: [attachment, inline]
          default: attachment
        content_id:
          type: string
          description: The Content-ID for an `inline` attachment referenced as `cid:` from the HTML body.
    Unsubscribe:
      type: object
      description: One-click unsubscribe (RFC 8058) for marketing mail. Sets the List-Unsubscribe headers and a visible link.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        mailto:
          type: string
          description: An unsubscribe mailbox, for the `mailto:` form of List-Unsubscribe.
    Consent:
      type: object
      description: The tenant's attestation of the recipient's consent to marketing mail.
      required: [basis, recorded_at]
      properties:
        basis:
          type: string
          examples: [opt_in]
        recorded_at:
          type: string
          format: date-time
    SendHeaders:
      type: object
      description: >-
        Custom headers, checked when the request arrives, never later at the transport. A name must be an
        `X-` name matching `^X-[A-Za-z0-9_-]+$` (at most 100 bytes; `X-Pylota-*` and `X-AI-Generated` are
        reserved) or one of `Importance`, `Priority`, `Sensitivity`, `Keywords`, `Comments` and
        `Organization`, spelled exactly so; any other name is `400 header_not_allowed` (the schema leaves
        names unconstrained, so that this code and not a generic `invalid_request` is returned). `Importance` takes
        only `high`, `normal` or `low`, `Priority` only `normal`, `non-urgent` or `urgent`, and
        `Sensitivity` only `personal`, `private` or `company-confidential`; another value, an empty value or
        one with CR or LF is `400 invalid_request`. Everything else is set by the service. At most 16 KB in
        total; each value at most 2,048 bytes.
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: '^[^\r\n]+$'
      properties:
        Importance:
          type: string
          enum: [high, normal, low]
        Priority:
          type: string
          enum: [normal, non-urgent, urgent]
        Sensitivity:
          type: string
          enum: [personal, private, company-confidential]
      examples:
        - X-Booking-Ref: BK-2291
    SendRequest:
      type: object
      description: >-
        A new message. At most `policy.max_recipients` (default 10, hard maximum 49) across `to`, `cc` and
        `bcc` (`400 too_many_recipients`); duplicates are removed.
      required: [to, subject]
      anyOf:
        - required: [text]
        - required: [html]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        cc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        bcc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        subject:
          type: string
          maxLength: 998
        text:
          type: [string, 'null']
          description: Plain-text body. Derived from `html` when missing.
        html:
          type: [string, 'null']
          description: HTML body.
        attachments:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AttachmentInput'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
          default: transactional
        unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
        consent:
          $ref: '#/components/schemas/Consent'
        thread_id:
          description: Continue this thread without quoting; `References` are set from the thread.
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
        from_address:
          description: >-
            An `active` address of the identity, or a `retiring` one on a thread that already uses it ([G7];
            with `thread_id`). Otherwise `400 invalid_request` with `details.errors[0].path = "from_address"`.
            Default the primary.
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        headers: {$ref: '#/components/schemas/SendHeaders'}
        metadata: {$ref: '#/components/schemas/Metadata'}
    ReplyRequest:
      type: object
      description: >-
        The body of a reply or reply-all. Recipients, subject, `From`, `In-Reply-To` and `References` are
        derived from the original message. At least one of `text` and `html` is required.
      anyOf:
        - required: [text]
        - required: [html]
      properties:
        text:
          type: [string, 'null']
        html:
          type: [string, 'null']
        attachments:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/AttachmentInput'}
        kind:
          type: string
          enum: [transactional, marketing, auto_reply]
          default: transactional
        unsubscribe:
          $ref: '#/components/schemas/Unsubscribe'
        consent:
          $ref: '#/components/schemas/Consent'
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        headers: {$ref: '#/components/schemas/SendHeaders'}
        metadata: {$ref: '#/components/schemas/Metadata'}
    ForwardRequest:
      type: object
      description: >-
        The body of a forward. The original message is attached with its `References` kept. Recipients
        count against `policy.max_recipients` as for a new message.
      required: [to]
      properties:
        to:
          type: array
          minItems: 1
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        cc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        bcc:
          type: array
          maxItems: 49
          items: {$ref: '#/components/schemas/Recipient'}
        text:
          type: [string, 'null']
          description: A note placed above the forwarded message.
        html:
          type: [string, 'null']
        include_attachments:
          type: boolean
          default: true
          description: Attach the original's attachments (never those with a `risk`).
        attachments:
          type: array
          description: Extra attachments.
          items: {$ref: '#/components/schemas/AttachmentInput'}
        labels:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/Label'}
        headers: {$ref: '#/components/schemas/SendHeaders'}
        metadata: {$ref: '#/components/schemas/Metadata'}
    SendResponse:
      description: >-
        The outbound Message object (`direction: "outbound"`, `status: "queued"` on first acceptance) plus
        `deduplicated`.
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [deduplicated]
          properties:
            deduplicated:
              type: boolean
              description: '`true` when this is the stored response of an earlier request with the same `Idempotency-Key`.'
    DryRunResult:
      type: object
      description: The result of a dry run (`dry_run=true`). Nothing was sent or stored.
      required: [would_send, recipients]
      properties:
        would_send:
          type: boolean
          const: true
          description: Always `true` in a `200`; a send that would be refused returns its error instead.
        recipients:
          type: array
          description: Each recipient after duplicates are removed, with what a real send would do with it.
          items:
            type: object
            required: [address, field, status]
            properties:
              address: {$ref: '#/components/schemas/EmailAddress'}
              field:
                type: string
                enum: [to, cc, bcc]
              status:
                type: string
                description: '`queued` (it would be sent) or `suppressed` (it would be skipped; see `reason`).'
                enum: [queued, suppressed]
              reason:
                type: string
                description: >-
                  Only for `suppressed`: the suppression reason (`hard_bounce`, `complaint`, `unsubscribe`,
                  `manual`, `provider`), or `send_block`, `not_on_allowlist` or `unknown_recipient`.
                examples: [hard_bounce]
    ResolveRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          description: >-
            `sent` moves the message and its uncertain deliveries to `submitted` and emits `message.sent`;
            `not_sent` marks the message `failed` with reason `resolved_not_sent`.
          enum: [sent, not_sent]
    ReleaseRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1

    # ── Search ───────────────────────────────────────────────────────────────────────────────────

    SearchFilters:
      type: object
      description: Structured filters, combined with the operators in `q`. Dates resolve in the tenant time zone ([F9]).
      properties:
        direction:
          oneOf:
            - $ref: '#/components/schemas/Direction'
            - type: 'null'
        labels:
          type: array
          items: {$ref: '#/components/schemas/Label'}
        after:
          type: [string, 'null']
          format: date-time
        before:
          type: [string, 'null']
          format: date-time
    SearchRequest:
      type: object
      description: A `keyword`, `semantic` or `hybrid` search.
      required: [q]
      properties:
        q:
          type: string
          maxLength: 1024
          description: The query, in the query language described on `searchIdentity`. At most 1,024 characters; `""` matches all messages.
        mode:
          type: string
          enum: [keyword, semantic, hybrid]
          default: hybrid
        filters: {$ref: '#/components/schemas/SearchFilters'}
        group_by:
          type: string
          enum: [message, thread]
          default: message
          description: '`thread` returns one `ThreadHit` per thread.'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        snippet_chars:
          type: integer
          minimum: 40
          maximum: 1000
          default: 240
          description: Maximum characters per snippet.
        facets:
          type: boolean
          default: true
          description: Include `facets` in the response.
        include_quarantined:
          type: boolean
          default: false
          description: Include quarantined mail. Needs `quarantine:review`.
        cursor:
          type: [string, 'null']
          description: The `next_cursor` of the previous page.
        require_mode:
          type: boolean
          default: false
          description: Fail with `503 search_degraded` instead of degrading when the requested mode is unavailable.
    TenantSearchRequest:
      description: A `keyword`, `semantic` or `hybrid` search across a tenant's identities.
      allOf:
        - $ref: '#/components/schemas/SearchRequest'
        - type: object
          properties:
            identity_ids:
              $ref: '#/components/schemas/IdentityIdFilter'
    IdentityIdFilter:
      type: array
      description: Restrict a tenant search to these identities (at most 100).
      uniqueItems: true
      minItems: 1
      maxItems: 100
      items: {$ref: '#/components/schemas/IdentityId'}
    AgenticBudget:
      type: object
      properties:
        max_steps:
          type: integer
          minimum: 2
          maximum: 10
          default: 6
          description: Defaults to, and is capped by, `policy.search.agentic_max_steps` (a larger value is lowered to it, not refused). Outside 2–10 is `400 invalid_request`.
        max_seconds:
          type: integer
          minimum: 3
          maximum: 30
          default: 8
          description: Defaults to, and is capped by, `policy.search.agentic_max_seconds` (a larger value is lowered to it, not refused). Outside 3–30 is `400 invalid_request`.
    AgenticRequest:
      type: object
      description: An agentic search. The planner's tools are read-only and cannot widen the caller's scope or filters ([F10]).
      required: [q, mode]
      properties:
        q:
          type: string
          minLength: 1
          maxLength: 1024
          description: The question, in natural language, at most 1,024 characters.
        mode:
          type: string
          const: agentic
        budget: {$ref: '#/components/schemas/AgenticBudget'}
        stream:
          type: boolean
          default: false
          description: 'With `Accept: text/event-stream`, stream progress as server-sent events.'
        filters: {$ref: '#/components/schemas/SearchFilters'}
        include_quarantined:
          type: boolean
          default: false
          description: Include quarantined mail. Needs `quarantine:review`.
        require_mode:
          type: boolean
          default: false
          description: Fail with `503 search_degraded` instead of degrading to hybrid results when the model is unavailable.
    TenantAgenticRequest:
      description: An agentic search across a tenant's identities.
      allOf:
        - $ref: '#/components/schemas/AgenticRequest'
        - type: object
          properties:
            identity_ids:
              $ref: '#/components/schemas/IdentityIdFilter'
    SearchMode:
      type: string
      enum: [keyword, semantic, hybrid, agentic]
    SearchResponse:
      type: object
      required: [query, hits, facets, next_cursor, truncated, semantic_coverage, degraded, as_of]
      properties:
        query:
          type: object
          required: [parsed, mode]
          properties:
            parsed:
              type: string
              description: The query as parsed (normalised).
            mode:
              type: string
              enum: [keyword, semantic, hybrid]
              description: The mode that ran.
        hits:
          type: array
          description: '`SearchHit` rows, or `ThreadHit` rows with `group_by: "thread"`.'
          items:
            oneOf:
              - $ref: '#/components/schemas/SearchHit'
              - $ref: '#/components/schemas/ThreadHit'
        facets:
          description: 'Computed on the first page only: `null` on later pages (with a `cursor`) and when the request set `facets: false`.'
          oneOf:
            - $ref: '#/components/schemas/Facets'
            - type: 'null'
        next_cursor:
          type: [string, 'null']
        truncated:
          type: boolean
          description: '`true` when results were cut to fit the 256 KB response cap.'
        semantic_coverage:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: The share of the mailbox that is embedded (FR-SRCH-7).
        degraded:
          type: boolean
          description: A mode's dependency was unavailable and search fell back.
        as_of:
          type: string
          format: date-time
          description: The point in time the results (and cursor) are pinned to.
        partial:
          type: boolean
          description: >-
            Tenant search only, and always present there. `true` when at least one identity's mailbox errored
            or missed the 900 ms deadline from the start of the fan-out ([F15]).
        failed_identities:
          type: array
          description: >-
            Tenant search only, and always present there (`[]` when every identity answered). The identities
            whose mailboxes errored or did not answer in time; their late results are discarded.
          items: {$ref: '#/components/schemas/IdentityId'}
    TenantSearchResponse:
      description: A `SearchResponse` from tenant search, where `partial` and `failed_identities` are always present.
      allOf:
        - $ref: '#/components/schemas/SearchResponse'
        - type: object
          required: [partial, failed_identities]
    AttachmentHit:
      type: object
      required: [attachment_id, filename, page]
      properties:
        attachment_id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: [string, 'null']
        page:
          type: [integer, 'null']
          minimum: 1
    SearchHit:
      type: object
      required: [message_id, thread_id, identity_id, date, direction, from, subject, snippet, score, why, attachment_hits, trust]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        date:
          type: string
          format: date-time
        direction: {$ref: '#/components/schemas/Direction'}
        from:
          oneOf:
            - $ref: '#/components/schemas/MailboxAddress'
            - type: 'null'
        subject:
          type: [string, 'null']
        snippet:
          type: string
          description: Untrusted content, at most `snippet_chars` characters.
        score:
          type: number
        why:
          type: array
          description: Why the hit matched, for example `ref:AB12CDE (attachment p.1)` or `attachment_text_unavailable`.
          items:
            type: string
        attachment_hits:
          type: array
          items: {$ref: '#/components/schemas/AttachmentHit'}
        trust: {$ref: '#/components/schemas/TrustSummary'}
    ThreadHit:
      type: object
      description: 'One row per thread, with `group_by: "thread"`.'
      required: [thread_id, subject, participants, message_count, last_at, snippet, why, top_message_id]
      properties:
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        identity_id:
          description: Set on tenant search.
          $ref: '#/components/schemas/IdentityId'
        subject:
          type: string
        participants:
          type: array
          items: {$ref: '#/components/schemas/MailboxAddress'}
        message_count:
          type: integer
          minimum: 0
        last_at:
          type: string
          format: date-time
        snippet:
          type: string
          description: The best snippet in the thread.
        why:
          type: array
          items:
            type: string
        top_message_id: {$ref: '#/components/schemas/MessageId'}
    FacetCounts:
      type: object
      description: Value → number of matching messages.
      additionalProperties:
        type: integer
        minimum: 0
    Facets:
      type: object
      description: >-
        Six keys, each the top 10 values by count (ties by value ascending); `month` lists the 24 most recent
        months that have messages, in the tenant time zone. Tenant search sums each identity's counts and
        re-applies the caps (FR-SRCH-5).
      required: [sender, sender_domain, month, label, attachment_type, category]
      properties:
        sender:
          description: The from address.
          $ref: '#/components/schemas/FacetCounts'
        sender_domain:
          description: The from address's domain.
          $ref: '#/components/schemas/FacetCounts'
        month:
          $ref: '#/components/schemas/FacetCounts'
        label:
          $ref: '#/components/schemas/FacetCounts'
        attachment_type:
          $ref: '#/components/schemas/FacetCounts'
        category:
          $ref: '#/components/schemas/FacetCounts'
    AgenticStatus:
      type: string
      description: >-
        `answered`; `insufficient_evidence` (the evidence does not answer the question); `budget_exhausted`
        (evidence returned, no answer or a partial one); `degraded` (hybrid results only, no answer).
      enum: [answered, insufficient_evidence, budget_exhausted, degraded]
    AgenticSentence:
      type: object
      required: [text, citations]
      properties:
        text:
          type: string
        citations:
          type: array
          description: Message IDs that support the sentence. Each is in the evidence set (verified by code).
          items: {$ref: '#/components/schemas/MessageId'}
    AgenticAnswer:
      type: object
      required: [text, sentences, confidence]
      properties:
        text:
          type: string
          description: The answer with inline citations like `[msg_…]`.
        sentences:
          type: array
          description: The sentences that survived citation verification.
          items: {$ref: '#/components/schemas/AgenticSentence'}
        confidence:
          type: number
          minimum: 0
          maximum: 1
    AgenticEvidence:
      description: A search hit used as evidence, with the quoted phrases the answer relies on.
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          required: [quotes]
          properties:
            quotes:
              type: array
              description: Phrases quoted from the source. Each appears verbatim in it (verified by code).
              items:
                type: string
    AgenticTraceStep:
      type: object
      description: >-
        One step of the agentic loop. `action` is one of the planner's read-only tools (for example `search`
        or `read_thread`) or `answer`. Steering attempts found in mail are flagged in the trace ([F10]).
      required: [step, action]
      properties:
        step:
          type: integer
          minimum: 1
        action:
          type: string
          examples: [search, read_thread, answer]
        q:
          type: string
        mode: {$ref: '#/components/schemas/SearchMode'}
        hits:
          type: integer
          minimum: 0
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        message_id: {$ref: '#/components/schemas/MessageId'}
        removed_sentences:
          type: integer
          minimum: 0
          description: '`answer` step: sentences removed by citation verification.'
        ms:
          type: integer
          minimum: 0
      additionalProperties: true
    AgenticUsage:
      type: object
      required: [steps, ms, model]
      properties:
        steps:
          type: integer
          minimum: 0
        ms:
          type: integer
          minimum: 0
        model:
          type: string
          examples: ['@cf/qwen/qwen3.8-27b']
    AgenticResponse:
      type: object
      required: [status, answer, evidence, trace, degraded, usage]
      properties:
        status: {$ref: '#/components/schemas/AgenticStatus'}
        answer:
          description: '`null` unless there is an answer (always `null` for `insufficient_evidence` and `degraded`).'
          oneOf:
            - $ref: '#/components/schemas/AgenticAnswer'
            - type: 'null'
        evidence:
          type: array
          items: {$ref: '#/components/schemas/AgenticEvidence'}
        trace:
          type: array
          items: {$ref: '#/components/schemas/AgenticTraceStep'}
        degraded:
          type: boolean
        usage: {$ref: '#/components/schemas/AgenticUsage'}
        partial:
          type: boolean
          description: Tenant search only. `true` when some identities missed the deadline ([F15]).
        failed_identities:
          type: array
          description: Tenant search only.
          items: {$ref: '#/components/schemas/IdentityId'}
    SearchHitList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/SearchHit'}

    Contact:
      type: object
      required: [address, name, domain, first_seen_at, last_seen_at, inbound_count, outbound_count, last_thread_id]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        name:
          type: [string, 'null']
        domain:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        inbound_count:
          type: integer
          minimum: 0
        outbound_count:
          type: integer
          minimum: 0
        last_thread_id:
          oneOf:
            - $ref: '#/components/schemas/ThreadId'
            - type: 'null'
    Verification:
      type: object
      description: A verification code or link, released only for authenticated mail from the expected sender domain ([E4]).
      required: [code, link, sender_domain]
      properties:
        code:
          type: [string, 'null']
          examples: [481 207]
        link:
          type: [string, 'null']
          format: uri
        sender_domain:
          type: string
          examples: [service.example]
    WaitResponse:
      type: object
      required: [message, verification, timed_out]
      properties:
        message:
          description: The matching message, or `null` on timeout.
          oneOf:
            - $ref: '#/components/schemas/Message'
            - type: 'null'
        verification:
          description: Set only when a code or link was found and the release conditions hold.
          oneOf:
            - $ref: '#/components/schemas/Verification'
            - type: 'null'
        timed_out:
          type: boolean

    # ── Webhooks ─────────────────────────────────────────────────────────────────────────────────

    WebhookEventFilter:
      description: An event type, or `*` for every event type, including types added later.
      oneOf:
        - $ref: '#/components/schemas/EventType'
        - type: string
          const: '*'
    Webhook:
      type: object
      required: [id, tenant_id, url, events, identity_ids, description, enabled, disabled_reason, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/WebhookId'}
        tenant_id:
          description: '`null` for a platform endpoint.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        url:
          type: string
          format: uri
        events:
          type: array
          items: {$ref: '#/components/schemas/WebhookEventFilter'}
        identity_ids:
          type: [array, 'null']
          description: Only events of these identities. `null` means every identity.
          items: {$ref: '#/components/schemas/IdentityId'}
        description:
          type: [string, 'null']
        enabled:
          type: boolean
        disabled_reason:
          type: [string, 'null']
          enum: [manual, failing, null]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookCreated:
      description: An endpoint with its signing secret. The secret is shown only in this response.
      allOf:
        - $ref: '#/components/schemas/Webhook'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              pattern: '^whsec_[A-Za-z0-9+/]+={0,2}$'
              description: '`whsec_` followed by the base64-encoded signing key.'
    WebhookCreateRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: HTTPS only. Private, loopback and reserved addresses are refused; redirects are not followed.
          examples: ['https://api.example.com/webhooks/mail']
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/WebhookEventFilter'}
        identity_ids:
          type: [array, 'null']
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentityId'}
        description:
          type: [string, 'null']
    WebhookUpdateRequest:
      type: object
      minProperties: 1
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/WebhookEventFilter'}
        identity_ids:
          type: [array, 'null']
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentityId'}
        description:
          type: [string, 'null']
        enabled:
          type: boolean
    RotateRequest:
      type: object
      properties:
        overlap_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: Hours the previous secret stays valid.
    WebhookDeliveryStatus:
      type: string
      enum: [succeeded, failed, dead]
    WebhookDelivery:
      type: object
      description: One delivery attempt of one event to one endpoint.
      required: [id, webhook_id, event_id, event_type, attempt, status, http_status, error, duration_ms, next_attempt_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/DeliveryId'}
        webhook_id: {$ref: '#/components/schemas/WebhookId'}
        event_id: {$ref: '#/components/schemas/EventId'}
        event_type: {$ref: '#/components/schemas/EventType'}
        attempt:
          type: integer
          minimum: 1
        status: {$ref: '#/components/schemas/WebhookDeliveryStatus'}
        http_status:
          type: [integer, 'null']
          description: The endpoint's HTTP status, when it answered.
        error:
          type: [string, 'null']
          description: Machine code when the attempt failed without a usable answer, for example `timeout`, `tls`, `dns` or `status_5xx`.
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: When the next retry is scheduled, if any.
        created_at:
          type: string
          format: date-time
    ReplayRequest:
      description: Replay events by ID, or by time range.
      oneOf:
        - $ref: '#/components/schemas/ReplayByIds'
        - $ref: '#/components/schemas/ReplayByRange'
    ReplayByIds:
      type: object
      required: [event_ids]
      properties:
        event_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/EventId'}
    ReplayByRange:
      type: object
      required: [since]
      properties:
        since:
          type: string
          format: date-time
          description: >-
            Events whose `occurred_at` is at or after this time. Only events at most 30 days old (or
            `retention.events_days`, if shorter) can be replayed.
        until:
          type: string
          format: date-time
        status:
          description: Only events whose latest delivery to this endpoint has this status.
          $ref: '#/components/schemas/WebhookDeliveryStatus'
    ReplayResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
          minimum: 0

    # ── Suppressions and lists ───────────────────────────────────────────────────────────────────

    SuppressionReason:
      type: string
      enum: [hard_bounce, complaint, unsubscribe, manual, provider]
    Suppression:
      type: object
      description: A suppressed recipient. Only a keyed hash of the address is stored, so it is shown masked.
      required: [address_hint, reason, created_at, expires_at]
      properties:
        address_hint:
          type: string
          examples: [j***@example.net]
        reason: {$ref: '#/components/schemas/SuppressionReason'}
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
          description: '`null` means permanent.'
    SuppressionCreateRequest:
      type: object
      required: [address]
      properties:
        address: {$ref: '#/components/schemas/EmailAddress'}
        reason:
          description: Defaults to `manual`.
          $ref: '#/components/schemas/SuppressionReason'
        note:
          type: string
    SuppressionDeleteRequest:
      type: object
      properties:
        confirm_complaint_removal:
          type: boolean
          default: false
          description: Required (`true`) to remove a `complaint` suppression. Audit-logged.
    ListDirection:
      type: string
      enum: [receive, send]
    ListKind:
      type: string
      enum: [allow, block]
    ListEntryValue:
      type: string
      description: An address (`user@example.com`) or a whole domain (`@example.com`).
      pattern: '^([^@\s]+@[^@\s]+|@[^@\s]+)$'
      examples: ['@example.com']
    ListEntry:
      type: object
      required: [direction, kind, entry, note, created_at]
      properties:
        direction: {$ref: '#/components/schemas/ListDirection'}
        kind: {$ref: '#/components/schemas/ListKind'}
        entry: {$ref: '#/components/schemas/ListEntryValue'}
        note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    ListEntryPutRequest:
      type: object
      properties:
        note:
          type: [string, 'null']

    # ── API keys ─────────────────────────────────────────────────────────────────────────────────

    ApiKey:
      type: object
      required: [id, name, level, mode, tenant_id, identity_id, permissions, expires_at, revoked_at, last_used_at, created_at]
      properties:
        id: {$ref: '#/components/schemas/KeyId'}
        name:
          type: string
        level: {$ref: '#/components/schemas/KeyLevel'}
        mode: {$ref: '#/components/schemas/Mode'}
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        identity_id:
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        permissions:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Permission'}
        expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: Updated at most once a minute.
        created_at:
          type: string
          format: date-time
    ApiKeyCreated:
      description: A key with its secret. The secret is shown only in this response.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              pattern: '^pmk_(live|test)_.{12}_.+$'
              description: '`pmk_live_<lookup12>_<secret>` or `pmk_test_<lookup12>_<secret>`.'
    ApiKeyCreateRequest:
      type: object
      description: >-
        `tenant_id` is required for `tenant` and `identity` keys, and `identity_id` for `identity` keys;
        neither is allowed on `platform` keys. `permissions` is required at every level, `platform`
        included (no implicit full set). Level, tenant, identity and permissions must lie within the
        caller's own (`403 key_scope_exceeded`), and each permission must be one the level can hold
        (`400 invalid_request`, `details.reason = "permission_not_allowed_for_level"`; see `Permission`).
      required: [name, level, permissions]
      properties:
        name:
          type: string
          minLength: 1
        level: {$ref: '#/components/schemas/KeyLevel'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Permission'}
        expires_at:
          type: [string, 'null']
          format: date-time

    # ── Privacy ──────────────────────────────────────────────────────────────────────────────────

    ErasureScope:
      type: string
      enum: [message, thread, counterparty, identity, tenant]
    ErasureStatus:
      type: string
      description: '`completed_with_holds`: the erasure finished but skipped held threads, listed in the receipt''s `held`. `canceled`: a tenant erasure superseded it.'
      enum: [queued, running, completed, completed_with_holds, failed, canceled]
    ErasureRequestCreate:
      description: An erasure request. `scope` selects which other fields are required.
      oneOf:
        - $ref: '#/components/schemas/ErasureRequestCreateMessage'
        - $ref: '#/components/schemas/ErasureRequestCreateThread'
        - $ref: '#/components/schemas/ErasureRequestCreateCounterparty'
        - $ref: '#/components/schemas/ErasureRequestCreateIdentity'
        - $ref: '#/components/schemas/ErasureRequestCreateTenant'
      discriminator:
        propertyName: scope
        mapping:
          message: '#/components/schemas/ErasureRequestCreateMessage'
          thread: '#/components/schemas/ErasureRequestCreateThread'
          counterparty: '#/components/schemas/ErasureRequestCreateCounterparty'
          identity: '#/components/schemas/ErasureRequestCreateIdentity'
          tenant: '#/components/schemas/ErasureRequestCreateTenant'
    ErasureRequestCreateMessage:
      type: object
      required: [tenant_id, scope, identity_id, message_id, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: message
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason:
          type: string
          minLength: 1
    ErasureRequestCreateThread:
      type: object
      required: [tenant_id, scope, identity_id, thread_id, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: thread
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        reason:
          type: string
          minLength: 1
    ErasureRequestCreateCounterparty:
      type: object
      required: [tenant_id, scope, counterparty_address, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: counterparty
        counterparty_address: {$ref: '#/components/schemas/EmailAddress'}
        reason:
          type: string
          minLength: 1
          examples: [Data subject request DSR-1182]
    ErasureRequestCreateIdentity:
      type: object
      required: [tenant_id, scope, identity_id, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: identity
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        reason:
          type: string
          minLength: 1
    ErasureRequestCreateTenant:
      type: object
      required: [tenant_id, scope, reason]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: tenant
        reason:
          type: string
          minLength: 1
    ErasureHeldItem:
      type: object
      required: [thread_id, reason]
      properties:
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        reason:
          type: string
    ErasureReceipt:
      type: object
      description: What was deleted in each store (FR-PRV-3), the held items skipped (FR-PRV-4), and the post-erasure probe.
      required: [messages_deleted, attachments_deleted, r2_objects_deleted, fts_rows_deleted, refs_deleted, vectors_deleted, events_deleted, identities_affected, held, probe]
      properties:
        messages_deleted:
          type: integer
          minimum: 0
        attachments_deleted:
          type: integer
          minimum: 0
        r2_objects_deleted:
          type: integer
          minimum: 0
        fts_rows_deleted:
          type: integer
          minimum: 0
        refs_deleted:
          type: integer
          minimum: 0
        vectors_deleted:
          type: integer
          minimum: 0
        events_deleted:
          type: integer
          minimum: 0
        identities_affected:
          type: array
          items: {$ref: '#/components/schemas/IdentityId'}
        held:
          type: array
          items: {$ref: '#/components/schemas/ErasureHeldItem'}
        probe:
          type: object
          description: Results of keyword and semantic probe queries run after the erasure. Both must be 0 (FR-SRCH-11).
          required: [keyword_hits, semantic_hits]
          properties:
            keyword_hits:
              type: integer
              minimum: 0
            semantic_hits:
              type: integer
              minimum: 0
    ErasureRequest:
      type: object
      required: [id, tenant_id, scope, status, created_at, completed_at, receipt]
      properties:
        id: {$ref: '#/components/schemas/ErasureRequestId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope: {$ref: '#/components/schemas/ErasureScope'}
        status: {$ref: '#/components/schemas/ErasureStatus'}
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        receipt:
          description: Set once the request has completed.
          oneOf:
            - $ref: '#/components/schemas/ErasureReceipt'
            - type: 'null'
        created_by_key_id:
          type: [string, 'null']
          description: The API key that started the request (`null` when a person started it in the console or the system started it, for example after a legal hold ended). Lets an operator list what a compromised key did ([J6]).
    ExportScope:
      type: string
      enum: [counterparty, identity]
    ExportStatus:
      type: string
      description: '`expired` once the download is no longer available (7 days after creation). `canceled`: a tenant erasure superseded it.'
      enum: [queued, running, completed, failed, canceled, expired]
    ExportCreate:
      description: A subject-access export. `scope` selects which other field is required.
      oneOf:
        - $ref: '#/components/schemas/ExportCreateCounterparty'
        - $ref: '#/components/schemas/ExportCreateIdentity'
      discriminator:
        propertyName: scope
        mapping:
          counterparty: '#/components/schemas/ExportCreateCounterparty'
          identity: '#/components/schemas/ExportCreateIdentity'
    ExportCreateCounterparty:
      type: object
      required: [tenant_id, scope, counterparty_address]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: counterparty
        counterparty_address: {$ref: '#/components/schemas/EmailAddress'}
    ExportCreateIdentity:
      type: object
      required: [tenant_id, scope, identity_id]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope:
          type: string
          const: identity
        identity_id: {$ref: '#/components/schemas/IdentityId'}
    Export:
      type: object
      required: [id, tenant_id, scope, status, size, created_at, expires_at, download_url]
      properties:
        id: {$ref: '#/components/schemas/ExportId'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        scope: {$ref: '#/components/schemas/ExportScope'}
        status: {$ref: '#/components/schemas/ExportStatus'}
        size:
          type: [integer, 'null']
          minimum: 0
          description: Bytes of the ZIP, once `completed`.
        download_url:
          type: [string, 'null']
          format: uri
          description: >-
            Set when `completed`: a signed link (`getSignedLink`), valid until `expires_at` (7 days), to a ZIP
            holding one `.eml` per message plus `messages.json`. Minted again on each `GET`.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the download link expires.
        created_at:
          type: string
          format: date-time

    # ── Usage and audit ──────────────────────────────────────────────────────────────────────────

    UsageDay:
      type: object
      required: [day, inbound, outbound, sends, triage, search, agentic, assertions, http_signatures, ai_neurons, storage_bytes]
      properties:
        day:
          type: string
          format: date
          description: The UTC day.
        inbound:
          type: integer
          minimum: 0
        outbound:
          type: integer
          minimum: 0
        sends:
          type: integer
          minimum: 0
          description: Metered sends (one per recipient the transport accepted).
        triage:
          type: integer
          minimum: 0
          description: Stored triage analyses.
        search:
          type: integer
          minimum: 0
        agentic:
          type: integer
          minimum: 0
        assertions:
          type: integer
          minimum: 0
          description: Agent assertions minted (`POST …/assertions`). Counted only; not metered against a plan allowance.
        http_signatures:
          type: integer
          minimum: 0
          description: Web Bot Auth HTTP signatures made (`POST …/http-signatures`). Counted only; not metered against a plan allowance.
        ai_neurons:
          type: integer
          minimum: 0
          description: Workers AI usage in neurons.
        storage_bytes:
          type: integer
          minimum: 0
    DailyUsage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/UsageDay'}
    BillingMode:
      type: string
      description: >-
        `metered` (the plan's allowances plus top-ups), `exempt` (no limits) or `disabled` (self-hosted
        without billing; only the daily caps in tenant policy apply).
      enum: [metered, exempt, disabled]
    UsageFeatureName:
      type: string
      description: A metered allowance.
      enum: [inboxes, sends, triage, custom_domains, storage_gb, seats]
    UsageFeature:
      type: object
      description: The state of one allowance in the current period.
      required: [feature, granted, used, remaining, unlimited, resets_at]
      properties:
        feature: {$ref: '#/components/schemas/UsageFeatureName'}
        granted:
          type: [integer, 'null']
          minimum: 0
          description: The allowance, top-ups included. `null` when unlimited.
        used:
          type: integer
          minimum: 0
          description: For `storage_gb`, measured, rounded up, and refreshed at least hourly.
        remaining:
          type: [integer, 'null']
          minimum: 0
          description: '`null` when unlimited.'
        unlimited:
          type: boolean
        resets_at:
          type: [string, 'null']
          format: date-time
          description: When a monthly allowance resets; `null` for counts.
    PlanState:
      type: object
      description: The workspace's current plan.
      required: [plan_id, status, current_period_end, cancel_at_period_end]
      properties:
        plan_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          examples: [developer]
        status:
          type: string
          enum: [active, trialing, past_due, canceled, incomplete]
        current_period_end:
          type: string
          format: date-time
        cancel_at_period_end:
          type: boolean
    Plan:
      type: object
      description: A plan of the catalog (`PM_PLAN_CATALOG`). Stripe price IDs are never returned.
      required: [plan_id, name, price, currency, interval, included, topups, support]
      properties:
        plan_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          examples: [free]
        name:
          type: string
          examples: [Free]
        price:
          type: number
          minimum: 0
          description: Display only.
        currency:
          type: string
          examples: [gbp]
        interval:
          type: string
          examples: [month]
        included:
          type: object
          description: The allowance of each feature; `null` means unlimited.
          required: [inboxes, sends, triage, custom_domains, storage_gb, seats]
          properties:
            inboxes:
              type: [integer, 'null']
              minimum: 0
            sends:
              type: [integer, 'null']
              minimum: 0
            triage:
              type: [integer, 'null']
              minimum: 0
            custom_domains:
              type: [integer, 'null']
              minimum: 0
            storage_gb:
              type: [integer, 'null']
              minimum: 0
            seats:
              type: [integer, 'null']
              minimum: 0
        topups:
          type: boolean
          description: Whether top-ups can be bought on this plan.
        support:
          type: string
          enum: [github_issues, email, priority_email]
    Topups:
      type: object
      description: Top-up units held, per feature that has top-ups.
      required: [inboxes, sends, triage]
      properties:
        inboxes:
          type: integer
          minimum: 0
        sends:
          type: integer
          minimum: 0
        triage:
          type: integer
          minimum: 0
    UsageSummary:
      type: object
      required: [billing, plan, features, topups, plans]
      properties:
        billing: {$ref: '#/components/schemas/BillingMode'}
        plan: {$ref: '#/components/schemas/PlanState'}
        features:
          type: array
          items: {$ref: '#/components/schemas/UsageFeature'}
        topups: {$ref: '#/components/schemas/Topups'}
        plans:
          type: array
          description: The plan catalog.
          items: {$ref: '#/components/schemas/Plan'}
    PlanCatalog:
      type: object
      required: [billing_enabled, data]
      properties:
        billing_enabled:
          type: boolean
          description: '`false` on a deployment without billing, with an empty `data`.'
        data:
          type: array
          items: {$ref: '#/components/schemas/Plan'}
    BillingAccount:
      type: object
      description: A workspace's billing account.
      required: [tenant_id, mode, plan, topups]
      properties:
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        mode: {$ref: '#/components/schemas/BillingMode'}
        plan: {$ref: '#/components/schemas/PlanState'}
        topups: {$ref: '#/components/schemas/Topups'}
    BillingAccountUpdateRequest:
      type: object
      minProperties: 1
      properties:
        mode: {$ref: '#/components/schemas/BillingMode'}
        plan_id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: >-
            A complimentary plan from the catalog. Only for workspaces without a Stripe subscription
            (`409 plan_managed_by_stripe` otherwise).
    AuditEvent:
      type: object
      required: [id, tenant_id, actor_key_id, actor_user_id, action, target_type, target_id, details, request_id, created_at]
      properties:
        id: {$ref: '#/components/schemas/AuditEventId'}
        tenant_id:
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        actor_key_id:
          description: The key that acted, or `null` for a console user or the system (for example retention purges).
          oneOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        actor_user_id:
          description: The console user who acted, or `null` for an API key or the system.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        action:
          type: string
          examples: [key.create, quarantine.release]
        target_type:
          type: [string, 'null']
        target_id:
          type: [string, 'null']
        details:
          type: [object, 'null']
          description: Never message content or clear-text addresses.
        request_id:
          oneOf:
            - $ref: '#/components/schemas/RequestId'
            - type: 'null'
        created_at:
          type: string
          format: date-time

    # ── Members ──────────────────────────────────────────────────────────────────────────────────

    MemberRole:
      type: string
      description: The owner is set at workspace creation or by an ownership transfer in the console.
      enum: [owner, admin, member, viewer]
    InvitationRole:
      type: string
      enum: [admin, member, viewer]
    Member:
      type: object
      required: [user_id, email, name, role, last_login_at, created_at]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
        email: {$ref: '#/components/schemas/EmailAddress'}
        name:
          type: [string, 'null']
        role: {$ref: '#/components/schemas/MemberRole'}
        last_login_at:
          type: [string, 'null']
          format: date-time
          description: The person's last console sign-in, from `users.last_login_at`; `null` before the first.
        created_at:
          type: string
          format: date-time
    Invitation:
      type: object
      description: A pending invitation. It uses a seat until it is accepted, revoked or expires.
      required: [id, email, role, invited_by, expires_at]
      properties:
        id: {$ref: '#/components/schemas/InvitationId'}
        email: {$ref: '#/components/schemas/EmailAddress'}
        role: {$ref: '#/components/schemas/InvitationRole'}
        invited_by:
          description: The console user who sent it, or `null` when an API key created it.
          oneOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        expires_at:
          type: string
          format: date-time
    InvitationCreateRequest:
      type: object
      required: [email, role]
      properties:
        email: {$ref: '#/components/schemas/EmailAddress'}
        role: {$ref: '#/components/schemas/InvitationRole'}
    MemberList:
      type: object
      required: [data, invitations, seats]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Member'}
        invitations:
          type: array
          description: Pending invitations.
          items: {$ref: '#/components/schemas/Invitation'}
        seats:
          type: object
          description: Members plus pending invitations count as used seats.
          required: [granted, used]
          properties:
            granted:
              type: [integer, 'null']
              minimum: 0
              description: '`null` when unlimited.'
            used:
              type: integer
              minimum: 0

    # ── Platform operations ──────────────────────────────────────────────────────────────────────

    SigningKeyPurpose:
      type: string
      description: >-
        What a deployment signing key signs: `thread` (thread tokens), `link` (download links, console
        sign-in, invitation and session tokens, OAuth state hashes), `cursor` (search cursors) or
        `web_bot_auth` (Web Bot Auth HTTP signatures and the key directory).
      enum: [thread, link, cursor, web_bot_auth]
    SigningKeyRotation:
      type: object
      description: The result of a signing-key rotation. Key material is never returned.
      required: [purpose, kid, created_at, previous]
      properties:
        purpose: {$ref: '#/components/schemas/SigningKeyPurpose'}
        kid:
          type: string
          description: >-
            The new current key's ID: one character for `thread`, `link` and `cursor`; the 43-character
            JWK thumbprint (base64url) for `web_bot_auth`.
          examples: ['4', poqkLGiymh_W0uP6PZFw-dvez3QJT5SolqXBCW38r0U]
        created_at:
          type: string
          format: date-time
        previous:
          type: [object, 'null']
          description: >-
            The key it replaced, and until when it keeps verifying (90 days for `thread`, 7 days for `link`
            and `web_bot_auth`, 24 hours for `cursor`; the rotation time with `revoke_previous=true`). A
            previous `web_bot_auth` key stays in the key directory until then. `null` when the purpose had no
            key yet: the rotation then creates the first one.
          required: [kid, verify_until, revoked]
          properties:
            kid:
              type: string
              examples: ['3']
            verify_until:
              type: string
              format: date-time
            revoked:
              type: boolean
              description: '`true` when the request set `revoke_previous=true` and the previous key was deleted.'
    DlqQueue:
      type: string
      description: The source queue of a dead-letter item.
      enum: [pm-inbound, pm-outbound, pm-delivery-events, pm-webhooks, pm-index]
    DlqItem:
      type: object
      description: >-
        A dead-lettered queue message. The stored body is not returned: it is a pointer, and inbound
        pointers carry envelope addresses. Kept for 14 days.
      required: [id, queue, kind, tenant_id, first_seen_at, redriven_at, redrive_count]
      properties:
        id: {$ref: '#/components/schemas/DlqItemId'}
        queue: {$ref: '#/components/schemas/DlqQueue'}
        kind:
          type: [string, 'null']
          description: The body's `kind`, if any.
          examples: [message]
        tenant_id:
          description: The tenant the body names, if any.
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        first_seen_at:
          type: string
          format: date-time
        redriven_at:
          type: [string, 'null']
          format: date-time
        redrive_count:
          type: integer
          minimum: 0
    DlqItemPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/DlqItem'}
        next_cursor:
          type: [string, 'null']
    JobKind:
      type: string
      description: >-
        `reparse` (re-parse messages from raw MIME and re-emit their events with `reprocessed: true`),
        `reembed` (re-chunk and re-embed into Vectorize) or `reindex` (rebuild the keyword index).
      enum: [reparse, reembed, reindex]
    JobStatus:
      type: string
      enum: [queued, running, completed, failed, canceled]
    JobCreateRequest:
      type: object
      required: [kind, tenant_id]
      properties:
        kind: {$ref: '#/components/schemas/JobKind'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        identity_ids:
          type: [array, 'null']
          description: Only these identities. `null` or omitted means every identity of the tenant.
          uniqueItems: true
          items: {$ref: '#/components/schemas/IdentityId'}
        after:
          type: [string, 'null']
          format: date-time
          description: Only messages at or after this time.
        before:
          type: [string, 'null']
          format: date-time
          description: Only messages before this time.
    Job:
      type: object
      required: [id, kind, tenant_id, status, created_at, completed_at, result]
      properties:
        id: {$ref: '#/components/schemas/JobId'}
        kind: {$ref: '#/components/schemas/JobKind'}
        tenant_id: {$ref: '#/components/schemas/TenantId'}
        status: {$ref: '#/components/schemas/JobStatus'}
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        result:
          type: [object, 'null']
          description: Counts, once the job ends (for `reparse`, including the messages skipped past `raw_days`).
          additionalProperties:
            type: integer
            minimum: 0
        created_by_key_id:
          type: [string, 'null']
          description: The API key that started the job, or `null` for a job the system started itself (for example the `reembed` job that the cron creates during an embedding-model change).
    WaitlistInviteRequest:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 500
          description: How many entries to invite, oldest confirmed first.
          examples: [50]
        plan:
          type: [string, 'null']
          description: Invite only entries whose plan of interest is this plan. `null` or omitted means any plan.
          examples: [team]
    WaitlistInviteResult:
      type: object
      required: [invited, waiting]
      properties:
        invited:
          type: integer
          minimum: 0
          description: Entries invited by this request.
        waiting:
          type: integer
          minimum: 0
          description: Confirmed entries still not invited.

    # ── Provider hooks ───────────────────────────────────────────────────────────────────────────

    SnsMessage:
      type: object
      description: >-
        An Amazon SNS HTTP(S) message, as SNS sends it. Only `SubscriptionConfirmation` and `Notification`
        messages for the endpoint's own topic are acted on: `PM_SES_SNS_TOPIC_ARN` for `/hooks/ses`,
        `PM_SES_INBOUND_TOPIC_ARN` for `/hooks/ses/inbound`.
      required: [Type, MessageId, TopicArn, Message, Timestamp, SignatureVersion, Signature, SigningCertURL]
      properties:
        Type:
          type: string
          examples: [Notification, SubscriptionConfirmation]
        MessageId:
          type: string
        TopicArn:
          type: string
        Subject:
          type: string
        Message:
          type: string
          description: >-
            For a notification, the SES event (`/hooks/ses`) or the SES receipt notification
            (`/hooks/ses/inbound`) as a JSON string.
        Timestamp:
          type: string
          format: date-time
        SignatureVersion:
          type: string
          description: Must be `2` (SHA256withRSA). Version `1` (SHA1withRSA) is refused with `403 invalid_signature`.
          enum: ['2']
        Signature:
          type: string
        SigningCertURL:
          type: string
          format: uri
          description: Must be `https` on the host `sns.{PM_SES_REGION}.amazonaws.com`.
        SubscribeURL:
          type: string
          format: uri
          description: '`SubscriptionConfirmation` only.'
        Token:
          type: string
          description: '`SubscriptionConfirmation` only.'
        UnsubscribeURL:
          type: string
          format: uri
      additionalProperties: true

    # ── Well-known ───────────────────────────────────────────────────────────────────────────────

    Jwks:
      type: object
      description: A JSON Web Key Set (RFC 7517).
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: '#/components/schemas/Jwk'}
    Jwk:
      type: object
      description: An Ed25519 public key (RFC 8037).
      required: [kty, crv, x, kid, alg]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: Ed25519
        x:
          type: string
          description: The public key, base64url-encoded.
        kid:
          type: string
        alg:
          type: string
          const: EdDSA
        use:
          type: string
          const: sig

    # ── Identity keys and signatures ─────────────────────────────────────────────────────────────

    IdentityKeyKid:
      type: string
      description: >-
        An identity key's ID: the base64url RFC 7638 thumbprint of its public JWK (RFC 8037, appendix A.3).
        A deleted identity's key IDs are tombstoned and never published again.
      pattern: '^[A-Za-z0-9_-]{43}$'
      examples: [kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k]
    IdentityKeyStatus:
      type: string
      description: >-
        `active` (signs and is published; at most one per identity), `retiring` (published, does not sign,
        until `verify_until`) or `retired` (not published; kept until the identity is deleted, so its
        thumbprint is never reused).
      enum: [active, retiring, retired]
    IdentityKey:
      type: object
      description: >-
        One Ed25519 signing key of an identity. The private key is sealed under `PM_MASTER_KEY`, never
        leaves the Worker and is never returned.
      required: [kid, identity_id, status, alg, public_jwk, created_at, verify_until, retired_at]
      properties:
        kid: {$ref: '#/components/schemas/IdentityKeyKid'}
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        status: {$ref: '#/components/schemas/IdentityKeyStatus'}
        alg:
          type: string
          const: EdDSA
        public_jwk:
          description: The public key as published in the identity's JWK Set.
          $ref: '#/components/schemas/Jwk'
        created_at:
          type: string
          format: date-time
        verify_until:
          type: [string, 'null']
          format: date-time
          description: >-
            Set when the key becomes `retiring`: the rotation time plus `PM_IDENTITY_KEY_OVERLAP_DAYS`
            (default 7 days). The key stays in the JWK Set until then, unless it is revoked. `null` while the
            key is `active`.
        retired_at:
          type: [string, 'null']
          format: date-time
          description: When the key became `retired`; `null` before that.
      examples:
        - kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
          identity_id: idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y
          status: retiring
          alg: EdDSA
          public_jwk:
            kty: OKP
            crv: Ed25519
            x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
            kid: kPrK_qmxVWaYVA9wwBF6Iuo3vVzz7TxHCTwXBygrS4k
            alg: EdDSA
            use: sig
          created_at: '2026-10-02T09:00:00Z'
          verify_until: '2026-10-16T09:00:00Z'
          retired_at: null
    IdentityKeyPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/IdentityKey'}
        next_cursor:
          type: [string, 'null']
    IdentityKeyRotation:
      type: object
      description: The result of rotating an identity key.
      required: [key, previous]
      properties:
        key:
          description: The new key, `active`.
          $ref: '#/components/schemas/IdentityKey'
        previous:
          description: >-
            The key that was active, now `retiring` with `verify_until` set; `null` when the identity had
            no active key and the rotation created the first one.
          oneOf:
            - $ref: '#/components/schemas/IdentityKey'
            - type: 'null'
    AssertionRequest:
      type: object
      description: A request for an agent assertion.
      required: [audience]
      properties:
        audience:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[\x20-\x7E]{1,256}$'
          description: >-
            The verifier's expected audience, a URL or an identifier: 1–256 characters of printable ASCII.
            Becomes the `aud` claim ([O4]).
          examples: ['https://portal.supplier.example']
        expires_in:
          type: integer
          minimum: 60
          maximum: 600
          default: 300
          description: Seconds until the token expires ([O5]).
        nonce:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x20-\x7E]{1,128}$'
          description: Copied into the `nonce` claim, for the verifier's own challenge. 1–128 characters of printable ASCII.
        ext:
          type: object
          description: >-
            Extra claims placed under the `ext` claim: at most 2 KB as JSON, and no member may use a
            registered or Pylota claim name, so a claim the service sets is never overwritten ([O6]).
          propertyNames:
            not:
              enum: [iss, sub, aud, iat, nbf, exp, jti, email, email_verified, name, org, accountable_human, ai_agent, nonce, ext]
          examples:
            - booking_ref: BK-2291
    AssertionResponse:
      type: object
      description: A minted agent assertion. Neither the token nor its claims are stored.
      required: [assertion, kid, expires_at, jwks_uri]
      properties:
        assertion:
          type: string
          description: >-
            The token, a compact JWS (RFC 7519) with header `{"alg":"EdDSA","typ":"agent-assertion+jwt","kid":…}`
            and the claims `iss`, `sub`, `aud`, `iat`, `nbf`, `exp`, `jti`, `email`, `email_verified`, `name`,
            `org`, `accountable_human`, `ai_agent`, and `nonce` and `ext` when given.
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        kid: {$ref: '#/components/schemas/IdentityKeyKid'}
        expires_at:
          type: string
          format: date-time
          description: The `exp` claim.
        jwks_uri:
          type: string
          format: uri
          description: The identity's JWK Set, `https://{PM_API_HOST}/.well-known/jwks/{identity_id}.json`.
    HttpSignatureRequest:
      type: object
      description: A request for Web Bot Auth signature headers.
      required: [url]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://'
          description: >-
            The URL the agent will request: `https` only, at most 2,048 characters. An internationalised host
            is converted to its A-label for `@authority` ([O10]).
          examples: ['https://www.brightwell.example/fleet/availability?from=2026-10-12']
        method:
          type: string
          pattern: '^[!#$%&''*+.^_`|~0-9A-Z-]+$'
          description: >-
            The request method, an upper-case token. Signed only if `@method` is in `components`, and then
            required (`400 invalid_request` without it).
          examples: [GET]
        expires_in:
          type: integer
          minimum: 30
          maximum: 300
          default: 60
          description: Seconds until the signature expires. Too short an expiry fails in transit ([O11]).
        components:
          type: array
          uniqueItems: true
          description: >-
            The components to sign. `@authority`, `signature-agent` and `from` are always signed; `@method`,
            `@path` and `@query` may be added. Any other component, or one whose value is not ASCII, is
            refused with `400 invalid_request` ([O10]).
          items:
            type: string
            enum: ['@authority', signature-agent, from, '@method', '@path', '@query']
          default: ['@authority', signature-agent, from]
    HttpSignatureResponse:
      type: object
      description: The headers to attach to the request. Nothing is stored.
      required: [headers, expires_at]
      properties:
        headers:
          type: object
          required: [Signature-Agent, From, Signature-Input, Signature]
          properties:
            Signature-Agent:
              type: string
              description: The deployment's origin as a structured-field string, in double quotes.
              examples: ['"https://mail.example.com"']
            From:
              description: The identity's primary address.
              $ref: '#/components/schemas/EmailAddress'
            Signature-Input:
              type: string
              description: >-
                RFC 9421 signature parameters: the components, `created`, `expires`, `keyid` (the deployment
                key's JWK thumbprint), `alg="ed25519"`, a base64 `nonce` of 64 random bytes and
                `tag="web-bot-auth"`.
            Signature:
              type: string
              description: The RFC 9421 signature, made with the deployment's active `web_bot_auth` key.
        expires_at:
          type: string
          format: date-time
          description: When the signature expires (`expires` in `Signature-Input`).
    HttpMessageSignaturesDirectory:
      type: object
      description: >-
        The Web Bot Auth key directory: a JWK Set (RFC 7517) of the deployment's `active` and `retiring`
        Ed25519 keys, at most three. A verifier identifies a key by its RFC 8037 JWK thumbprint, which is the
        `keyid` of the signatures made with it.
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 3
          items: {$ref: '#/components/schemas/DirectoryJwk'}
    DirectoryJwk:
      type: object
      description: An Ed25519 public key in the Web Bot Auth key directory.
      required: [kty, crv, x]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: Ed25519
        x:
          type: string
          description: The public key, base64url-encoded without padding.

