  # ──────────────────────────────────────────── Privacy ───────────────────────────────────────────

  /erasure-requests:
    post:
      operationId: createErasureRequest
      tags: [Privacy]
      summary: Request an erasure
      description: |
        Deletes data for one scope and returns a receipt counting what was deleted in each store
        (FR-PRV-3). Keyword rows, references and vectors are removed together, and a probe query afterwards
        must return nothing (FR-SRCH-11). Held threads are skipped and listed in the receipt (FR-PRV-4); a
        hold never makes this request fail (no `423`).
        An `erasure.completed` event is emitted.

        | `scope` | Also needs | Deletes |
        |---|---|---|
        | `message` | `identity_id`, `message_id` | One message, its attachments, text, index rows, vectors, raw copies |
        | `thread` | `identity_id`, `thread_id` | Every message in the thread |
        | `counterparty` | `counterparty_address` | Every message to or from that address, in every identity of the tenant |
        | `identity` | `identity_id` | The whole mailbox. Its addresses are tombstoned |
        | `tenant` | none | Everything in the tenant. Then the tenant is marked `erased` |
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, tenant, identity]
      x-permission-notes: An identity key can only erase within its own identity (`message`, `thread` and `identity` scopes). `counterparty` needs a tenant or platform key; `tenant` needs a platform key or the tenant's own key.
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ErasureRequestCreate'}
            example:
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              scope: counterparty
              counterparty_address: jo@example.net
              reason: Data subject request DSR-1182
      responses:
        '202':
          description: The erasure request. It completes asynchronously (within 24 hours, NFR-PRV-1).
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequest'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      operationId: listErasureRequests
      tags: [Privacy]
      summary: List erasure requests
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: status
          in: query
          description: Only requests with this status.
          schema: {$ref: '#/components/schemas/ErasureStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of erasure requests.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErasureRequestPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/CursorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /erasure-requests/{erasure_id}:
    parameters:
      - $ref: '#/components/parameters/ErasureIdPath'
    get:
      operationId: getErasureRequest
      tags: [Privacy]
      summary: Get an erasure request
      description: >-
        The request and its status. `completed_with_holds` means the erasure finished but skipped held
