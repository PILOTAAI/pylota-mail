                    facets:
                      sender: {accounts@brightwell.example: 3}
                      sender_domain: {brightwell.example: 3}
                      month: {'2026-09': 3}
                      label: {invoice: 3}
                      attachment_type: {pdf: 3}
                      category: {billing: 3}
                    next_cursor: null
                    truncated: false
                    semantic_coverage: 0.994
                    degraded: false
                    as_of: '2026-10-09T10:12:00Z'
                    partial: true
                    failed_identities: [idn_01JA2B3C4D5E6F7G8H9J0K1M2N]
            text/event-stream:
