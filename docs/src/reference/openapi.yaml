                  - plan_id: free
                    name: Free
                    price: 0
                    currency: gbp
                    interval: month
                    included: {inboxes: 5, sends: 1000, triage: 500, custom_domains: 0, storage_gb: 1, seats: 1}
                    topups: false
                    support: github_issues
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /tenants/{tenant_id}/billing:
    parameters:
      - $ref: '#/components/parameters/TenantIdPath'
    get:
      operationId: getTenantBilling
      tags: [Usage]
      summary: Get a workspace's billing account
      description: Platform keys only.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      responses:
        '200':
          description: The workspace's billing account.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingAccount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      operationId: updateTenantBilling
      tags: [Usage]
      summary: Change a workspace's billing mode or plan
      description: >-
        Platform keys only. Accepts `mode` (`metered`, `exempt`, `disabled`) and, for workspaces without a
        Stripe subscription, `plan_id` (a complimentary plan). Plans paid through Stripe change only through
        Stripe: a `plan_id` on such a workspace returns `409 plan_managed_by_stripe`. Audit-logged.
      x-required-permission: ['tenants:manage']
      x-key-levels: [platform]
