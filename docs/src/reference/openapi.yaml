    post:
      operationId: searchTenant
      tags: [Search]
      summary: Search across a tenant's identities
      description: >-
        The same body and modes as `searchIdentity`, plus an optional `identity_ids` filter. Runs across
        every identity of the tenant, up to 100; more without an `identity_ids` filter returns
        `422 scope_too_large`. Hits carry `identity_id`. Needs a tenant or platform key: an identity key
        gets `403 scope_denied` ([F3], FR-SRCH-10). Facet counts are summed across identities. The response
        always carries `partial` and `failed_identities`: each identity's mailbox has 900 ms from the start
        of the fan-out, and one that errors or misses it is listed in `failed_identities` with
        `partial: true` ([F15]); otherwise they are `false` and `[]`. `mode: "agentic"` with agentic search
        turned off by tenant policy returns `422 agentic_disabled`.
