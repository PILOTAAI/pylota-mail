  # ──────────────────────────────────────── Usage and audit ───────────────────────────────────────

  /usage:
    get:
      operationId: getUsage
      tags: [Usage]
      summary: Get the plan and allowances
      description: |
        The workspace's plan and the state of every allowance in the current period. Agents read it to know
        their limits before they hit `402 billing_limit`.

        - **Who can read it.** Every tenant and identity key holds `usage:read` implicitly for its own
          workspace, so they can always call this without listing it. A platform key must hold `usage:read`
          explicitly and must pass `tenant_id`; without `tenant_id` it gets `400 invalid_request`.
        - `billing` is `metered`, `exempt` (no limits) or `disabled` (self-hosted without billing; `features`
          show the real `used` with `granted: null`, `remaining: null` and `unlimited: true`).
        - `used` for `storage_gb` is measured, rounded up, and refreshed at least hourly.
        - `granted` includes top-ups. `plans` is the catalog from `PM_PLAN_CATALOG`.
      x-required-permission: ['usage:read']
      x-key-levels: [platform, tenant, identity]
      x-permission-notes: >-
        Tenant and identity keys hold `usage:read` implicitly for their own workspace. Platform keys must
        hold it explicitly and pass `tenant_id` (`400 invalid_request` without it).
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - name: tenant_id
          in: query
          description: Required for platform keys (`400 invalid_request` without it). Other keys always read their own workspace.
          schema: {$ref: '#/components/schemas/TenantId'}
      responses:
        '200':
          description: The plan, every allowance and the plan catalog.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
              example:
                billing: metered
                plan:
                  plan_id: developer
                  status: active
                  current_period_end: '2026-11-01T00:00:00Z'
                  cancel_at_period_end: false
                features:
                  - {feature: inboxes, granted: 10, used: 4, remaining: 6, unlimited: false, resets_at: null}
                  - {feature: sends, granted: 12000, used: 8312, remaining: 3688, unlimited: false, resets_at: '2026-11-01T00:00:00Z'}
                  - {feature: triage, granted: 10000, used: 2210, remaining: 7790, unlimited: false, resets_at: '2026-11-01T00:00:00Z'}
                  - {feature: custom_domains, granted: 5, used: 1, remaining: 4, unlimited: false, resets_at: null}
                  - {feature: storage_gb, granted: 10, used: 2, remaining: 8, unlimited: false, resets_at: null}
                  - {feature: seats, granted: 2, used: 2, remaining: 0, unlimited: false, resets_at: null}
                topups:
                  inboxes: 0
                  sends: 2
                  triage: 0
                plans:
                  - plan_id: free
                    name: Free
                    price: 0
                    currency: gbp
                    interval: month
                    included: {inboxes: 5, sends: 1000, triage: 500, custom_domains: 0, storage_gb: 1, seats: 1}
                    topups: false
                    support: github_issues
        '400':
          description: >-
            The request is invalid, or a platform key did not pass `tenant_id` (`invalid_request`,
            `details.errors[0].path = "tenant_id"`).
          x-error-codes: [invalid_request]
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error:
                  code: invalid_request
                  message: 'tenant_id: required for a platform key.'
                  retryable: false
                  fix: Pass the workspace's tenant_id.
                  request_id: req_01J9Z4K8V4QW7X2M5N6P8R0T1Y
                  details:
                    errors:
                      - path: tenant_id
                        message: required for a platform key
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /usage/daily:
    get:
      operationId: getDailyUsage
      tags: [Usage]
      summary: Get daily usage
      description: >-
        Usage per UTC day. `from` and `to` are dates at most 92 days apart. A platform key can name a tenant
        with `tenant_id` and needs `usage:read` explicitly; a tenant key gets its own tenant and holds
        `usage:read` implicitly for it. `assertions` and `http_signatures` count signing calls, which are
        not metered against any plan allowance.
      x-required-permission: ['usage:read']
      x-key-levels: [platform, tenant]
      x-rate-limit-buckets: [api]
      x-idempotency: none
      parameters:
        - $ref: '#/components/parameters/TenantIdQuery'
        - name: from
          in: query
          description: First day, inclusive (UTC).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day, inclusive (UTC). At most 92 days after `from`.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One row per day.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyUsage'}
              example:
                data:
                  - day: '2026-10-08'
                    inbound: 312
                    outbound: 128
                    sends: 141
                    triage: 298
                    search: 940
                    agentic: 41
                    assertions: 57
                    http_signatures: 0
                    ai_neurons: 18233
                    storage_bytes: 2147483648
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /plans:
    get:
      operationId: listPlans
      tags: [Usage]
      summary: List the plan catalog
      description: >-
        No authentication. The plan catalog from `PM_PLAN_CATALOG`, as in the `plans` array of `getUsage`.
        A deployment without billing returns `{ "billing_enabled": false, "data": [] }`.
      security: []
      x-rate-limit-buckets: []
      x-idempotency: none
      responses:
        '200':
