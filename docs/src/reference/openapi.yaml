                tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
                scope: counterparty
                status: completed_with_holds
                created_at: '2026-10-09T10:00:00Z'
                completed_at: '2026-10-09T10:04:12Z'
                receipt:
                  messages_deleted: 14
                  attachments_deleted: 9
                  r2_objects_deleted: 38
                  fts_rows_deleted: 14
                  refs_deleted: 51
                  vectors_deleted: 63
                  events_deleted: 31
                  identities_affected: [idn_01J9Z3K8V4QW7X2M5N6P8R0T1Y, idn_01JA2B3C4D5E6F7G8H9J0K1M2N]
                  held:
                    - thread_id: thr_01JA2B3C4D5E6F7G8H9J0K1M2N
                      reason: PCN dispute WM12345678
                  probe:
                    keyword_hits: 0
                    semantic_hits: 0
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /exports:
    post:
      operationId: createExport
      tags: [Privacy]
      summary: Start a subject-access export
      description: >-
        Builds a ZIP holding one `.eml` per message plus `messages.json`. `scope` is `counterparty` (with
        `counterparty_address`: every message to or from it across the tenant's identities, FR-PRV-5) or
        `identity` (with `identity_id`: the whole mailbox). Returns `202` with the export
        (`status: "queued"`). When finished, the export has a `download_url` (a signed link valid until
        `expires_at`, 7 days) and an `export.completed` event is emitted.
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, tenant, identity]
      x-permission-notes: '`counterparty` scope needs a tenant or platform key. An identity key can export only its own identity.'
      x-rate-limit-buckets: [api]
      x-idempotency: optional
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportCreate'}
            example:
              tenant_id: ten_01J9Z3K8V4QW7X2M5N6P8R0T1Y
              scope: counterparty
              counterparty_address: jo@example.net
      responses:
        '202':
          description: The export, `queued`.
          headers:
            Request-Id: {$ref: '#/components/headers/Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /exports/{export_id}:
    parameters:
      - $ref: '#/components/parameters/ExportIdPath'
    get:
      operationId: getExport
      tags: [Privacy]
      summary: Get an export
      description: >-
        `status` is `queued`, `running`, `completed`, `failed` or `expired`. A `completed` export has
        `download_url`, a signed link (`getSignedLink`) valid until `expires_at`. The link is minted again on
        each `GET`.
      x-required-permission: ['erasure:manage']
      x-key-levels: [platform, tenant, identity]
      x-rate-limit-buckets: [api]
