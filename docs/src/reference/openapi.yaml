    BillingLimitReachedEvent:
      description: '`billing.limit_reached`: A plan allowance is spent. Sent once per feature per period, when the first `402 billing_limit` is returned.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, data]
          properties:
            type:
              const: billing.limit_reached
            data: {$ref: '#/components/schemas/BillingLimitReachedData'}

    # ── Event envelope and payloads ──────────────────────────────────────────────────────────────

    EventBase:
      type: object
      description: >-
        The envelope of every webhook event. Payloads are thin: IDs, a summary, verdicts and at most
        `policy.webhook_text_bytes` of `extracted_text` (FR-WH-4). Fetch anything else through the API.
        Events can arrive out of order: use `occurred_at` and `sequence` to discard stale updates.
      required: [id, type, api_version, occurred_at, tenant_id, identity_id, sequence, data]
      properties:
        id: {$ref: '#/components/schemas/EventId'}
        type: {$ref: '#/components/schemas/EventType'}
        api_version:
          type: string
          description: The payload schema date. A breaking payload change gets a new date; endpoints can pin the old one for 12 months.
          pattern: '^\d{4}-\d{2}-\d{2}$'
          examples: ['2026-10-01']
        occurred_at:
          type: string
          format: date-time
        tenant_id:
          description: '`null` only for deployment-level platform events.'
          oneOf:
            - $ref: '#/components/schemas/TenantId'
            - type: 'null'
        identity_id:
          description: '`null` for events that do not belong to one identity (domain, job and platform events).'
          oneOf:
            - $ref: '#/components/schemas/IdentityId'
            - type: 'null'
        sequence:
          type: [integer, 'null']
          minimum: 1
          description: >-
            Increases strictly per owner: per identity for mailbox events (`message.*`, `identity.*`,
            `verification.received`, `suppression.created`, `quota.warning`), per domain for `domain.*`
            events, and per job for `erasure.*` and `export.*` events. `null` for platform events
            (`webhook.disabled`, `webhook.test`, `member.*` and `billing.*`).
        data:
          type: object
          description: The payload; its schema depends on `type`.
    SendFailureReason:
      type: string
      description: |
        Why an accepted send did not go out normally (`data.reason` of `message.rejected`, `message.failed`
        and `message.uncertain`).

        | Reason | Status | Meaning |
        |---|---|---|
        | `provider_validation` | `rejected` | The transport refused the content (header, size, format) |
        | `sender_domain_unavailable` | `rejected` | The domain is not onboarded with the transport |
        | `recipient_suppressed_by_provider` | per recipient `suppressed` | The provider's own suppression list; synced into ours |
        | `quota_exhausted` | `failed` | The provider's daily limit, still exhausted after 24 hours of backoff, or an SMTP relay still unavailable after 24 hours of retries |
        | `transport_timeout` | `uncertain` | No answer from the transport. It may have been sent |
        | `transport_connection_lost` | `uncertain` | The connection dropped after the request was written |
        | `resolved_not_sent` | `failed` | A human resolved an uncertain send as not sent |
        | `domain_failing_no_fallback` | `failed` | The domain failed and fallback was disabled by policy |
      enum: [provider_validation, sender_domain_unavailable, recipient_suppressed_by_provider, quota_exhausted, transport_timeout, transport_connection_lost, resolved_not_sent, domain_failing_no_fallback]
    EventAttachment:
      type: object
      required: [id, filename, content_type, size]
      properties:
        id: {$ref: '#/components/schemas/AttachmentId'}
        filename:
          type: [string, 'null']
        content_type:
          type: string
        size:
          type: integer
          minimum: 0

    MessageReceivedData:
      type: object
      required: [message, thread_id, trust, extracted_text, extracted_text_truncated, attachments]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        trust: {$ref: '#/components/schemas/Trust'}
        extracted_text:
          type: [string, 'null']
          description: Up to `policy.webhook_text_bytes` (default 16 KB, maximum 64 KB) of `extracted_text`. Untrusted content.
        extracted_text_truncated:
          type: boolean
        attachments:
          type: array
          items: {$ref: '#/components/schemas/EventAttachment'}
    MessageQuarantinedData:
      type: object
      description: As `message.received`, plus `quarantine_reason`, and without `extracted_text`.
      required: [message, thread_id, trust, attachments, quarantine_reason]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        trust: {$ref: '#/components/schemas/Trust'}
        attachments:
          type: array
          items: {$ref: '#/components/schemas/EventAttachment'}
        quarantine_reason: {$ref: '#/components/schemas/QuarantineReason'}
    MessageReleasedData:
      type: object
      required: [message, released_by_key_id, released_by_user_id, reason]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        released_by_key_id:
          description: The API key that released the message, or `null` for a release by a person in the console.
          anyOf:
            - $ref: '#/components/schemas/KeyId'
            - type: 'null'
        released_by_user_id:
          description: The console user who released the message, or `null` for a release by API key.
          anyOf:
            - $ref: '#/components/schemas/UserId'
            - type: 'null'
        reason:
          type: string
    MessageTriagedData:
      type: object
      required: [message_id, thread_id, triage]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        thread_id: {$ref: '#/components/schemas/ThreadId'}
        triage: {$ref: '#/components/schemas/Triage'}
    MessageSentData:
      type: object
      required: [message, provider, provider_message_id, sent_via_fallback]
      properties:
        message: {$ref: '#/components/schemas/MessageSummary'}
        provider:
          type: string
          description: '`smtp` for a domain that sends through its own SMTP relay (`provider_message_id` is then `smtp:{host}:{Message-ID}`).'
          enum: [cloudflare, ses, smtp, simulator, loopback]
        provider_message_id:
          type: [string, 'null']
          description: '`null` when a person resolved an uncertain send as sent (`resolveMessage` with `outcome: "sent"`).'
        sent_via_fallback:
          type: boolean
          description: Sent from the identity's platform address because the domain was failing.
    MessageDeliveredData:
      type: object
      required: [message_id, recipient, smtp_code]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        smtp_code:
          type: [string, 'null']
    MessageDeferredData:
      type: object
      required: [message_id, recipient, smtp_code, smtp_response]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        smtp_code:
          type: [string, 'null']
        smtp_response:
          type: [string, 'null']
          maxLength: 512
    MessageBouncedData:
      type: object
      required: [message_id, recipient, bounce_type, smtp_code, smtp_response, suppressed]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        bounce_type:
          type: string
          enum: [hard, soft]
        smtp_code:
          type: [string, 'null']
        smtp_response:
          type: [string, 'null']
          maxLength: 512
        suppressed:
          type: boolean
          description: The recipient was added to the suppression list (hard bounces).
    MessageComplainedData:
      type: object
      required: [message_id, recipient, suppressed]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipient: {$ref: '#/components/schemas/EmailAddress'}
        suppressed:
          type: boolean
          const: true
          description: A complaint always creates a permanent suppression.
    MessageRejectedData:
      type: object
      required: [message_id, reason, detail]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason: {$ref: '#/components/schemas/SendFailureReason'}
        detail:
          type: [string, 'null']
          description: The transport's explanation, for example its error code.
    MessageFailedData:
      type: object
      required: [message_id, reason]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason: {$ref: '#/components/schemas/SendFailureReason'}
    MessageUncertainData:
      type: object
      required: [message_id, reason, fix]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        reason: {$ref: '#/components/schemas/SendFailureReason'}
        fix:
          type: string
          description: What to do, for example to check the recipient's mailbox and then call `resolve`.
    MessageReconciledData:
      type: object
      required: [message_id, status]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        status:
          description: The real status the uncertain send moved to.
          $ref: '#/components/schemas/OutboundStatus'
    MessageSuppressedData:
      type: object
      required: [message_id, recipients]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        recipients:
          type: array
          items: {$ref: '#/components/schemas/EmailAddress'}
    MessageCanceledData:
      type: object
      required: [message_id]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
    VerificationReceivedData:
      type: object
      description: The code or link itself is only available through `wait`.
      required: [message_id, sender_domain, kind]
      properties:
        message_id: {$ref: '#/components/schemas/MessageId'}
        sender_domain:
          type: string
        kind:
          type: string
          enum: [code, link]

    IdentityCreatedData:
      type: object
      required: [identity]
      properties:
        identity: {$ref: '#/components/schemas/Identity'}
    IdentityUpdatedData:
      type: object
      required: [identity, changed]
      properties:
        identity: {$ref: '#/components/schemas/Identity'}
        changed:
          type: array
          description: The names of the fields that changed.
          items:
            type: string
    IdentityPausedData:
      type: object
      required: [identity_id, reason, metrics]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        reason: {$ref: '#/components/schemas/PauseReason'}
        metrics:
          type: [object, 'null']
          description: For `abuse_threshold`, the complaint and bounce figures that triggered the pause; otherwise `null`.
    IdentityResumedData:
      type: object
      required: [identity_id]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
    IdentityDeletedData:
      type: object
      required: [identity_id, erasure_request_id]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        erasure_request_id: {$ref: '#/components/schemas/ErasureRequestId'}
    IdentityAddressData:
      type: object
      description: Payload of `identity.address_added`, `identity.address_activated` and `identity.address_retired`.
      required: [address]
      properties:
        address: {$ref: '#/components/schemas/Address'}
    IdentityAddressPromotedData:
      type: object
      required: [address, previous_primary]
      properties:
        address: {$ref: '#/components/schemas/Address'}
        previous_primary:
          description: The previous primary, now an alias with status `retiring` and its `retire_at`.
          $ref: '#/components/schemas/Address'

    IdentityKeyEventData:
      type: object
      description: Payload of `identity.key_created` and `identity.key_revoked`.
      required: [identity_id, kid]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        kid: {$ref: '#/components/schemas/IdentityKeyKid'}
    IdentityKeyRotatedData:
      type: object
      required: [identity_id, kid, previous_kid]
      properties:
        identity_id: {$ref: '#/components/schemas/IdentityId'}
        kid:
          description: The new active key.
          $ref: '#/components/schemas/IdentityKeyKid'
        previous_kid:
          description: The key now `retiring`, or `null` when the rotation created the identity's first key.
          oneOf:
            - $ref: '#/components/schemas/IdentityKeyKid'
            - type: 'null'

    DomainEventData:
      type: object
      description: Payload of `domain.created` and `domain.verified`.
      required: [domain]
      properties:
        domain: {$ref: '#/components/schemas/Domain'}
    DomainDegradedData:
      type: object
      required: [domain_id, issues]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/DomainIssue'}
    DomainFailingData:
      type: object
      required: [domain_id, issues, fallback_active]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        issues:
          type: array
          items: {$ref: '#/components/schemas/DomainIssue'}
        fallback_active:
          type: boolean
    DomainSuspendedData:
      type: object
      required: [domain_id, reason]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        reason:
          type: string
          enum: [failing_14_days, nameservers_changed, ownership_record_missing, registration_changed]
    DomainRecoveredData:
      type: object
      required: [domain_id, from_state]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        from_state: {$ref: '#/components/schemas/DomainState'}
    DomainReminderData:
      type: object
      required: [domain_id, state, hours_in_state]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        state: {$ref: '#/components/schemas/DomainState'}
        hours_in_state:
          type: integer
          description: 24, 72 and 168 (7 days); `504` (21 days) is the final reminder for a `nameservers` domain still `pending` before Cloudflare deletes its zone at 28 days.
          enum: [24, 72, 168, 504]
    DomainRemovedData:
      type: object
      required: [domain_id, reason]
      properties:
        domain_id: {$ref: '#/components/schemas/DomainId'}
        reason:
          type: string
          description: >-
            `requested`: removed through `DELETE /v1/domains/{domain_id}`. `zone_expired`: a `nameservers`
            zone was never activated and Cloudflare deleted it; the domain can be added again.
          enum: [requested, zone_expired]

    ErasureCompletedData:
      type: object
      required: [erasure_request]
      properties:
        erasure_request: {$ref: '#/components/schemas/ErasureRequest'}
    ErasureFailedData:
      type: object
      required: [erasure_request_id, step, error]
      properties:
        erasure_request_id: {$ref: '#/components/schemas/ErasureRequestId'}
        step:
          type: string
          description: The job step that failed, for example `delete_vectors`.
        error:
          type: string
    ExportCompletedData:
      type: object
      description: Fetch the download link with `getExport`.
      required: [export_id, expires_at]
      properties:
        export_id: {$ref: '#/components/schemas/ExportId'}
        expires_at:
          type: string
          format: date-time
    SuppressionCreatedData:
      type: object
      required: [address_hint, reason, source_message_id]
      properties:
        address_hint:
          type: string
          examples: [j***@example.net]
        reason: {$ref: '#/components/schemas/SuppressionReason'}
        source_message_id:
          oneOf:
            - $ref: '#/components/schemas/MessageId'
            - type: 'null'
    QuotaWarningData:
      type: object
      required: [metric, used, limit, scope]
      properties:
        metric:
          type: string
          description: The daily send cap that was reached. v1 emits this event only for `sends` (the tenant cap and each identity's cap); the agentic budget answers `429 agentic_budget_exhausted` without a warning event.
          enum: [sends]
        used:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 0
        scope:
          type: string
          enum: [tenant, identity]
    WebhookDisabledData:
      type: object
      required: [webhook_id, reason]
      properties:
        webhook_id: {$ref: '#/components/schemas/WebhookId'}
        reason:
          type: string
          description: Why the endpoint was disabled, for example `failing`.
    WebhookTestData:
      type: object
      required: [message]
      properties:
        message:
          type: string
          const: hello

    MemberInvitedData:
      type: object
      required: [invitation_id, email_hint, role]
      properties:
        invitation_id: {$ref: '#/components/schemas/InvitationId'}
        email_hint:
          type: string
          description: The invited address, masked.
          examples: [k***@acmecarhire.example]
        role: {$ref: '#/components/schemas/InvitationRole'}
    MemberJoinedData:
      type: object
      required: [user_id, role]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
        role: {$ref: '#/components/schemas/MemberRole'}
    MemberRoleChangedData:
      type: object
      required: [user_id, from, to]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
        from: {$ref: '#/components/schemas/MemberRole'}
        to: {$ref: '#/components/schemas/MemberRole'}
    MemberRemovedData:
      type: object
      required: [user_id]
      properties:
        user_id: {$ref: '#/components/schemas/UserId'}
    BillingPlanChangedData:
      type: object
      required: [from_plan, to_plan, reason]
      properties:
        from_plan:
          type: string
          examples: [free]
        to_plan:
          type: string
          examples: [developer]
        reason:
          type: string
          description: '`payment_recovered`: the plan was restored after a late payment.'
          enum: [checkout, portal, payment_failed_grace_ended, payment_recovered, canceled, operator]
    BillingPaymentFailedData:
      type: object
      required: [grace_until]
      properties:
        grace_until:
          type: string
          format: date-time
          description: The workspace keeps its plan until then.
    BillingLimitReachedData:
      type: object
      required: [feature, granted, resets_at]
      properties:
        feature: {$ref: '#/components/schemas/UsageFeatureName'}
        granted:
          type: [integer, 'null']
          minimum: 0
        resets_at:
          type: [string, 'null']
          format: date-time
