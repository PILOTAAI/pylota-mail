[book]
title = "Pylota Mail"
authors = ["Pylota"]
description = "Email and identity for AI agents. Source available under FSL-1.1-ALv2, written in Rust, runs on your own Cloudflare account."
language = "en"
src = "src"

[build]
# The landing page Worker serves the built docs at /docs/.
build-dir = "../site/public/docs"
create-missing = false

[output.html]
site-url = "/docs/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/pylota.css"]
git-repository-url = "https://github.com/PILOTAAI/pylota-mail"
edit-url-template = "https://github.com/PILOTAAI/pylota-mail/edit/main/docs/{path}"
no-section-label = true

[output.html.search]
enable = true
# Index sections at ## only. At the default (3) the full design set makes the search index exceed
# mdBook's 10 MB warning; search hits then land on the enclosing ## section.
heading-split-level = 2

# The design pages are written for implementers, who read them from the repository or browse them from
# the design index. Leaving them out of the site search keeps the index far below mdBook's 10 MB warning
# (about 4 MB, against 10.0 MB with them on 2026-10-10). The guides, reference, PRD, ADRs, build plan and
# edge-case register stay searchable.
[output.html.search.chapter]
"project/design" = { enable = false }

# Without this, book.js fetches play.rust-lang.org on pages with Rust code blocks:
# a third-party request the site CSP blocks and the docs promise not to make.
[output.html.playground]
runnable = false
