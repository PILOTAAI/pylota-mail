# Builds the docs into the landing page and deploys both, as one assets-only
# Worker, to pylotamail.com and www.pylotamail.com (site/wrangler.jsonc).
#
# Pull requests build only. A push to main, or a manual run, also deploys, then checks
# the live site (site/check-live.sh): both hostnames serve the page and the docs over
# HTTPS, and plain HTTP redirects to HTTPS.
# Every third-party action is pinned to a commit SHA, and the tools are pinned
# to exact versions (checked 2026-10-09).
#
# Secrets, on the `production` environment:
#   CLOUDFLARE_API_TOKEN   Account: Workers Scripts: Edit; Zone (pylotamail.com): Workers Routes: Edit, DNS: Edit
#   CLOUDFLARE_ACCOUNT_ID  the Pylota account
name: Site

on:
  pull_request:
    paths: ["site/**", "docs/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MDBOOK_VERSION: "0.5.4"
  WRANGLER_VERSION: "4.139.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, verified 2026-10-09
        with:
          persist-credentials: false
      - name: Install mdBook
        run: cargo install mdbook --version "$MDBOOK_VERSION" --locked
      - name: Build the docs into site/public/docs
        run: mdbook build docs
      - name: Check the output
        run: |
          test -f site/public/index.html
          test -f site/public/404.html
          test -f site/public/docs/index.html
          test -f site/public/docs/guides/plans.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified 2026-10-09
        with:
          name: site
          path: site/public
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # the live check retries each URL for up to two minutes
    environment:
      name: production
      url: https://pylotamail.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, verified 2026-10-09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, verified 2026-10-09
        with:
          name: site
          path: site/public
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, verified 2026-10-09
        with:
          node-version: "22" # wrangler 4.139.0 declares Node >= 22
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config site/wrangler.jsonc
      - name: Check the live site
        # The HTTP-to-HTTPS redirect comes from the zone setting "Always Use HTTPS", not
        # from this repo (site/README.md). This step fails until that setting is on.
        run: bash site/check-live.sh pylotamail.com www.pylotamail.com
